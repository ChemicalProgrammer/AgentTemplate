    document.getElementById('active-source-chips').innerHTML = items.slice(0, 5).map(item => `<button class="source-chip ${item.typeClass}" data-chip-tab="${item.tab}" title="Open ${item.tab} panel">${item.icon} ${escapeHtml(item.name)}</button>`).join('') + (items.length > 5 ? `<button class="source-chip source-chip-overflow">+${items.length - 5}</button>` : '') + countLabel;
    document.querySelectorAll('#active-source-chips [data-chip-tab]').forEach(chip => chip.addEventListener('click', () => showSideTab(chip.dataset.chipTab)));
  }

  function documentRelationCounts(nodeId) {
    const node = state.documentNodes.find(item => item.nodeId === nodeId);
    return {parents: node ? (node.parentIds || []).length : 0, children: state.documentNodes.filter(item => (item.parentIds || []).includes(nodeId)).length};
  }

  function relatedDocumentIds(nodeId) {
    const related = new Set([nodeId]);
    const visitParents = id => {
      const node = state.documentNodes.find(item => item.nodeId === id);
      (node && node.parentIds || []).forEach(parent => { if (!related.has(parent)) { related.add(parent); visitParents(parent); } });
    };
    const visitChildren = id => state.documentNodes.filter(item => (item.parentIds || []).includes(id)).forEach(child => { if (!related.has(child.nodeId)) { related.add(child.nodeId); visitChildren(child.nodeId); } });
    visitParents(nodeId); visitChildren(nodeId); return related;
  }

  function highlightDocumentRelations(nodeId) {
    const related = relatedDocumentIds(nodeId);
    document.querySelectorAll('.document-card').forEach(card => {
      card.classList.toggle('relation-focus', card.dataset.nodeId === nodeId);
      card.classList.toggle('relation-highlight', related.has(card.dataset.nodeId) && card.dataset.nodeId !== nodeId);
      card.classList.toggle('relation-dim', !related.has(card.dataset.nodeId));
    });
  }

  function clearDocumentHighlights() { document.querySelectorAll('.document-card').forEach(card => card.classList.remove('relation-focus','relation-highlight','relation-dim')); }

  function toggleDocumentMenu(event, button) {
    event.stopPropagation();
    const menu = button.nextElementSibling; const open = menu.classList.contains('hidden'); closeDocumentMenus();
    if (!open) return;
    const card = button.closest('.document-card'); const track = button.closest('.level-track'); const level = button.closest('.document-level');
    card.classList.add('menu-open'); if (track) track.classList.add('menu-open'); if (level) level.classList.add('menu-open');
    menu.classList.remove('hidden');
    requestAnimationFrame(() => {
      const panel = document.getElementById('side-panel-documents').getBoundingClientRect();
      const cardBox = card.getBoundingClientRect(); const menuBox = menu.getBoundingClientRect();
      const roomBelow = panel.bottom - cardBox.bottom; const roomAbove = cardBox.top - panel.top;
      menu.classList.toggle('open-up', menuBox.height > roomBelow && roomAbove > roomBelow);
    });
  }

  function closeDocumentMenus() {
    document.querySelectorAll('.document-menu').forEach(menu => { menu.classList.add('hidden'); menu.classList.remove('open-up'); });
    document.querySelectorAll('.document-card.menu-open,.level-track.menu-open,.document-level.menu-open').forEach(element => element.classList.remove('menu-open'));
  }

  function openDocumentNoteModal(nodeId) {
    const node = state.documentNodes.find(item => item.nodeId === nodeId); if (!node) return;
    closeDocumentMenus(); state.editingDocumentId = nodeId;
    document.getElementById('document-note-name').textContent = node.name;
    document.getElementById('document-note-text').value = node.note || '';
    openModal('document-note-modal'); document.getElementById('document-note-text').focus();
  }

  async function saveDocumentNote(event) {
    event.preventDefault();
    const nodeId = state.editingDocumentId; const node = state.documentNodes.find(item => item.nodeId === nodeId); if (!node) return closeModals();
    setBusy(event.target, true);
    try {
      const updated = await server('updateDocumentNote', state.currentProjectId, nodeId, document.getElementById('document-note-text').value);
      node.note = updated.note || ''; closeModals(); renderDocumentGraph(); showToast('Document note saved.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  async function submitSourceLink(event) {
    event.preventDefault(); setBusy(event.target, true);
    const pendingId = `pending:drive-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    state.pendingUploads.set(pendingId, {nodeId:pendingId,name:'Importing from Drive',mimeType:'application/octet-stream',size:0,createdAt:new Date().toISOString(),kind:'pending-upload',level:0,parentIds:[],indexStatus:'drive_importing',indexProgress:0});
    showSideTab('documents'); renderDocumentGraph();
    try {
      const result = await server('addSourceFromDrive', state.currentProjectId, document.getElementById('source-drive-url').value);
      const added = result.added || [];
      state.pendingUploads.delete(pendingId);
      addSourceNodesLocally_(added);
      closeModals(); event.target.reset(); showSideTab('documents');
      showToast(`${added.length} document${added.length === 1 ? '' : 's'} added. Semantic indexing is continuing in the background.`);
      queueSourceIndexes_(added.map(item => item.sourceId));
    } catch (error) { state.pendingUploads.delete(pendingId); renderDocumentGraph(); showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  async function uploadSourceFile(event) {
    const input = event.target; const file = input.files[0]; if (!file) return;
    if (file.size > 100 * 1024 * 1024) { input.value = ''; return showToast('Sources can be uploaded up to 100 MB. Split this file into separate volumes.', true); }
    const label = document.querySelector('.file-button'); setBusy(label, true);
    const pendingId = `pending:${Date.now()}-${Math.random().toString(36).slice(2)}`;
    state.pendingUploads.set(pendingId, {
      nodeId:pendingId,name:file.name,mimeType:file.type || 'application/octet-stream',size:file.size,
      createdAt:new Date().toISOString(),kind:'pending-upload',level:0,parentIds:[],indexStatus:'drive_uploading',indexProgress:0
    });
    showSideTab('documents'); renderDocumentGraph();
    let upload = null;
    try {
      upload = await server('startSourceUpload', state.currentProjectId, {name: file.name, mimeType: file.type || 'application/octet-stream', size: file.size});
      let offset = Number(upload.nextOffset || 0); let completed = null;
      while (offset < file.size) {
        const end = Math.min(file.size, offset + Number(upload.chunkBytes || 8 * 1024 * 1024));
        const base64 = await fileAsBase64(file.slice(offset, end));
        completed = await server('uploadSourceChunk', state.currentProjectId, upload.uploadId, offset, base64);
        offset = Number(completed.nextOffset || end);
        const pending = state.pendingUploads.get(pendingId);
        if (pending) { pending.indexProgress = Math.round(offset * 100 / file.size); renderDocumentGraph(); }
      }
      const source = completed && completed.source;
      if (!source) throw new Error('Drive did not confirm the completed upload.');
      state.pendingUploads.delete(pendingId);
      addSourceNodesLocally_([source]);
      queueSourceIndexes_([source.sourceId]);
      showToast('Document uploaded. Semantic indexing is continuing in the background.');
    } catch (error) {
      if (upload && upload.uploadId) { try { await server('cancelSourceUpload', state.currentProjectId, upload.uploadId); } catch (_) {} }
      state.pendingUploads.delete(pendingId); renderDocumentGraph();
      showToast(error.message, true);
    }
    finally { input.value = ''; setBusy(label, false); }
  }

  async function syncSourceIndex() {
    const button = document.getElementById('sync-source-index'); setBusy(button, true);
    try {
      let result = null;
      for (let pass = 0; pass < 16; pass++) {
        result = await server('syncProjectKnowledgeIndexes', state.currentProjectId);
        const sources = ((result.project || {}).sources || []).concat((result.agent || {}).sources || []);
        applySourceIndexResults_((result.project || {}).sources || []);
        const uploading = sources.filter(item => item.indexStatus === 'uploading');
        if (!uploading.length) break;
      }
      await refreshDocumentGraph();
      const sources = ((result.project || {}).sources || []).concat((result.agent || {}).sources || []);
      const failed = sources.filter(item => item.indexStatus === 'failed').length;
      const unknown = sources.filter(item => item.indexStatus === 'unknown').length;
      const processed = Number((result.project || {}).processed || 0) + Number((result.agent || {}).processed || 0);
      showToast(failed ? `Index sync completed with ${failed} failed source(s). Project sources show diagnostics; agent knowledge can be repaired from Agents.` : unknown ? `${unknown} source status could not be verified; this does not prove indexing failed.` : result.remaining ? `${processed} source(s) processed; ${result.remaining} remain. Run Sync index again.` : 'Agent knowledge and project sources are indexed.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

  async function indexSingleSource(sourceId, button) {
    closeDocumentMenus(); setBusy(button, true);
    try {
      const node = state.documentNodes.find(item => item.sourceId === sourceId);
      const restart = Boolean(node && ['ready','failed','unknown'].includes(node.indexStatus));
      const result = await continueSingleSourceIndex(sourceId, restart);
      await refreshDocumentGraph();
      showToast(result.indexStatus === 'ready' ? 'Source index verified.' : result.indexStatus === 'failed' ? 'Indexing failed. Open the red status for the exact cause.' : 'The complete source was accepted and Gemini is processing its index.');
    }
    catch (error) { await refreshDocumentGraph(); showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

  function resolveIndexNode_(sourceRef) {
    if (sourceRef && typeof sourceRef === 'object') return sourceRef;
    const value = String(sourceRef || '');
    const candidates = state.documentNodes.concat(state.backgroundIndexNodes || []);
    return candidates.find(item => item.nodeId === value) || candidates.find(item => item.kind === 'source' && item.sourceId === value) || candidates.find(item => item.sourceId === value);
  }

  async function continueSingleSourceIndex(sourceRef, restart) {
    const node = resolveIndexNode_(sourceRef);
    if (!node || !['source','agent-source'].includes(node.kind)) throw new Error('The source is no longer available.');
    const endpoint = node.kind === 'agent-source' ? 'indexProjectAgentSource' : 'indexProjectSource';
    let result = await server(endpoint, state.currentProjectId, node.sourceId, restart);
    applySourceIndexState_(node.nodeId, result);
    for (let pass = 0; result.indexStatus === 'uploading' && pass < 16; pass++) {
      result = await server(endpoint, state.currentProjectId, node.sourceId, false);
      applySourceIndexState_(node.nodeId, result);
    }
    if (result.indexStatus === 'indexing') scheduleSourceIndexPoll_(node.nodeId);
    return result;
  }

  function addSourceNodesLocally_(sources) {
    (sources || []).forEach(source => {
      const node = sourceToDocumentNode_(source);
      const existingIndex = state.documentNodes.findIndex(item => item.nodeId === node.nodeId);
      if (existingIndex >= 0) state.documentNodes[existingIndex] = Object.assign(state.documentNodes[existingIndex], node);
      else state.documentNodes.push(node);
      const backgroundIndex = state.backgroundIndexNodes.findIndex(item => item.nodeId === node.nodeId);
      if (backgroundIndex >= 0) state.backgroundIndexNodes[backgroundIndex] = Object.assign(state.backgroundIndexNodes[backgroundIndex], node);
      else state.backgroundIndexNodes.push(node);
      state.selectedSources.add(node.nodeId);
      if (!(state.projectDetails.sources || []).some(item => item.sourceId === source.sourceId)) state.projectDetails.sources.push(node);
    });
    state.panelLoaded.documents = true;
    rememberCurrentSelection();
    updateProjectCount('sourceCount', state.documentNodes.filter(node => node.kind === 'source').length);
    renderDocumentGraph();
  }

  function sourceToDocumentNode_(source) {
    return {
      nodeId:`source:${source.sourceId}`,sourceId:source.sourceId,driveId:source.driveId,name:source.name,
      mimeType:source.mimeType,size:Number(source.size || 0),createdAt:source.addedAt || source.updatedAt,
      updatedAt:source.updatedAt || source.addedAt,kind:'source',status:source.status || 'active',level:0,parentIds:[],
      note:source.note || '',indexStatus:source.indexStatus || 'queued',indexError:source.indexError || '',
      indexCheckError:source.indexCheckError || '',indexStage:source.indexStage || 'waiting_to_index',
      indexProgress:Number(source.indexProgress || 0),indexUpdatedAt:source.indexUpdatedAt || '',indexedAt:source.indexedAt || '',
      selectedByDefault:true,url:source.driveId ? `https://drive.google.com/open?id=${source.driveId}` : ''
    };
  }

  function applySourceIndexResults_(results) { (results || []).forEach(result => applySourceIndexState_(result.sourceId, result, false)); renderDocumentGraph(); }

  function applySourceIndexState_(sourceRef, result, rerender = true) {
    const node = resolveIndexNode_(sourceRef);
    if (!node || !result) return;
    const matching = state.documentNodes.concat(state.backgroundIndexNodes || []).filter(item => item.nodeId === node.nodeId || item.sourceId && item.sourceId === node.sourceId);
    matching.forEach(item => {
      item.indexStatus = result.indexStatus || item.indexStatus;
      item.indexStage = result.indexStage || '';
      item.indexProgress = Number(result.indexProgress || 0);
      item.indexError = result.indexError || '';
      item.indexCheckError = result.indexCheckError || '';
      item.indexUpdatedAt = result.indexUpdatedAt || item.indexUpdatedAt || '';
      item.indexedAt = result.indexedAt || item.indexedAt || '';
    });
    if (!['queued','uploading','indexing'].includes(node.indexStatus)) {
      const timer = state.sourceIndexTimers.get(node.nodeId); if (timer) clearTimeout(timer);
      state.sourceIndexTimers.delete(node.nodeId);
    }
    if (rerender) renderDocumentGraph();
  }

  function queueSourceIndexes_(sourceRefs) {
    const queue = [...new Set((sourceRefs || []).map(sourceRef => resolveIndexNode_(sourceRef)).filter(Boolean).map(node => node.nodeId))].filter(sourceRef => !state.activeIndexSources.has(sourceRef) && !state.sourceIndexTimers.has(sourceRef));
    const projectId = state.currentProjectId;
    const workerCount = Math.min(2, queue.length);
    const worker = async () => {
      const sourceRef = queue.shift(); if (!sourceRef || state.currentProjectId !== projectId) return;
      state.activeIndexSources.add(sourceRef);
      try { await continueSingleSourceIndex(sourceRef, false); }
      catch (error) {
        const node = resolveIndexNode_(sourceRef);
        if (node) { node.indexStatus = 'failed'; node.indexError = error.message; renderDocumentGraph(); }
      } finally {
        state.activeIndexSources.delete(sourceRef);
        if (queue.length) worker();
      }
    };
    for (let index = 0; index < workerCount; index++) worker();
  }

  function scheduleSourceIndexPoll_(sourceRef, delay = 3500) {
    const node = resolveIndexNode_(sourceRef); if (!node) return;
    const key = node.nodeId;
    const previous = state.sourceIndexTimers.get(key); if (previous) clearTimeout(previous);
    const projectId = state.currentProjectId;
    const timer = setTimeout(async () => {
      state.sourceIndexTimers.delete(key);
      if (state.currentProjectId !== projectId) return;
      try {
        const endpoint = node.kind === 'agent-source' ? 'indexProjectAgentSource' : 'indexProjectSource';
        const result = await server(endpoint, projectId, node.sourceId, false);
        applySourceIndexState_(key, result);
        if (result.indexStatus === 'indexing' || result.indexStatus === 'uploading') scheduleSourceIndexPoll_(key, 4000);
      } catch (error) {
        const currentNode = resolveIndexNode_(key);

  function startPanelResize(event) {
    if (window.innerWidth <= 760) return;
    event.preventDefault(); const workspace = document.getElementById('project-workspace'); const startX = event.clientX;
    const startWidth = document.getElementById('project-side-panel').getBoundingClientRect().width;
    document.body.classList.add('is-resizing'); event.currentTarget.setPointerCapture(event.pointerId);
    const move = moveEvent => setPanelWidth(startWidth + moveEvent.clientX - startX);
    const stop = () => { document.body.classList.remove('is-resizing'); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', stop); try { localStorage.setItem('gpa.projectPanelWidth', workspace.style.getPropertyValue('--project-panel-width')); } catch (_) {} };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', stop);
  }

  function resizePanelWithKeyboard(event) {

  function setPanelWidth(width) {

  function startViewerResize(event) {

  }

  function resizeViewerWithKeyboard(event) {
    if (!['ArrowLeft','ArrowRight'].includes(event.key)) return; event.preventDefault();
    const width = document.getElementById('document-viewer').getBoundingClientRect().width + (event.key === 'ArrowLeft' ? 20 : -20); setViewerWidth(width);
  }

  function setViewerWidth(width) {
    const workspace = document.getElementById('project-workspace');
    const chatCollapsed = workspace.classList.contains('chat-collapsed');
    const sideWidth = chatCollapsed ? 260 : document.getElementById('project-side-panel').getBoundingClientRect().width || 338;
    const reserved = sideWidth + (chatCollapsed ? 0 : 300) + 20 + 28;
    const max = Math.max(280, workspace.getBoundingClientRect().width - reserved);

  }

  function restoreViewerWidth() { try { const value = parseInt(localStorage.getItem('gpa.documentViewerWidth'), 10); if (Number.isFinite(value)) setViewerWidth(value); } catch (_) {} }

  function toggleChatPanel(forceCollapse) {
    if (window.innerWidth <= 760) {
      document.getElementById('project-side-panel').classList.toggle('mobile-open');
      return;
    }
    const collapse = typeof forceCollapse === 'boolean' ? forceCollapse : !state.chatCollapsed;
    setChatPanelCollapsed_(collapse, true);
  }

  function setChatPanelCollapsed_(collapsed, persist) {
    const workspace = document.getElementById('project-workspace');
    if (!workspace) return;
    state.chatCollapsed = Boolean(collapsed);
    workspace.classList.toggle('chat-collapsed', state.chatCollapsed);
    document.getElementById('chat-panel').setAttribute('aria-hidden', String(state.chatCollapsed));

      sideButton.setAttribute('aria-pressed', String(state.chatCollapsed));

    }
    if (persist) try { localStorage.setItem('gpa.chatPanelCollapsed', state.chatCollapsed ? '1' : '0'); } catch (_) {}
  }

  function restoreChatPanelState() {
    let collapsed = false;
    try { collapsed = localStorage.getItem('gpa.chatPanelCollapsed') === '1'; } catch (_) {}
    setChatPanelCollapsed_(collapsed && window.innerWidth > 760, false);
  }

  function askConfirmation({title, message, action, tone = 'danger'}) {
    if (state.confirmResolver) state.confirmResolver(false);
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-message').textContent = message;
    const confirmAction = document.getElementById('confirm-action');
    confirmAction.textContent = action || 'Continue';
    confirmAction.classList.toggle('danger-filled-btn', tone === 'danger');
    confirmAction.classList.toggle('primary-btn', tone !== 'danger');
    openModal('confirm-modal');
    return new Promise(resolve => { state.confirmResolver = resolve; });
  }

  function resolveConfirmation(value) {
    const resolver = state.confirmResolver; state.confirmResolver = null;
    document.getElementById('modal-backdrop').classList.add('hidden'); document.getElementById('confirm-modal').classList.add('hidden');
    if (resolver) resolver(value);
  }

  function openModal(id) {
    document.querySelectorAll('.modal').forEach(modal => modal.classList.add('hidden'));
    const modal = document.getElementById(id); modal.classList.remove('hidden'); document.getElementById('modal-backdrop').classList.remove('hidden');
    requestAnimationFrame(() => modal.classList.add('modal-visible'));
  }

  function closeModals() {
    if (state.confirmResolver) { const resolver = state.confirmResolver; state.confirmResolver = null; resolver(false); }
    document.getElementById('modal-backdrop').classList.add('hidden');
    document.querySelectorAll('.modal').forEach(modal => { modal.classList.add('hidden'); modal.classList.remove('modal-visible'); });
    state.editingDocumentId = null;
    state.diagnosingSourceId = null;
    state.pdfExportNodeId = null;
  }

  function syncDashboardFilters() { document.querySelectorAll('[data-dashboard-filter]').forEach(button => button.classList.toggle('active', button.dataset.dashboardFilter === state.dashboardFilter)); }
  function autoSizeComposer() { const el = document.getElementById('chat-input'); el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; }
  function scrollChatToBottom() { const region = document.getElementById('chat-scroll-region'); requestAnimationFrame(() => { region.scrollTop = region.scrollHeight; }); }
  function setBusy(element, busy) {
    if (!element) return;
    const targets = element.matches && element.matches('form') ? Array.from(element.querySelectorAll('button[type="submit"]')) : [element];
    targets.forEach(target => target.classList.toggle('is-loading', busy));
    Array.from(element.querySelectorAll ? element.querySelectorAll('button,input,textarea,select') : []).forEach(control => control.disabled = busy);
    if ('disabled' in element && !(element.matches && element.matches('form'))) element.disabled = busy;
  }
  function updateProjectCount(key, value) { const project = state.projects.find(item => item.projectId === state.currentProjectId); if (project) project[key] = value; }
  function fileAsBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file); }); }
  function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  function showToast(message, error = false) { const toast = document.getElementById('toast'); toast.textContent = String(message || (error ? 'The operation failed. Check Apps Script execution logs for details.' : 'Done.')); toast.classList.toggle('error', error); toast.classList.remove('hidden'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.add('hidden'), 5200); }
  function clientErrorMessage(error) {
    if (!error) return 'The server returned an empty error. Check Apps Script execution logs.';
    if (typeof error === 'string') return error || 'Unknown server error.';
    if (error.message) return String(error.message);
    if (error.details && error.details.message) return String(error.details.message);
    try { const text = JSON.stringify(error); return text && text !== '{}' ? text : String(error); }
    catch (_) { return String(error); }
  }
  function numberValue(value) { const number = Number(value); return Number.isFinite(number) && number >= 0 ? number : 0; }
  function statusLabel(status) { return ({active:'Ongoing',planning:'Planning',archived:'Archived'})[status] || status; }
  function projectColorStyle(colorKey) { const color = PROJECT_COLORS[colorKey] || PROJECT_COLORS.blue; return `--project-accent:${color.accent};--project-tint:${color.tint};--project-tint-strong:${color.tintStrong};`; }
  function initials(value) { return String(value || 'U').split(/[.\s_-]+/).filter(Boolean).slice(0,2).map(part => part[0].toUpperCase()).join('') || 'U'; }
  function shortEmail(email) { return String(email || '').split('@')[0]; }
  function formatDate(value) { if (!value) return ''; try { return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(value)); } catch (_) { return String(value); } }
  function formatDateTime(value) { if (!value) return ''; try { return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(value)); } catch (_) { return String(value); } }
  function indexStatusLabel(status) { return ({ready:'Indexed and verified',indexing:'Processing embeddings',uploading:'Uploading to File Search',queued:'Queued',failed:'Index failed',unknown:'Status could not be verified',not_indexed:'Not indexed'})[status] || status || 'Not indexed'; }
  function formatFileSize(bytes) { const value = Number(bytes || 0); if (!value) return '—'; const units = ['B','KB','MB','GB']; const index = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1); return `${(value / Math.pow(1024,index)).toFixed(index ? 1 : 0)} ${units[index]}`; }
  function friendlyMime(mime, name = '') {
    const lowerName = String(name || '').toLowerCase();
    if (/\.md$/.test(lowerName)) return 'Markdown';
    const map = {'application/vnd.google-apps.document':'Google Docs','application/vnd.google-apps.spreadsheet':'Google Sheets','application/vnd.google-apps.presentation':'Google Slides','application/pdf':'PDF','text/plain':'Text','text/csv':'CSV','text/markdown':'Markdown','application/json':'JSON','application/zip':'ZIP','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'Word','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'Excel','application/vnd.openxmlformats-officedocument.presentationml.presentation':'PowerPoint'};
    return map[mime] || (/^image\//.test(mime || '') ? 'Image' : String(mime || 'File').split('/').pop());
  }
  function fileTypeIcon(mime, name = '') {
    const type = fileTypeClass(mime, name);
    return ({'type-pdf':'PDF','type-sheet':'XLS','type-slide':'PPT','type-markdown':'MD','type-image':'IMG','type-json':'JSON','type-archive':'ZIP','type-text':'TXT','type-doc':'DOC','type-generic':'FILE'})[type] || 'FILE';
  }
  function fileTypeClass(mime, name = '') {
    const value = String(mime || '').toLowerCase(); const lowerName = String(name || '').toLowerCase();
    if (value === 'application/pdf' || /\.pdf$/.test(lowerName)) return 'type-pdf';
    if (/markdown/.test(value) || /\.md$/.test(lowerName)) return 'type-markdown';
    if (/spreadsheet|excel|csv/.test(value) || /\.(xlsx?|csv|tsv)$/.test(lowerName)) return 'type-sheet';
    if (/presentation|powerpoint/.test(value) || /\.(pptx?)$/.test(lowerName)) return 'type-slide';
    if (/^image\//.test(value) || /\.(png|jpe?g|gif|webp|svg)$/.test(lowerName)) return 'type-image';
    if (/json/.test(value) || /\.json$/.test(lowerName)) return 'type-json';
    if (/zip|compressed|archive/.test(value) || /\.(zip|rar|7z)$/.test(lowerName)) return 'type-archive';
    if (/document|word/.test(value) || /\.(docx?)$/.test(lowerName)) return 'type-doc';
    if (/^text\//.test(value) || /\.(txt|xml|ya?ml)$/.test(lowerName)) return 'type-text';
    return 'type-generic';
  }
  function identityMarkHtml_(entity = {}, className = 'entity-mark') {
    const logo = entity.logoUrl || entity.agentLogoUrl || '';
    return `<div class="entity-mark ${escapeHtml(className)} ${logo ? 'has-logo' : ''}">${logo ? `<img src="${escapeHtml(logo)}" alt="" loading="lazy">` : `<span>${escapeHtml(entity.icon || '✦')}</span>`}</div>`;
  }
  function setIdentityMark_(element, entity = {}) {
    if (!element) return;
    const logo = entity.logoUrl || entity.agentLogoUrl || '';
    element.classList.toggle('has-logo', Boolean(logo));
    element.innerHTML = logo ? `<img src="${escapeHtml(logo)}" alt="">` : `<span>${escapeHtml(entity.icon || '✦')}</span>`;
  }
  function scopeLabel(scope) { return ({full:'Full project',sources_documents:'Sources and documents',history:'Chat history only',custom:'Custom'})[scope] || scope; }
  function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[char]); }
  function formatMarkdown(value) {
    let text = escapeHtml(value); const codeBlocks = [];
    text = text.replace(/```([\w.+-]*)\n?([\s\S]*?)```/g, (_, language, code) => { codeBlocks.push(`<pre class="code-block"><span class="code-toolbar"><span>${escapeHtml(language || 'code')}</span><button type="button" data-copy-code>📋 Copy</button></span><code>${code}</code></pre>`); return `@@CODE${codeBlocks.length - 1}@@`; });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/^###\s+(.+)$/gm, '<h3>$1</h3>').replace(/^##\s+(.+)$/gm, '<h2>$1</h2>').replace(/^#\s+(.+)$/gm, '<h1>$1</h1>').replace(/^[-*]\s+(.+)$/gm, '• $1').replace(/\n/g, '<br>');
    codeBlocks.forEach((block, index) => { text = text.replace(`@@CODE${index}@@`, block); }); return text;
  }
