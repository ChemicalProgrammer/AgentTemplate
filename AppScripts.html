    rose:   {label:'Rose', accent:'#a83e72', tint:'#f9e8f0', tintStrong:'#f3cfe0'},

    indigo: {label:'Indigo', accent:'#3949ab', tint:'#e8eafc', tintStrong:'#cfd3f6'},

    lime:   {label:'Lime', accent:'#587d13', tint:'#eff7df', tintStrong:'#dcedb7'},

    graphite:{label:'Graphite', accent:'#3f4752', tint:'#e9edf1', tintStrong:'#d2d9e0'}

  const state = {
    bootstrap: null,
    projects: [],
    agents: [],
    catalogsLoading: false,
    agentSearch: '',
    currentAgentId: null,
    currentAgentDetails: null,
    currentAgentAssetType: '',
    currentAgentKnowledgeMode: '',
    projectAgent: null,
    availableAgents: [],
    dashboardFilter: 'all',
    search: '',
    projectDetails: null,
    documentNodes: [],
    backgroundIndexNodes: [],
    currentProjectId: null,
    currentConversationId: null,
    currentConversation: null,
    availableModels: [],
    currentChatModel: '',
    modelCatalogVerified: false,
    modelCatalogError: '',
    conversationSelections: new Map(),
    flowSelections: new Map(),
    selectedSources: new Set(),
    selectedFlows: new Set(),
    selectedTemplateId: '',
    busy: false,
    activeRequest: null,
    confirmResolver: null,
    highlightedDocumentId: null,
    editingDocumentId: null,
    diagnosingSourceId: null,
    previewNodeId: null,
    documentPreview: null,
    documentPreviewMode: 'preview',
    viewerCloseTimer: null,
    chatCollapsed: false,
    collapsedDocumentLevels: new Set(),
    cardDragging: false,
    pendingUploads: new Map(),
    sourceIndexTimers: new Map(),
    activeIndexSources: new Set(),
    pdfExportNodeId: null,
    branchSourceMessageId: null,
    lastProjectRefresh: 0,
    projectLoadToken: 0,
    panelLoaded: {chats:false, documents:false, templates:false, flows:false, members:false},
    panelLoading: {chats:false, documents:false, templates:false, flows:false, members:false}
  };

  function initializeClient_() {
    renderEmojiOptions();
    renderColorOptions();
    renderAgentColorOptions();
    bindStaticEvents();
    restorePanelWidth();
    restoreViewerWidth();
    restoreChatPanelState();
    startApp();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initializeClient_, {once:true});
  else setTimeout(initializeClient_, 0);

  function server(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(clientErrorMessage(error))));
      runner[functionName](...args);
    });
  }

  function withTimeout_(promise, milliseconds, message) {
    let timer = null;
    const result = Promise.race([
      promise,
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message || 'The request took too long.')), milliseconds); })
    ]);
    return result.then(
      value => { if (timer) clearTimeout(timer); return value; },
      error => { if (timer) clearTimeout(timer); throw error; }
    );
  }

  async function startApp() {
    const boot = window.__BOOT_UI__;
    try {
      if (boot) boot.setStatus('Checking your workspace configuration…','Your projects are not being modified.');
      const data = await withTimeout_(server('getBootstrap'), 20000, 'The initial Apps Script request did not answer within 20 seconds.');
      state.bootstrap = data;
      state.currentChatModel = (data.userSettings || {}).model || '';
      if (!data.initialized) {
        document.getElementById('setup-screen').classList.remove('hidden');
        if (data.identity.email.includes('@')) document.getElementById('setup-domain').value = data.identity.email.split('@')[1];
        if (boot) boot.complete(); else document.getElementById('boot-loader').classList.add('hidden');
        return;
      }
      state.projects = data.projects || [];
      state.agents = data.agents || [];
      state.catalogsLoading = Boolean(data.catalogsDeferred);
      document.getElementById('app-shell').classList.remove('hidden');
      setWorkspaceMode('home');
      applyIdentity();
      showHome();
      if (boot) { boot.setStatus('Opening Agent Console…','Project and agent cards will synchronize in the background.'); boot.complete(); }
      else document.getElementById('boot-loader').classList.add('hidden');
      if (data.catalogsDeferred) loadInitialCatalogs_();
    } catch (error) {
      if (boot) boot.fail('The startup request could not be completed.', error.message);
      else { document.getElementById('boot-loader').classList.add('hidden'); showToast(error.message, true); }
    }
  }

  async function loadInitialCatalogs_() {
    state.catalogsLoading = true; updateHomeCounts_();
    if (!document.getElementById('agents-view').classList.contains('hidden')) renderAgents();
    if (!document.getElementById('dashboard-view').classList.contains('hidden')) renderProjects();
    try {
      const data = await withTimeout_(server('getInitialCatalogs'), 60000, 'Drive did not finish synchronizing the Agents and Projects catalogs within 60 seconds.');
      state.projects = data.projects || []; state.agents = data.agents || []; state.lastProjectRefresh = Date.now();
    } catch (error) {
      showToast('The console opened, but its catalogs could not be synchronized: ' + error.message, true);
    } finally {
      state.catalogsLoading = false; updateHomeCounts_();
      if (!document.getElementById('agents-view').classList.contains('hidden')) renderAgents();
      if (!document.getElementById('dashboard-view').classList.contains('hidden')) renderProjects();
    }
  }

  function applyIdentity() {
    const data = state.bootstrap;
    const email = data.identity.email || 'User';
    document.getElementById('user-avatar').textContent = initials(email.split('@')[0]);
    document.getElementById('user-avatar').title = email;
    document.getElementById('domain-label').textContent = '@' + data.config.organizationDomain;
    updateKeyStatus(data.userSettings);
  }

  function updateKeyStatus(settings) {
    const box = document.getElementById('key-status');
    box.classList.toggle('ready', Boolean(settings.configured));
    box.textContent = settings.configured ? `✓ Gemini · ••••${settings.keySuffix} · ${settings.model}` : '⚠ Add your Gemini API key';
  }

  function bindStaticEvents() {
    document.getElementById('setup-form').addEventListener('submit', configureApp);
    document.getElementById('brand-home').addEventListener('click', showHome);
    document.getElementById('open-agents-route').addEventListener('click', showAgents);
    document.getElementById('open-projects-route').addEventListener('click', showDashboard);
    document.getElementById('agents-back-home').addEventListener('click', showHome);
    document.getElementById('projects-back-home').addEventListener('click', showHome);
    document.getElementById('agent-editor-back').addEventListener('click', showAgents);
    document.getElementById('agent-search').addEventListener('input', event => { state.agentSearch = event.target.value.toLowerCase(); renderAgents(); });
    document.getElementById('refresh-agents').addEventListener('click', refreshAgents);
    document.getElementById('create-agent').addEventListener('click', () => { openModal('agent-modal'); document.getElementById('new-agent-name').focus(); });
    document.getElementById('agent-form').addEventListener('submit', submitAgent);
    document.getElementById('save-agent').addEventListener('click', saveAgentDraft);
    document.getElementById('publish-agent').addEventListener('click', openPublishAgentModal);
    document.getElementById('publish-agent-form').addEventListener('submit', submitPublishAgent);
    document.getElementById('clone-agent').addEventListener('click', cloneCurrentAgent);
    document.getElementById('agent-asset-form').addEventListener('submit', submitAgentAsset);
    document.getElementById('agent-logo-form').addEventListener('submit', submitAgentLogo);
    document.getElementById('import-agent-logo').addEventListener('click', openAgentLogoModal);
    document.getElementById('remove-agent-logo').addEventListener('click', removeCurrentAgentLogo);
    document.getElementById('edit-agent-icon').addEventListener('input', renderAgentIdentityPreview_);
    document.querySelectorAll('[data-agent-add]').forEach(button => button.addEventListener('click', () => openAgentAssetModal(button.dataset.agentAdd, button.dataset.knowledgeMode || '')));
    document.querySelectorAll('[data-agent-section-link]').forEach(button => button.addEventListener('click', () => scrollAgentSection(button.dataset.agentSectionLink)));
    document.getElementById('global-search').addEventListener('input', event => { state.search = event.target.value.toLowerCase(); renderProjects(); });
    document.querySelectorAll('[data-dashboard-filter]').forEach(button => button.addEventListener('click', () => {
      state.dashboardFilter = button.dataset.dashboardFilter;
      syncDashboardFilters(); renderProjects();
    }));
    document.getElementById('create-project-heading').addEventListener('click', openNewProjectModal);
    document.getElementById('refresh-projects').addEventListener('click', refreshProjects);
    document.getElementById('settings-button').addEventListener('click', openSettings);
    document.getElementById('project-settings-button').addEventListener('click', openSettings);
    document.getElementById('project-agent-button').addEventListener('click', openChangeAgentModal);
    document.getElementById('change-agent-form').addEventListener('submit', submitChangeProjectAgent);
    document.getElementById('back-dashboard').addEventListener('click', showDashboard);
    document.getElementById('toggle-project-panel').addEventListener('click', () => document.getElementById('project-side-panel').classList.toggle('mobile-open'));
    document.getElementById('toggle-chat-from-side').addEventListener('click', toggleChatPanel);
    document.getElementById('collapse-chat-panel').addEventListener('click', () => toggleChatPanel(true));
    document.getElementById('project-header-icon').addEventListener('click', openProjectEmojiPicker);
    document.getElementById('share-project-button').addEventListener('click', openShareModal);
    document.querySelectorAll('[data-side-tab]').forEach(tab => tab.addEventListener('click', () => showSideTab(tab.dataset.sideTab)));
    document.getElementById('new-conversation').addEventListener('click', () => newConversation(false));
    document.getElementById('send-message').addEventListener('click', sendMessage);
    document.getElementById('stop-response').addEventListener('click', stopResponse);
    document.getElementById('chat-input').addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }
    });
    document.getElementById('chat-input').addEventListener('input', autoSizeComposer);
    document.getElementById('chat-model-select').addEventListener('change', event => {
      state.currentChatModel = event.target.value;
      if (state.currentConversation) state.currentConversation.model = state.currentChatModel;
    });
    document.getElementById('close-document-viewer').addEventListener('click', () => closeDocumentViewer(false));
    document.getElementById('export-document-pdf').addEventListener('click', openDocumentPdfExport);
    document.getElementById('pdf-export-form').addEventListener('submit', submitDocumentPdfExport);
    document.querySelectorAll('input[name="pdf-export-destination"]').forEach(input => input.addEventListener('change', syncPdfExportDestination));
    document.querySelectorAll('[data-preview-mode]').forEach(button => button.addEventListener('click', () => setDocumentPreviewMode(button.dataset.previewMode)));
    document.getElementById('branch-message-form').addEventListener('submit', submitConversationBranch);
    document.querySelectorAll('[data-prompt]').forEach(button => button.addEventListener('click', () => {
      const input = document.getElementById('chat-input'); input.value = button.dataset.prompt; autoSizeComposer(); input.focus();
    }));
    document.getElementById('add-source-link').addEventListener('click', () => openModal('source-link-modal'));
    document.getElementById('source-upload').addEventListener('change', uploadSourceFile);
    document.getElementById('sync-source-index').addEventListener('click', syncSourceIndex);
    document.getElementById('add-template-link').addEventListener('click', () => openModal('template-link-modal'));
    document.getElementById('template-link-form').addEventListener('submit', submitTemplateLink);
    document.getElementById('add-flow-link').addEventListener('click', () => openModal('flow-link-modal'));
    document.getElementById('flow-link-form').addEventListener('submit', submitFlowLink);
    document.getElementById('flow-upload').addEventListener('change', uploadFlowFile);
    document.getElementById('add-member-button').addEventListener('click', () => openModal('member-modal'));
    document.getElementById('gemini-settings-form').addEventListener('submit', saveGeminiSettings);
    document.getElementById('root-settings-form').addEventListener('submit', saveRootFolderSettings);
    document.getElementById('load-models').addEventListener('click', loadModels);
    document.getElementById('project-form').addEventListener('submit', submitProject);
    document.getElementById('source-link-form').addEventListener('submit', submitSourceLink);
    document.getElementById('document-note-form').addEventListener('submit', saveDocumentNote);
    document.getElementById('retry-index-diagnostic').addEventListener('click', retryIndexFromDiagnostic);
    document.getElementById('refresh-index-diagnostic').addEventListener('click', refreshIndexDiagnostic);
    document.getElementById('member-form').addEventListener('submit', submitMember);
    document.getElementById('member-scope').addEventListener('change', event => document.getElementById('custom-permissions').classList.toggle('hidden', event.target.value !== 'custom'));
    document.getElementById('confirm-cancel').addEventListener('click', () => resolveConfirmation(false));
    document.getElementById('confirm-action').addEventListener('click', () => resolveConfirmation(true));
    document.querySelectorAll('[data-close-modal]').forEach(button => button.addEventListener('click', closeModals));
    document.getElementById('modal-backdrop').addEventListener('click', event => { if (event.target.id === 'modal-backdrop') closeModals(); });
    document.getElementById('project-panel-grip').addEventListener('pointerdown', startPanelResize);
    document.getElementById('project-panel-grip').addEventListener('keydown', resizePanelWithKeyboard);
    document.getElementById('document-viewer-grip').addEventListener('pointerdown', startViewerResize);
    document.getElementById('document-viewer-grip').addEventListener('keydown', resizeViewerWithKeyboard);
    document.addEventListener('click', event => {
      if (!event.target.closest('.document-menu-wrap')) closeDocumentMenus();
      if (!event.target.closest('.project-card-menu-wrap')) closeProjectCardMenus();
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeDocumentMenus(); closeProjectCardMenus(); closeModals(); } });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && state.currentProjectId == null && Date.now() - state.lastProjectRefresh > 15000) refreshProjects(true);
    });
    window.addEventListener('resize', () => {
      const workspace = document.getElementById('project-workspace');
      if (window.innerWidth <= 760 && workspace.classList.contains('chat-collapsed')) setChatPanelCollapsed_(false, false);
      if (workspace.classList.contains('viewer-open') && window.innerWidth > 760) setViewerWidth(document.getElementById('document-viewer').getBoundingClientRect().width);
    });
  }

  async function configureApp(event) {
    event.preventDefault(); setBusy(event.target, true);
    try {
      state.bootstrap = await server('setupApplication', {
        organizationDomain: document.getElementById('setup-domain').value,
        rootFolderId: document.getElementById('setup-root').value
      });
      state.projects = state.bootstrap.projects || [];
      state.agents = state.bootstrap.agents || [];
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      state.catalogsLoading = Boolean(state.bootstrap.catalogsDeferred);
      setWorkspaceMode('home'); applyIdentity(); showHome(); if (state.catalogsLoading) loadInitialCatalogs_(); showToast('Application configured.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  function hideWorkspaceViews_() {
    ['home-view','agents-view','agent-editor-view','dashboard-view','project-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
  }

  function showHome() {
    if (state.activeRequest) stopResponse();
    state.projectLoadToken++;
    state.currentProjectId = null; state.projectDetails = null; state.currentAgentId = null; state.currentAgentDetails = null; state.documentNodes = []; state.backgroundIndexNodes = [];
    hideWorkspaceViews_();
    const home = document.getElementById('home-view'); home.classList.remove('hidden'); home.classList.add('view-entering');
    setWorkspaceMode('home');
    updateHomeCounts_();
    setTimeout(() => home.classList.remove('view-entering'), 360);
  }

  function showAgents() {
    hideWorkspaceViews_(); document.getElementById('agents-view').classList.remove('hidden');
    setWorkspaceMode('agents'); renderAgents();
  }

  function renderAgents() {
    const agents = state.agents.filter(agent => !state.agentSearch || `${agent.name} ${agent.description} ${agent.owner}`.toLowerCase().includes(state.agentSearch));
    const grid = document.getElementById('agent-grid');
    if (state.catalogsLoading) { grid.innerHTML = catalogSkeletonMarkup_(4); document.getElementById('empty-agents').classList.add('hidden'); return; }
    grid.innerHTML = agents.map((agent, index) => `<article class="entity-card agent-card" style="--card-index:${index};${projectColorStyle(agent.color)}" data-agent-id="${escapeHtml(agent.agentId)}" tabindex="0">
      <div class="entity-card-accent"></div>
      <div class="entity-card-top">${identityMarkHtml_(agent, 'agent-avatar')}<span class="entity-card-tools"><span class="card-drag-handle" draggable="true" title="Drag to reorder" aria-label="Drag to reorder agent">⠿</span><span class="status-pill ${escapeHtml(agent.status)}">${escapeHtml(agent.status || 'draft')}</span></span></div>
      <div class="entity-card-copy"><h3>${escapeHtml(agent.name)}</h3><p class="description">${escapeHtml(agent.description || 'No description')}</p></div>
      <div class="entity-context-chip"><span>✦</span>${agent.publishedVersion ? `Published · v${escapeHtml(agent.publishedVersion)}` : 'Editable draft'}</div>
      <div class="entity-card-stats"><span><b>${numberValue(agent.sourceCount)}</b> knowledge</span><span><b>${numberValue(agent.workflowCount)}</b> workflows</span><span><b>${numberValue(agent.templateCount)}</b> templates</span></div>
      <div class="entity-card-footer"><span>${agent.hasDraftChanges ? 'Draft changes not published' : escapeHtml(shortEmail(agent.owner))}</span><span>${formatDate(agent.updatedAt)}</span></div>
    </article>`).join('');
    document.getElementById('empty-agents').classList.toggle('hidden', agents.length > 0);
    grid.querySelectorAll('.agent-card').forEach(card => {
      card.addEventListener('click', () => { if (!state.cardDragging) openAgent(card.dataset.agentId); });
      card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openAgent(card.dataset.agentId); } });
    });
    bindCardReordering_(grid, '.agent-card', 'agentId', orderedIds => persistEntityCardOrder_('agents', orderedIds));
  }

  async function refreshAgents() {
    const button = document.getElementById('refresh-agents'); setBusy(button, true);
    try { state.agents = await server('refreshAgents'); renderAgents(); updateHomeCounts_(); showToast('Agents folder scanned.'); }
    catch (error) { showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

  async function submitAgent(event) {
    event.preventDefault(); setBusy(event.target, true);
    try {
      const agent = await server('createAgent', {name:document.getElementById('new-agent-name').value,description:document.getElementById('new-agent-description').value,icon:document.getElementById('new-agent-icon').value,color:document.getElementById('new-agent-color').value,showMandatoryKnowledgeInProjects:document.getElementById('new-agent-show-mandatory').checked});
      state.agents.unshift(agent); closeModals(); event.target.reset(); renderAgents(); updateHomeCounts_(); await openAgent(agent.agentId); showToast('Agent draft created.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  async function openAgent(agentId) {
    hideWorkspaceViews_(); document.getElementById('agent-editor-view').classList.remove('hidden'); setWorkspaceMode('agents');
    state.currentAgentId = agentId; state.currentAgentDetails = null;
    document.getElementById('agent-editor-name').textContent = 'Opening agent…';
    try { state.currentAgentDetails = await server('getAgentDetails', agentId); renderAgentEditor(); }
    catch (error) { showToast(error.message, true); showAgents(); }
  }

  function renderAgentEditor() {
    const details = state.currentAgentDetails; if (!details) return;
    const agent = details.agent; const assets = details.assets || {};
    setIdentityMark_(document.getElementById('agent-editor-icon'), agent);
    document.getElementById('agent-editor-view').setAttribute('style', projectColorStyle(agent.color));
    document.getElementById('agent-editor-name').textContent = agent.name;
    document.getElementById('agent-editor-status').textContent = agent.status || 'draft';
    document.getElementById('agent-editor-status').className = `status-pill ${agent.status || 'draft'}`;
    document.getElementById('agent-editor-version').textContent = agent.publishedVersion ? `Published v${agent.publishedVersion}${agent.hasDraftChanges ? ' · draft changed' : ''}` : 'Not published';
    document.getElementById('open-agent-folder').href = details.folderUrl || agent.folderUrl || '#';
    document.getElementById('edit-agent-name').value = agent.name || '';
    document.getElementById('edit-agent-description').value = agent.description || '';
    document.getElementById('edit-agent-instructions').value = details.instructions || '';
    document.getElementById('edit-agent-icon').value = agent.icon || '✦';
    document.getElementById('edit-agent-color').value = agent.color || 'violet';
    document.getElementById('edit-agent-show-mandatory').checked = agent.showMandatoryKnowledgeInProjects !== false;
    renderAgentIdentityPreview_();
    syncAgentColorOptions_();
    const validation = details.validation || {valid:true,errors:[],warnings:[]};
    const validationBadge = document.getElementById('agent-validation-badge');
    validationBadge.textContent = validation.valid ? validation.warnings.length ? `${validation.warnings.length} recommendation${validation.warnings.length===1?'':'s'}` : 'Ready to publish' : `${validation.errors.length} validation error${validation.errors.length===1?'':'s'}`;
    validationBadge.title = (validation.errors || []).concat(validation.warnings || []).join('\n');
    document.getElementById('save-agent').classList.toggle('hidden', !agent.canEdit);
    document.getElementById('publish-agent').classList.toggle('hidden', !agent.canEdit);
    document.getElementById('import-agent-logo').classList.toggle('hidden', !agent.canEdit);
    document.getElementById('remove-agent-logo').classList.toggle('hidden', !agent.canEdit || !agent.logoUrl);
    document.getElementById('edit-agent-icon').disabled = !agent.canEdit;
    document.getElementById('edit-agent-show-mandatory').disabled = !agent.canEdit;
    document.querySelectorAll('[data-agent-color]').forEach(button => button.disabled = !agent.canEdit);
    document.querySelectorAll('[data-agent-add]').forEach(button => button.classList.toggle('hidden', !agent.canEdit));
    renderAgentResourceList_('agent-mandatory-list', assets.mandatoryKnowledge, 'DOC', agent.canEdit);
    renderAgentResourceList_('agent-optional-list', assets.optionalKnowledge, 'DOC', agent.canEdit);
    renderAgentResourceList_('agent-workflow-list', assets.workflows, 'MD', agent.canEdit);
    renderAgentResourceList_('agent-template-list', assets.templates, 'TPL', agent.canEdit);
    renderAgentResourceList_('agent-output-list', assets.outputFormats, 'OUT', agent.canEdit);
    renderAgentResourceList_('agent-policy-list', assets.policies, 'POL', agent.canEdit);
    renderAgentResourceList_('agent-asset-list', assets.assets, 'AST', agent.canEdit);
    renderAgentResourceList_('agent-example-list', assets.examples, 'EX', agent.canEdit);
    renderAgentResourceList_('agent-evaluation-list', assets.evaluations, 'TEST', agent.canEdit);
    const releases = details.versions || [];
    document.getElementById('agent-release-list').innerHTML = releases.length ? releases.map(release => `<article class="release-row"><span class="version-pill">v${escapeHtml(release.version)}</span><span><strong>${escapeHtml(agent.name)}</strong><small>Published ${formatDate(release.releasedAt)} by ${escapeHtml(shortEmail(release.releasedBy || agent.owner))}</small></span><span class="release-metric"><b>${numberValue(release.sourceCount)}</b>sources</span><span class="release-metric"><b>${numberValue(release.workflowCount)}</b>flows</span><span class="release-metric"><b>${numberValue(release.templateCount)}</b>templates</span></article>`).join('') : '<div class="resource-empty">No published versions yet.</div>';
    document.querySelectorAll('[data-remove-agent-asset]').forEach(button => button.addEventListener('click', () => removeAgentAsset(button.dataset.removeAgentAsset, button)));
  }

  function renderAgentResourceList_(id, items = [], icon, canEdit) {
    const container = document.getElementById(id);

  function bindCardReordering_(container, cardSelector, idField, onCommit) {
    let draggedCard = null;
    container.querySelectorAll('.card-drag-handle').forEach(handle => {
      handle.addEventListener('click', event => event.stopPropagation());
      handle.addEventListener('keydown', event => event.stopPropagation());
      handle.addEventListener('dragstart', event => {
        draggedCard = handle.closest(cardSelector); if (!draggedCard) return;
        state.cardDragging = true; draggedCard.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', draggedCard.dataset[idField] || draggedCard.dataset.nodeId || '');
      });
      handle.addEventListener('dragend', () => {
        if (!draggedCard) return;
        draggedCard.classList.remove('dragging');
        container.querySelectorAll('.drag-target').forEach(card => card.classList.remove('drag-target'));
        const orderedIds = Array.from(container.querySelectorAll(cardSelector)).map(card => card.dataset[idField] || card.dataset.nodeId).filter(Boolean);
        draggedCard = null; setTimeout(() => { state.cardDragging = false; }, 180); onCommit(orderedIds);
      });
    });
    container.addEventListener('dragover', event => {
      if (!draggedCard) return;
      const target = event.target.closest(cardSelector);
      if (!target || target === draggedCard || target.parentElement !== draggedCard.parentElement) return;
      event.preventDefault(); event.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.drag-target').forEach(card => card.classList.remove('drag-target')); target.classList.add('drag-target');
      const rect = target.getBoundingClientRect();
      const after = target.parentElement.classList.contains('level-track') ? event.clientX > rect.left + rect.width / 2 : event.clientY > rect.top + rect.height / 2;
      target.parentElement.insertBefore(draggedCard, after ? target.nextSibling : target);
    });
    container.addEventListener('drop', event => { if (draggedCard) event.preventDefault(); });
  }

  function mergeVisibleCardOrder_(items, orderedIds, idField) {
    const byId = new Map(items.map(item => [String(item[idField]), item]));
    const queue = orderedIds.map(String).filter(id => byId.has(id));
    const visible = new Set(queue); let cursor = 0;
    return items.map(item => visible.has(String(item[idField])) ? byId.get(queue[cursor++]) : item);
  }

  async function persistEntityCardOrder_(kind, orderedIds) {

      if (kind === 'agents') {
        state.agents = mergeVisibleCardOrder_(state.agents, orderedIds, 'agentId');
        await server('saveAgentCardOrder', state.agents.map(item => item.agentId));
      } else {

  async function openProject(projectId) {
    const loadToken = ++state.projectLoadToken;
    const cachedProject = state.projects.find(item => item.projectId === projectId) || {projectId, title:'Project', description:'', icon:'✨', color:'blue', role:'', scope:''};
    document.getElementById('project-side-panel').classList.remove('mobile-open');
    document.getElementById('dashboard-view').classList.add('hidden');
    const projectView = document.getElementById('project-view');
    projectView.classList.remove('hidden'); projectView.classList.add('view-entering');
    setWorkspaceMode('project');
    clearSourceIndexActivity_();
    state.currentProjectId = projectId; state.currentConversationId = null; state.currentConversation = null;
    closeDocumentViewer(true);
    state.documentNodes = []; state.backgroundIndexNodes = []; state.conversationSelections = new Map(); state.flowSelections = new Map();
    state.collapsedDocumentLevels = readCollapsedDocumentLevels_(projectId);
    state.selectedSources = new Set(); state.selectedFlows = new Set(); state.selectedTemplateId = '';
    state.projectAgent = null; state.availableAgents = publishedAgents_();
    state.panelLoaded = {chats:false, documents:false, templates:false, flows:false, members:false};
    state.panelLoading = {chats:false, documents:false, templates:false, flows:false, members:false};
    state.projectDetails = {
      project: cachedProject,
      agent: null,
      permissions: optimisticPermissions_(cachedProject),
      conversations: [], sources: [], documents: [], templates: [], flows: [], members: []
    };
    renderProjectDetails();
    prepareProjectLoadingUi();
    showSideTab(state.projectDetails.permissions.history ? 'chats' : 'documents', false);
    try {
      const shell = await server('getProjectShell', projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.projectDetails.project = shell.project;
      state.projectDetails.permissions = shell.permissions;
      state.projectAgent = shell.agent || null;
      state.availableAgents = shell.availableAgents || publishedAgents_();
      syncProjectSummary(state.projectDetails); renderProjectDetails();
      const initialTab = shell.permissions.history ? 'chats' : 'documents';
      showSideTab(initialTab, false);
      const tasks = [];
      tasks.push(loadChatModels_());
      if (shell.permissions.history) tasks.push(loadProjectChats_(projectId, loadToken));
      else { setPanelLoading_('chats', false); setChatPanelLoading_(false); renderChatEmpty(true); }
      if (shell.permissions.sources || shell.permissions.documents) tasks.push(loadProjectDocuments_(projectId, loadToken));
      else setPanelLoading_('documents', false);
      Promise.allSettled(tasks).then(() => {
        if (loadToken === state.projectLoadToken) updateComposerAvailability_();
      });
    } catch (error) { showToast(error.message, true); showDashboard(); }
    finally { setTimeout(() => projectView.classList.remove('view-entering'), 360); }

    const full = project.scope === 'full';
    return {
      project: full,
      sources: full || project.scope === 'sources_documents',
      documents: full || project.scope === 'sources_documents',
      history: full || project.scope === 'history',

  async function loadProjectChats_(projectId, loadToken) {
    setPanelLoading_('chats', true); setChatPanelLoading_(true);
    try {
      const data = await server('getProjectChatPanel', projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.projectDetails.conversations = data.conversations || [];
      state.currentConversation = data.firstConversation || null;
      state.currentConversationId = state.currentConversation ? state.currentConversation.conversationId : null;
      state.currentChatModel = state.currentConversation && state.currentConversation.model || state.currentChatModel || (state.bootstrap.userSettings || {}).model || '';
      syncChatModelPicker_();
      state.panelLoaded.chats = true;
      applyCurrentConversationSelections_();
      renderConversationList();
      if (state.currentConversation) renderMessages(); else renderChatEmpty(false);
    } catch (error) {
      if (loadToken === state.projectLoadToken) showToast('Chats could not be loaded: ' + error.message, true);
    } finally {
      if (loadToken === state.projectLoadToken) { setPanelLoading_('chats', false); setChatPanelLoading_(false); updateComposerAvailability_(); }
    }
  }

  async function loadProjectDocuments_(projectId, loadToken) {
    setPanelLoading_('documents', true);
    try {
      const data = await server('getProjectDocumentsPanel', projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.documentNodes = data.documentGraph || [];
      state.backgroundIndexNodes = data.indexableSources || state.documentNodes.filter(node => node.kind === 'source' || node.kind === 'agent-source');
      state.projectDetails.sources = state.documentNodes.filter(node => node.kind === 'source');
      state.projectDetails.documents = state.documentNodes.filter(node => node.kind !== 'source' && node.kind !== 'agent-source');
      state.panelLoaded.documents = true;
      applyCurrentConversationSelections_();
      syncProjectSummary(state.projectDetails); renderDocumentGraph();
      const indexableSources = state.backgroundIndexNodes;
      if (state.projectDetails.permissions.edit) {
        const queued = indexableSources.filter(node => ['queued','uploading','not_indexed'].includes(node.indexStatus)).sort((a,b) => Number(Boolean(b.mandatory)) - Number(Boolean(a.mandatory)));
        queueSourceIndexes_(queued.map(node => node.nodeId));
        indexableSources.filter(node => node.indexStatus === 'indexing').forEach(node => scheduleSourceIndexPoll_(node.nodeId, 1800));
      }
      server('cleanupProjectFileSearchOrphans', projectId).then(result => {
        if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
        if (result && result.deleted) showToast(`${result.deleted} stale File Search record${result.deleted === 1 ? '' : 's'} removed.`);
      }).catch(() => {});
    } catch (error) {
      if (loadToken === state.projectLoadToken) showToast('Documents could not be loaded: ' + error.message, true);
    } finally {
      if (loadToken === state.projectLoadToken) { setPanelLoading_('documents', false); updateComposerAvailability_(); }
    }
  }

  async function loadChatModels_() {
    const fallback = state.currentChatModel || (state.bootstrap.userSettings || {}).model || '';
    if (fallback && !state.availableModels.length) state.availableModels = [{name:fallback, displayName:fallback}];
    state.modelCatalogVerified = false; state.modelCatalogError = '';
    syncChatModelPicker_();
    try {
      const models = await server('getAvailableGeminiModels');
      if (!(models || []).length) throw new Error('The assigned API key returned no models compatible with generateContent.');
      state.availableModels = models || [];
      state.modelCatalogVerified = true;
      if (state.availableModels.length && !state.availableModels.some(model => model.name === state.currentChatModel)) state.currentChatModel = state.availableModels[0].name;
      syncChatModelPicker_();
    } catch (error) {
      state.modelCatalogVerified = false; state.modelCatalogError = error.message || 'Model catalog could not be verified.';
      syncChatModelPicker_();
    }
  }

  function syncChatModelPicker_() {
    const select = document.getElementById('chat-model-select'); if (!select) return;
    const models = (state.availableModels || []).slice();
    if (state.currentChatModel && !models.some(model => model.name === state.currentChatModel)) models.unshift({name:state.currentChatModel, displayName:state.currentChatModel});
    select.innerHTML = models.map(model => `<option value="${escapeHtml(model.name)}">${escapeHtml(model.displayName || model.name)}</option>`).join('');
    if (state.currentChatModel) select.value = state.currentChatModel;
    select.disabled = state.busy || !models.length;
    const status = document.getElementById('chat-model-status');
    if (status) {
      status.textContent = state.modelCatalogVerified ? '✓ Available for your API key' : 'Not verified · check Settings';
      status.className = `model-key-status ${state.modelCatalogVerified ? 'verified' : 'unverified'}`;
      status.title = state.modelCatalogVerified ? 'This list was returned by Gemini for your assigned API key.' : (state.modelCatalogError || 'The current value is a fallback and has not been verified for your API key.');
    }
  }

  async function ensurePanelLoaded_(name) {
    if (!state.currentProjectId || state.panelLoaded[name] || state.panelLoading[name]) return;
    const projectId = state.currentProjectId; const loadToken = state.projectLoadToken;
    const endpoints = {templates:'getProjectTemplatesPanel', flows:'getProjectFlowsPanel'};
    if (!endpoints[name]) return;
    setPanelLoading_(name, true);
    try {
      const data = await server(endpoints[name], projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.projectDetails[name] = data[name] || [];
      state.panelLoaded[name] = true;
      if (name === 'templates') {
        state.selectedTemplateId = (state.projectDetails.templates.find(item => item.selected) || {}).templateId || '';
        renderTemplates();
      } else {
        applyCurrentConversationSelections_(); renderFlows();
      }
    } catch (error) {
      if (loadToken === state.projectLoadToken) showToast(`${name[0].toUpperCase() + name.slice(1)} could not be loaded: ${error.message}`, true);
    } finally {
      if (loadToken === state.projectLoadToken) setPanelLoading_(name, false);
    }
  }

  function applyCurrentConversationSelections_() {
    if (state.panelLoaded.documents) {
      if (state.currentConversation && Object.prototype.hasOwnProperty.call(state.currentConversation, 'sourceSelection')) {
        state.selectedSources = new Set(normalizeSelectedDocumentIds(state.currentConversation.sourceSelection));
      } else if (!state.currentConversation) selectDefaultDocuments();
    }
    if (state.currentConversation) state.selectedFlows = new Set(state.currentConversation.flowSelection || []);
    rememberCurrentSelection(); rememberCurrentFlowSelection();
    if (state.panelLoaded.documents) renderDocumentGraph();
    if (state.panelLoaded.flows) renderFlows();
  }

  function updateComposerAvailability_() {
    if (!state.projectDetails) return;
    const permissions = state.projectDetails.permissions;
    const documentsReady = !permissions.sources && !permissions.documents || state.panelLoaded.documents;
    const chatsReady = !permissions.history || state.panelLoaded.chats;
    const available = Boolean(permissions.edit && permissions.history && documentsReady && chatsReady && !state.busy);
    document.getElementById('chat-input').disabled = !available;
    document.getElementById('send-message').disabled = !available;
    document.getElementById('chat-model-select').disabled = !available || !(state.availableModels || []).length;
  }

  function syncProjectSummary(details) {
    const local = state.projects.find(item => item.projectId === details.project.projectId);
    if (!local) return;
    Object.assign(local, details.project);
    if (details.permissions.sources && state.panelLoaded.documents) local.sourceCount = state.documentNodes.filter(item => item.kind === 'source').length;
    if (details.permissions.history && state.panelLoaded.chats) local.conversationCount = (details.conversations || []).filter(item => item.status !== 'archived').length;
    if (details.permissions.documents && state.panelLoaded.documents) local.documentCount = state.documentNodes.filter(item => item.kind !== 'source' && item.kind !== 'agent-source').length;
  }

  function syncProjectWorkspaceChrome_(agentOverride) {
    if (!state.projectDetails) return;
    const project = state.projectDetails.project || {};
    const agent = agentOverride || state.projectAgent || {name:project.agentName || 'Agent',version:project.agentVersion || '',icon:project.agentIcon || '✦',logoUrl:project.agentLogoUrl || '',color:'violet'};
    const record = (state.projectDetails.conversations || []).find(item => item.conversationId === state.currentConversationId);

    if (!state.projectDetails || !state.projectDetails.permissions.edit || !state.projectDetails.permissions.project) return;
    const currentId = state.projectDetails.project.agentId || '';
    const select = document.getElementById('change-project-agent');

    const options = publishedAgentOptions_(agents);
    select.innerHTML = options.map(option => `<option value="${escapeHtml(option.agentId + '@@' + option.version)}" ${option.agentId === currentId && option.version === state.projectDetails.project.agentVersion ? 'selected' : ''}>${escapeHtml(option.name)} · v${escapeHtml(option.version)}${option.isCurrent ? ' · current' : ''}</option>`).join('');
    openModal('change-agent-modal');
  }

  async function submitChangeProjectAgent(event) {
    event.preventDefault(); const select = document.getElementById('change-project-agent');
    const choice = select.value.split('@@');
    if (!choice[0] || choice[0] === state.projectDetails.project.agentId && choice[1] === state.projectDetails.project.agentVersion) { closeModals(); return; }
    setBusy(event.target, true);
    try {
      const result = await server('changeProjectAgent', state.currentProjectId, choice[0], choice[1]);
      state.projectDetails.project = result.project; state.projectAgent = result.agent;
      const local = state.projects.find(item => item.projectId === state.currentProjectId); if (local) Object.assign(local, result.project);
      state.currentConversation = result.conversation; state.currentConversationId = result.conversation.conversationId;
      state.projectDetails.conversations.unshift({conversationId:result.conversation.conversationId,title:result.conversation.title,createdAt:result.conversation.createdAt,updatedAt:result.conversation.updatedAt,messageCount:0,status:'active',agentId:result.conversation.agentId,agentVersion:result.conversation.agentVersion});
      state.documentNodes = []; state.selectedSources = new Set(); state.selectedFlows = new Set(); state.panelLoaded.documents = false; state.panelLoaded.templates = false; state.panelLoaded.flows = false;
      closeModals(); renderProjectDetails(); renderConversationList(); renderChatEmpty(false);
      await loadProjectDocuments_(state.currentProjectId, state.projectLoadToken);
      showToast(`${result.agent.name} v${result.agent.version} loaded. A new chat was created.`);
    } catch (error) { showToast(error.message, true); }

  }

  function showDashboard() {

    clearSourceIndexActivity_();

    state.currentProjectId = null; state.projectDetails = null; state.documentNodes = []; state.conversationSelections = new Map(); state.flowSelections = new Map(); state.selectedFlows = new Set(); state.selectedTemplateId = '';

  function renderConversationList() {
    const list = document.getElementById('conversation-list');
    const conversations = state.projectDetails ? state.projectDetails.conversations || [] : [];
    list.innerHTML = conversations.map(item => `<article class="conversation-item ${item.conversationId === state.currentConversationId ? 'active' : ''}" data-conversation-row="${escapeHtml(item.conversationId)}">
      <button class="conversation-open" data-conversation-id="${escapeHtml(item.conversationId)}">
        <strong>${item.parentConversationId ? '⑂ ' : ''}${escapeHtml(item.title)}</strong><small>${formatDate(item.updatedAt)} · ${numberValue(item.messageCount)} messages${item.model ? ` · ${escapeHtml(item.model)}` : item.agentVersion ? ` · agent v${escapeHtml(item.agentVersion)}` : ''}</small>
      </button>
      <div class="conversation-actions">
        ${state.projectDetails.permissions.edit ? `<button class="conversation-export emoji-action-btn" data-export-conversation="${escapeHtml(item.conversationId)}" aria-label="Export ${escapeHtml(item.title)} as PDF" title="Export this chat as PDF">📤</button>` : ''}
        ${state.projectDetails.permissions.edit ? `<button class="conversation-delete emoji-action-btn danger" data-delete-conversation="${escapeHtml(item.conversationId)}" aria-label="Delete ${escapeHtml(item.title)}" title="Delete chat">🗑️</button>` : ''}
      </div>
    </article>`).join('');

    list.querySelectorAll('[data-export-conversation]').forEach(button => button.addEventListener('click', () => exportConversationPdf(button.dataset.exportConversation, button)));
    list.querySelectorAll('[data-delete-conversation]').forEach(button => button.addEventListener('click', () => deleteChat(button.dataset.deleteConversation, button)));

  async function newConversation(silent) {
    const button = document.getElementById('new-conversation'); if (!silent) setBusy(button, true);
    try {
      const conversation = await server('createConversation', state.currentProjectId, 'New chat', state.currentChatModel);
      state.projectDetails.conversations.unshift({conversationId: conversation.conversationId, title: conversation.title, createdAt: conversation.createdAt, updatedAt: conversation.updatedAt, messageCount: 0});
      state.currentConversationId = conversation.conversationId; state.currentConversation = conversation; selectDefaultDocuments(); state.selectedFlows = new Set();
      state.currentChatModel = conversation.model || state.currentChatModel; syncChatModelPicker_();
      rememberCurrentSelection();
      rememberCurrentFlowSelection(); updateProjectCount('conversationCount', state.projectDetails.conversations.length);
      renderConversationList(); renderDocumentGraph(); renderFlows(); renderMessages(); document.getElementById('chat-input').focus();
      return conversation;
    } catch (error) { showToast(error.message, true); throw error; }
    finally { if (!silent) setBusy(button, false); }
  }

  async function openConversation(conversationId, button) {
    if (state.busy) return; if (button) setBusy(button, true);
    setChatPanelLoading_(true);
    try {
      state.currentConversationId = conversationId; renderConversationList();
      state.currentConversation = await server('loadConversation', state.currentProjectId, conversationId);
      state.currentChatModel = state.currentConversation.model || state.currentChatModel || (state.bootstrap.userSettings || {}).model || ''; syncChatModelPicker_();
      if (state.conversationSelections.has(conversationId)) {
        state.selectedSources = new Set(state.conversationSelections.get(conversationId));
      } else if (Object.prototype.hasOwnProperty.call(state.currentConversation, 'sourceSelection')) {
        state.selectedSources = new Set(normalizeSelectedDocumentIds(state.currentConversation.sourceSelection));
      } else selectDefaultDocuments();
      if (state.flowSelections.has(conversationId)) {
        state.selectedFlows = new Set(state.flowSelections.get(conversationId));
      } else {
        state.selectedFlows = new Set(state.currentConversation.flowSelection || []);
      }
      rememberCurrentSelection();
      rememberCurrentFlowSelection(); renderDocumentGraph(); renderFlows(); renderMessages(); document.getElementById('project-side-panel').classList.remove('mobile-open');
    } catch (error) { showToast(error.message, true); }
    finally { setChatPanelLoading_(false); if (button) setBusy(button, false); updateComposerAvailability_(); }
  }

  async function deleteChat(conversationId, button) {
    const record = state.projectDetails.conversations.find(item => item.conversationId === conversationId);
    const confirmed = await askConfirmation({
      title: 'Delete this chat?',
      message: `“${record ? record.title : 'This chat'}” will be moved to Drive trash. Its messages will no longer appear in the project.`,
      action: 'Delete chat'
    });
    if (!confirmed) return;
    setBusy(button, true);
    try {
      const result = await server('deleteConversation', state.currentProjectId, conversationId);
      const deletedIds = new Set(result.deletedConversationIds || [conversationId]);
      state.projectDetails.conversations = state.projectDetails.conversations.filter(item => !deletedIds.has(item.conversationId));
      deletedIds.forEach(id => { state.conversationSelections.delete(id); state.flowSelections.delete(id); });
      updateProjectCount('conversationCount', state.projectDetails.conversations.length);
      if (deletedIds.has(state.currentConversationId)) {
        state.currentConversationId = null; state.currentConversation = null;
        const next = state.projectDetails.conversations[0];
        if (next) await openConversation(next.conversationId); else renderChatEmpty(false);
      }
      renderConversationList(); showToast(deletedIds.size > 1 ? `${deletedIds.size} related chats moved to Drive trash.` : 'Chat moved to Drive trash.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

  function renderChatEmpty(noAccess) {
    state.currentConversation = null; document.getElementById('chat-messages').innerHTML = '';
    const empty = document.getElementById('chat-empty'); empty.classList.remove('hidden');
    const title = empty.querySelector('h2'); const text = empty.querySelector('p'); const suggestions = empty.querySelector('.prompt-suggestions');
    title.textContent = noAccess ? 'Chat history is not shared with you' : 'How can I help with this project?';
    text.textContent = noAccess ? 'You can still work with the documents available in the left panel.' : 'Ask a question, explore your documents, or develop a new idea.';
    suggestions.classList.toggle('hidden', Boolean(noAccess));
    syncProjectWorkspaceChrome_();
  }

  function renderMessages(options = {}) {
    const messages = state.currentConversation ? state.currentConversation.messages || [] : [];
    document.getElementById('chat-empty').classList.toggle('hidden', messages.length > 0 || options.thinking);
    const container = document.getElementById('chat-messages');
    container.innerHTML = messages.map(message => renderMessage(message)).join('') + (options.thinking ? renderThinkingMessage(options.stopping) : '');
    bindRenderedMessageActions_(container);
    syncProjectWorkspaceChrome_();
    scrollChatToBottom();
  }

  function renderMessage(message) {
    const assistant = message.role === 'assistant';
    const sources = (message.sourcesUsed || []).map(source => {
      const label = `[${escapeHtml(source.label)}] ${escapeHtml(source.name)}${source.pageNumber ? ` · p. ${numberValue(source.pageNumber)}` : ''}`;
      return source.citationUri ? `<a href="${escapeHtml(source.citationUri)}" target="_blank" rel="noopener">${label}</a>` : label;
    }).join(' · ');
    const flows = (message.flowsUsed || []).map(flow => `[${escapeHtml(flow.label)}] ${escapeHtml(flow.name)}`).join(' · ');
    if (!assistant) return `<article class="message user" data-message-id="${escapeHtml(message.messageId)}"><div class="message-body">${formatMarkdown(message.text)}</div><div class="message-actions"><button class="emoji-action-btn" data-message-info="${escapeHtml(message.messageId)}" title="View model and attached sources" aria-label="View message details">ℹ️</button>${state.projectDetails.permissions.edit ? `<button class="emoji-action-btn" data-branch-message="${escapeHtml(message.messageId)}" title="Edit in a new branch" aria-label="Edit this message in a new conversation branch">✏️</button><button class="emoji-action-btn danger" data-delete-message="${escapeHtml(message.messageId)}" title="Delete from this point" aria-label="Delete this message and later conversation">🗑️</button>` : ''}</div></article>`;
    if (message.kind === 'artifact_event' && message.artifact) return renderArtifactEvent_(message, sources, flows);
    return `<article class="message assistant" data-message-id="${escapeHtml(message.messageId)}">
      <div class="message-header">${identityMarkHtml_(state.projectAgent || {icon:'✦'}, 'message-avatar')}<span>${escapeHtml(message.agentName || (state.projectAgent || {}).name || 'Agent')}${message.agentVersion ? ` · v${escapeHtml(message.agentVersion)}` : ''}</span></div>
      <div id="message-body-${escapeHtml(message.messageId)}" class="message-body ${message.isTyping ? 'typing-cursor' : ''}">${formatMarkdown(message.text)}</div>
      ${sources ? `<div class="message-sources">${sources}</div>` : ''}
      ${flows ? `<div class="message-flows">Procedure: ${flows}</div>` : ''}
      ${!message.isTyping ? `<div class="message-actions"><button class="emoji-action-btn" data-message-info="${escapeHtml(message.messageId)}" title="View model and attached sources" aria-label="View message details">ℹ️</button><button class="emoji-action-btn" data-copy-message="${escapeHtml(message.messageId)}" title="Copy response" aria-label="Copy response"><span class="message-copy-icon" aria-hidden="true">📋</span></button></div>` : ''}
    </article>`;
  }

  function renderArtifactEvent_(message, sources, flows) {
    const artifact = message.artifact;
    const actions = (message.actions || []).map(action => `<button data-artifact-action="${escapeHtml(action.id)}" data-action-message="${escapeHtml(action.message)}">${escapeHtml(action.label)}</button>`).join('');
    return `<article class="message assistant artifact-event" data-message-id="${escapeHtml(message.messageId)}">
      <div class="message-header">${identityMarkHtml_(state.projectAgent || {icon:'✦'}, 'message-avatar')}<span>${escapeHtml(message.agentName || (state.projectAgent || {}).name || 'Agent')}</span></div>
      <div class="artifact-event-card"><button class="artifact-event-heading artifact-open-button" data-open-artifact="${escapeHtml(artifact.nodeId)}"><span aria-hidden="true">MD</span><div><small>${escapeHtml(message.eventLabel || 'Artifact saved')}</small><strong>${escapeHtml(artifact.name)}</strong></div></button>${actions ? `<div class="artifact-event-actions">${actions}</div>` : ''}</div>
      ${sources ? `<div class="message-sources">${sources}</div>` : ''}${flows ? `<div class="message-flows">Procedure: ${flows}</div>` : ''}<div class="message-actions"><button class="emoji-action-btn" data-message-info="${escapeHtml(message.messageId)}" title="View model and attached sources" aria-label="View message details">ℹ️</button></div>
    </article>`;
  }

  function bindRenderedMessageActions_(container) {
    container.querySelectorAll('[data-copy-message]').forEach(button => button.addEventListener('click', () => copyMessage(button.dataset.copyMessage, button)));
    container.querySelectorAll('[data-message-info]').forEach(button => button.addEventListener('click', () => openMessageMetadata_(button.dataset.messageInfo)));
    container.querySelectorAll('[data-branch-message]').forEach(button => button.addEventListener('click', () => openConversationBranch(button.dataset.branchMessage)));
    container.querySelectorAll('[data-delete-message]').forEach(button => button.addEventListener('click', () => deleteMessageFromConversation(button.dataset.deleteMessage, button)));
    container.querySelectorAll('[data-open-artifact]').forEach(button => button.addEventListener('click', () => openDocumentPreview(button.dataset.openArtifact)));
    container.querySelectorAll('[data-artifact-action]').forEach(button => button.addEventListener('click', () => runArtifactAction(button.dataset.actionMessage)));
    container.querySelectorAll('[data-copy-code]').forEach(button => button.addEventListener('click', async () => {
      const code = button.closest('.code-block').querySelector('code').textContent;
      try { await navigator.clipboard.writeText(code); const previous = button.textContent; button.textContent = '✓ Copied'; setTimeout(() => button.textContent = previous, 1200); }
      catch (_) { showToast('Could not copy the code.', true); }
    }));
  }

  function openMessageMetadata_(messageId) {

  async function sendMessage() {
    if (state.busy) return;
    const input = document.getElementById('chat-input'); const text = input.value.trim(); if (!text) return;
    state.busy = true;
    try {
      if (!state.currentConversationId) await newConversation(true);
      input.value = ''; autoSizeComposer();
      const request = {id: `chat-${Date.now()}-${Math.random().toString(36).slice(2)}`, cancelled: false, phase: 'waiting', displayedText: ''};
      state.activeRequest = request;
      const temporary = {messageId: `temp-${Date.now()}`, role: 'user', text, createdAt: new Date().toISOString(), model:state.currentChatModel, sourceSelection:Array.from(state.selectedSources)};
      state.currentConversation.messages.push(temporary); setAgentBusy(true); renderMessages({thinking: true});
      const selection = Array.from(state.selectedSources);
      const flowSelection = Array.from(state.selectedFlows);
      const result = await server('sendChatMessage', state.currentProjectId, state.currentConversationId, text, selection, flowSelection, request.id, state.currentChatModel);
      if (request.cancelled) { await syncCurrentConversation(); showToast('Response stopped.'); return; }
      state.currentConversationId = result.conversationId;
      state.currentConversation.messages = state.currentConversation.messages.filter(item => item.messageId !== temporary.messageId);
      state.currentConversation.messages.push(result.userMessage);
      const artifactEvent = result.assistantMessage.kind === 'artifact_event';
      const assistantMessage = artifactEvent ? Object.assign({}, result.assistantMessage) : Object.assign({}, result.assistantMessage, {text: '', isTyping: true});
      const authorizedSelection = result.userMessage.sourceSelection || selection;
      state.currentConversation.messages.push(assistantMessage); state.currentConversation.title = result.title; state.currentConversation.sourceSelection = authorizedSelection; state.currentConversation.flowSelection = flowSelection;
      state.selectedSources = new Set(normalizeSelectedDocumentIds(authorizedSelection));
      state.currentConversation.model = state.currentChatModel;
      state.conversationSelections.set(result.conversationId, authorizedSelection);
      state.flowSelections.set(result.conversationId, flowSelection);
      const record = state.projectDetails.conversations.find(item => item.conversationId === result.conversationId);
      if (record) { record.title = result.title; record.updatedAt = result.assistantMessage.createdAt; record.messageCount = result.messageCount; record.model = state.currentChatModel; }
      else state.projectDetails.conversations.unshift({conversationId: result.conversationId, title: result.title, updatedAt: result.assistantMessage.createdAt, messageCount: result.messageCount, model:state.currentChatModel, agentId:result.assistantMessage.agentId, agentVersion:result.assistantMessage.agentVersion});
      renderConversationList(); renderMessages(); request.phase = 'typing';
      if (artifactEvent) {
        request.phase = 'complete';
        await refreshDocumentGraph();
        await openDocumentPreview(result.assistantMessage.artifact.nodeId);
        showToast(`${result.assistantMessage.artifact.name} saved as a project artifact.${(result.assistantMessage.sourceWarnings || []).length ? ` ${result.assistantMessage.sourceWarnings.length} selected source${result.assistantMessage.sourceWarnings.length === 1 ? ' was' : 's were'} unavailable for this response.` : ''}`);
        return;
      }
      const completed = await typeAssistantResponse(assistantMessage, result.assistantMessage.text, request);
      assistantMessage.isTyping = false;
      if (!completed) {
        const stoppedText = request.displayedText.trim() || '[Response stopped]'; assistantMessage.text = stoppedText;
        try { await server('truncateAssistantMessage', state.currentProjectId, state.currentConversationId, assistantMessage.messageId, stoppedText); } catch (_) {}
        showToast('Response stopped.');
      }
      if (completed && (result.assistantMessage.sourceWarnings || []).length) {
        showToast(`Response completed; ${result.assistantMessage.sourceWarnings.length} selected source${result.assistantMessage.sourceWarnings.length === 1 ? ' was' : 's were'} unavailable while indexing continues.`);
      }
      renderConversationList(); renderMessages();
    } catch (error) {
      await syncCurrentConversation();
      showToast(state.activeRequest && state.activeRequest.cancelled ? 'Response stopped.' : error.message, !(state.activeRequest && state.activeRequest.cancelled));
    } finally { state.busy = false; state.activeRequest = null; setAgentBusy(false); input.focus(); }
  }

  function sanitizeHtmlPreview_(html) {
    const parsed = new DOMParser().parseFromString(String(html || ''), 'text/html');
    parsed.querySelectorAll('script,object,embed,iframe,link,meta,base').forEach(node => node.remove());
    parsed.querySelectorAll('*').forEach(node => Array.from(node.attributes).forEach(attribute => {
      const name = attribute.name.toLowerCase(); const value = attribute.value.trim().toLowerCase();
      if (name.startsWith('on') || ((name === 'href' || name === 'src' || name === 'action') && value.startsWith('javascript:'))) node.removeAttribute(attribute.name);
    }));
    return '<!doctype html>' + parsed.documentElement.outerHTML;
  }

  async function typeAssistantResponse(message, fullText, request) {
    const chunks = Math.min(200, Math.max(35, Math.ceil(fullText.length / 18))); const step = Math.max(1, Math.ceil(fullText.length / chunks));
    for (let end = step; end < fullText.length + step; end += step) {
      if (request.cancelled) return false;
      request.displayedText = fullText.slice(0, Math.min(end, fullText.length)); message.text = request.displayedText;
      const body = document.getElementById('message-body-' + message.messageId); if (body) body.innerHTML = formatMarkdown(message.text);
      scrollChatToBottom(); await delay(12);

    message.text = fullText; return true;

  function renderDocumentGraph() {
    if (!state.projectDetails) return;
    const container = document.getElementById('document-levels');
    const persistedNodes = state.documentNodes || [];
    const nodes = persistedNodes.concat(Array.from(state.pendingUploads.values()));
    nodes.filter(node => node.locked).forEach(node => state.selectedSources.add(node.nodeId));
    const levels = [...new Set(nodes.map(node => Number(node.level || 0)))].sort((a,b) => a-b);
    container.innerHTML = levels.map(level => {
      const items = nodes.filter(node => Number(node.level || 0) === level);
      const selectableItems = items.filter(node => node.kind !== 'pending-upload');
      const selected = selectableItems.filter(node => state.selectedSources.has(node.nodeId)).length;
      const allChecked = selectableItems.length > 0 && selected === selectableItems.length;
      const partial = selected > 0 && selected < selectableItems.length;
      const levelLabel = level === -1 ? `Agent knowledge · ${escapeHtml((state.projectAgent || {}).name || 'Loaded agent')}` : level === 0 ? 'Project sources' : `Generated · Level ${level}`;
      const collapsed = state.collapsedDocumentLevels.has(level);
      return `<section class="document-level ${level === -1 ? 'agent-knowledge-level' : ''} ${collapsed ? 'collapsed' : ''}" data-level="${level}">
        <div class="level-heading"><label class="level-select"><input type="checkbox" data-level-select="${level}" ${allChecked ? 'checked' : ''} ${partial ? 'data-partial="true"' : ''} ${selectableItems.length ? '' : 'disabled'}><span class="level-icon" aria-hidden="true">${level === -1 ? '🧠' : level === 0 ? '📥' : '✨'}</span><span class="level-title">${levelLabel}</span></label><span class="level-heading-actions"><small>${items.length}</small><button type="button" class="level-collapse-button" data-level-collapse="${level}" aria-expanded="${collapsed ? 'false' : 'true'}" title="${collapsed ? 'Expand' : 'Collapse'} this level"><i aria-hidden="true"></i></button></span></div>
        <div class="level-track">${items.map(renderDocumentCard).join('')}</div>
      </section>`;
    }).join('');
    const pendingCount = state.pendingUploads.size;
    document.getElementById('document-count-label').textContent = `${persistedNodes.length} ${persistedNodes.length === 1 ? 'item' : 'items'}${pendingCount ? ` · ${pendingCount} uploading` : ''}`;
    document.getElementById('empty-documents').classList.toggle('hidden', nodes.length > 0);
    container.querySelectorAll('[data-level-select]').forEach(input => {
      if (input.dataset.partial === 'true') input.indeterminate = true;
      input.addEventListener('change', () => toggleDocumentLevel(Number(input.dataset.levelSelect), input.checked));
    });
    container.querySelectorAll('[data-level-collapse]').forEach(button => button.addEventListener('click', () => toggleDocumentLevelCollapsed_(Number(button.dataset.levelCollapse))));
    container.querySelectorAll('[data-document-select]').forEach(input => input.addEventListener('change', () => toggleDocumentSelection(input.dataset.documentSelect, input.checked)));
    container.querySelectorAll('[data-document-menu]').forEach(button => button.addEventListener('click', event => toggleDocumentMenu(event, button)));
    container.querySelectorAll('[data-edit-document-note]').forEach(button => button.addEventListener('click', event => { event.stopPropagation(); openDocumentNoteModal(button.dataset.editDocumentNote); }));
    container.querySelectorAll('[data-index-source]').forEach(button => button.addEventListener('click', event => { event.stopPropagation(); indexSingleSource(button.dataset.indexSource, button); }));
    container.querySelectorAll('[data-check-index]').forEach(button => button.addEventListener('click', event => { event.stopPropagation(); showIndexDiagnostic(button.dataset.checkIndex, button); }));
    container.querySelectorAll('[data-generate-report]').forEach(button => button.addEventListener('click', event => { event.stopPropagation(); generateReport(button.dataset.generateReport, button); }));
    container.querySelectorAll('[data-delete-document]').forEach(button => button.addEventListener('click', event => { event.stopPropagation(); deleteDocumentNode(button.dataset.deleteDocument, button); }));
    container.querySelectorAll('.document-card').forEach(card => {
      card.addEventListener('mouseenter', () => highlightDocumentRelations(card.dataset.nodeId));
      card.addEventListener('mouseleave', () => state.highlightedDocumentId ? highlightDocumentRelations(state.highlightedDocumentId) : clearDocumentHighlights());
      card.addEventListener('focusin', () => highlightDocumentRelations(card.dataset.nodeId));
      card.addEventListener('focusout', () => state.highlightedDocumentId ? highlightDocumentRelations(state.highlightedDocumentId) : clearDocumentHighlights());
      card.addEventListener('click', event => {
        if (event.target.closest('button,a,input,label')) return;

    });

    renderSourceChips();

  function documentLevelStorageKey_(projectId) { return `gpa.collapsedDocumentLevels.${projectId}`; }

  function readCollapsedDocumentLevels_(projectId) {

  async function persistDocumentCardOrder_(orderedIds) {

  function documentProgressMarkup_(node) {

  }

  function toggleDocumentSelection(nodeId, checked) {
    const node = state.documentNodes.find(item => item.nodeId === nodeId); if (node && node.locked) return;
    checked ? state.selectedSources.add(nodeId) : state.selectedSources.delete(nodeId); rememberCurrentSelection(); updateDocumentSelectionUi();
  }

  function toggleDocumentLevel(level, checked) {

  function rememberCurrentSelection() {

  function updateDocumentSelectionUi() {
    state.documentNodes.filter(node => node.locked).forEach(node => state.selectedSources.add(node.nodeId));

  function renderSourceChips() {
    const selected = state.documentNodes.filter(node => state.selectedSources.has(node.nodeId));
