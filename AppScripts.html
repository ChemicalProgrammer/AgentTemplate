<script>
  const PROJECT_EMOJIS = Object.freeze(['✨','🧠','📚','🧪','⚙️','📊','💡','🚀','🌱','🎯','🧭','🧩','🔬','🏗️','📝','💼','🎨','🌎','🤖','🗂️','⚗️','🧬','🧮','📐','🛠️','🏭','🔋','🌡️','💧','🔥','♻️','✅','📈','🔎','🛰️','🛡️','🎓','📋','🔗','🌐']);
  const PROJECT_COLORS = Object.freeze({
    blue:   {label:'Ocean', accent:'#0b57d0', tint:'#e8f0fe', tintStrong:'#d3e3fd'},
    violet: {label:'Violet', accent:'#7451c8', tint:'#f0eafd', tintStrong:'#e4d7fb'},
    coral:  {label:'Coral', accent:'#c84031', tint:'#fcebea', tintStrong:'#f7d5d1'},
    amber:  {label:'Amber', accent:'#a15c00', tint:'#fef4df', tintStrong:'#fbe4b5'},
    green:  {label:'Fern', accent:'#137333', tint:'#e7f4ea', tintStrong:'#cdebd4'},
    teal:   {label:'Teal', accent:'#00796b', tint:'#e1f3f1', tintStrong:'#c4e8e3'},
    rose:   {label:'Rose', accent:'#a83e72', tint:'#f9e8f0', tintStrong:'#f3cfe0'},
    slate:  {label:'Slate', accent:'#56616f', tint:'#edf0f4', tintStrong:'#dce2e9'},
    indigo: {label:'Indigo', accent:'#3949ab', tint:'#e8eafc', tintStrong:'#cfd3f6'},
    cyan:   {label:'Cyan', accent:'#007c91', tint:'#e0f4f7', tintStrong:'#bde7ed'},
    lime:   {label:'Lime', accent:'#587d13', tint:'#eff7df', tintStrong:'#dcedb7'},
    orange: {label:'Orange', accent:'#b84d00', tint:'#fff0e3', tintStrong:'#ffd9ba'},
    plum:   {label:'Plum', accent:'#7c3d82', tint:'#f6e9f7', tintStrong:'#ebd1ee'},
    graphite:{label:'Graphite', accent:'#3f4752', tint:'#e9edf1', tintStrong:'#d2d9e0'}
  });

  const state = {
    bootstrap: null,
    projects: [],
    agents: [],
    agentSearch: '',
    currentAgentId: null,
    currentAgentDetails: null,
    currentAgentAssetType: '',
    currentAgentKnowledgeMode: '',
    projectAgent: null,
    availableAgents: [],
    dashboardFilter: 'all',
    search: '',
    projectDetails: null,
    documentNodes: [],
    currentProjectId: null,
    currentConversationId: null,
    currentConversation: null,
    conversationSelections: new Map(),
    flowSelections: new Map(),
    selectedSources: new Set(),
    selectedFlows: new Set(),
    selectedTemplateId: '',
    busy: false,
    activeRequest: null,
    confirmResolver: null,
    highlightedDocumentId: null,
    editingDocumentId: null,
    diagnosingSourceId: null,
    lastProjectRefresh: 0,
    projectLoadToken: 0,
    panelLoaded: {chats:false, documents:false, templates:false, flows:false, members:false},
    panelLoading: {chats:false, documents:false, templates:false, flows:false, members:false}
  };

  document.addEventListener('DOMContentLoaded', () => {
    renderEmojiOptions();
    renderColorOptions();
    bindStaticEvents();
    restorePanelWidth();
    startApp();
  });

  function server(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(clientErrorMessage(error))));
      runner[functionName](...args);
    });
  }

  async function startApp() {
    try {
      const data = await server('getBootstrap');
      state.bootstrap = data;
      document.getElementById('boot-loader').classList.add('hidden');
      if (!data.initialized) {
        document.getElementById('setup-screen').classList.remove('hidden');
        if (data.identity.email.includes('@')) document.getElementById('setup-domain').value = data.identity.email.split('@')[1];
        return;
      }
      state.projects = data.projects || [];
      state.agents = data.agents || [];
      document.getElementById('app-shell').classList.remove('hidden');
      setWorkspaceMode('home');
      applyIdentity();
      showHome();
    } catch (error) {
      document.getElementById('boot-loader').classList.add('hidden');
      showToast(error.message, true);
    }
  }

  function applyIdentity() {
    const data = state.bootstrap;
    const email = data.identity.email || 'User';
    document.getElementById('user-avatar').textContent = initials(email.split('@')[0]);
    document.getElementById('user-avatar').title = email;
    document.getElementById('domain-label').textContent = '@' + data.config.organizationDomain;
    updateKeyStatus(data.userSettings);
  }

  function updateKeyStatus(settings) {
    const box = document.getElementById('key-status');
    box.classList.toggle('ready', Boolean(settings.configured));
    box.textContent = settings.configured ? `✓ Gemini · ••••${settings.keySuffix} · ${settings.model}` : '⚠ Add your Gemini API key';
  }

  function bindStaticEvents() {
    document.getElementById('setup-form').addEventListener('submit', configureApp);
    document.getElementById('brand-home').addEventListener('click', showHome);
    document.getElementById('open-agents-route').addEventListener('click', showAgents);
    document.getElementById('open-projects-route').addEventListener('click', showDashboard);
    document.getElementById('agents-back-home').addEventListener('click', showHome);
    document.getElementById('projects-back-home').addEventListener('click', showHome);
    document.getElementById('agent-editor-back').addEventListener('click', showAgents);
    document.getElementById('agent-search').addEventListener('input', event => { state.agentSearch = event.target.value.toLowerCase(); renderAgents(); });
    document.getElementById('refresh-agents').addEventListener('click', refreshAgents);
    document.getElementById('create-agent').addEventListener('click', () => { openModal('agent-modal'); document.getElementById('new-agent-name').focus(); });
    document.getElementById('agent-form').addEventListener('submit', submitAgent);
    document.getElementById('save-agent').addEventListener('click', saveAgentDraft);
    document.getElementById('publish-agent').addEventListener('click', openPublishAgentModal);
    document.getElementById('publish-agent-form').addEventListener('submit', submitPublishAgent);
    document.getElementById('clone-agent').addEventListener('click', cloneCurrentAgent);
    document.getElementById('agent-asset-form').addEventListener('submit', submitAgentAsset);
    document.querySelectorAll('[data-agent-add]').forEach(button => button.addEventListener('click', () => openAgentAssetModal(button.dataset.agentAdd, button.dataset.knowledgeMode || '')));
    document.querySelectorAll('[data-agent-section-link]').forEach(button => button.addEventListener('click', () => scrollAgentSection(button.dataset.agentSectionLink)));
    document.getElementById('global-search').addEventListener('input', event => { state.search = event.target.value.toLowerCase(); renderProjects(); });
    document.querySelectorAll('[data-dashboard-filter]').forEach(button => button.addEventListener('click', () => {
      state.dashboardFilter = button.dataset.dashboardFilter;
      syncDashboardFilters(); renderProjects();
    }));
    document.getElementById('create-project-heading').addEventListener('click', openNewProjectModal);
    document.getElementById('refresh-projects').addEventListener('click', refreshProjects);
    document.getElementById('settings-button').addEventListener('click', openSettings);
    document.getElementById('project-settings-button').addEventListener('click', openSettings);
    document.getElementById('project-agent-button').addEventListener('click', openChangeAgentModal);
    document.getElementById('change-agent-form').addEventListener('submit', submitChangeProjectAgent);
    document.getElementById('back-dashboard').addEventListener('click', showDashboard);
    document.getElementById('toggle-project-panel').addEventListener('click', () => document.getElementById('project-side-panel').classList.toggle('mobile-open'));
    document.getElementById('project-header-icon').addEventListener('click', openProjectEmojiPicker);
    document.getElementById('share-project-button').addEventListener('click', openShareModal);
    document.querySelectorAll('[data-side-tab]').forEach(tab => tab.addEventListener('click', () => showSideTab(tab.dataset.sideTab)));
    document.getElementById('new-conversation').addEventListener('click', () => newConversation(false));
    document.getElementById('send-message').addEventListener('click', sendMessage);
    document.getElementById('stop-response').addEventListener('click', stopResponse);
    document.getElementById('chat-input').addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }
    });
    document.getElementById('chat-input').addEventListener('input', autoSizeComposer);
    document.querySelectorAll('[data-prompt]').forEach(button => button.addEventListener('click', () => {
      const input = document.getElementById('chat-input'); input.value = button.dataset.prompt; autoSizeComposer(); input.focus();
    }));
    document.getElementById('add-source-link').addEventListener('click', () => openModal('source-link-modal'));
    document.getElementById('source-upload').addEventListener('change', uploadSourceFile);
    document.getElementById('sync-source-index').addEventListener('click', syncSourceIndex);
    document.getElementById('add-template-link').addEventListener('click', () => openModal('template-link-modal'));
    document.getElementById('template-link-form').addEventListener('submit', submitTemplateLink);
    document.getElementById('add-flow-link').addEventListener('click', () => openModal('flow-link-modal'));
    document.getElementById('flow-link-form').addEventListener('submit', submitFlowLink);
    document.getElementById('flow-upload').addEventListener('change', uploadFlowFile);
    document.getElementById('add-member-button').addEventListener('click', () => openModal('member-modal'));
    document.getElementById('gemini-settings-form').addEventListener('submit', saveGeminiSettings);
    document.getElementById('root-settings-form').addEventListener('submit', saveRootFolderSettings);
    document.getElementById('load-models').addEventListener('click', loadModels);
    document.getElementById('project-form').addEventListener('submit', submitProject);
    document.getElementById('source-link-form').addEventListener('submit', submitSourceLink);
    document.getElementById('document-note-form').addEventListener('submit', saveDocumentNote);
    document.getElementById('retry-index-diagnostic').addEventListener('click', retryIndexFromDiagnostic);
    document.getElementById('refresh-index-diagnostic').addEventListener('click', refreshIndexDiagnostic);
    document.getElementById('member-form').addEventListener('submit', submitMember);
    document.getElementById('member-scope').addEventListener('change', event => document.getElementById('custom-permissions').classList.toggle('hidden', event.target.value !== 'custom'));
    document.getElementById('confirm-cancel').addEventListener('click', () => resolveConfirmation(false));
    document.getElementById('confirm-action').addEventListener('click', () => resolveConfirmation(true));
    document.querySelectorAll('[data-close-modal]').forEach(button => button.addEventListener('click', closeModals));
    document.getElementById('modal-backdrop').addEventListener('click', event => { if (event.target.id === 'modal-backdrop') closeModals(); });
    document.getElementById('project-panel-grip').addEventListener('pointerdown', startPanelResize);
    document.getElementById('project-panel-grip').addEventListener('keydown', resizePanelWithKeyboard);
    document.addEventListener('click', event => {
      if (!event.target.closest('.document-menu-wrap')) closeDocumentMenus();
      if (!event.target.closest('.project-card-menu-wrap')) closeProjectCardMenus();
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeDocumentMenus(); closeProjectCardMenus(); closeModals(); } });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && state.currentProjectId == null && Date.now() - state.lastProjectRefresh > 15000) refreshProjects(true);
    });
  }

  async function configureApp(event) {
    event.preventDefault(); setBusy(event.target, true);
    try {
      state.bootstrap = await server('setupApplication', {
        organizationDomain: document.getElementById('setup-domain').value,
        rootFolderId: document.getElementById('setup-root').value
      });
      state.projects = state.bootstrap.projects || [];
      state.agents = state.bootstrap.agents || [];
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      setWorkspaceMode('home'); applyIdentity(); showHome(); showToast('Application configured.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  function hideWorkspaceViews_() {
    ['home-view','agents-view','agent-editor-view','dashboard-view','project-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
  }

  function showHome() {
    if (state.activeRequest) stopResponse();
    state.projectLoadToken++;
    state.currentProjectId = null; state.projectDetails = null; state.currentAgentId = null; state.currentAgentDetails = null;
    hideWorkspaceViews_(); document.getElementById('home-view').classList.remove('hidden');
    setWorkspaceMode('home');
    document.getElementById('home-agent-count').textContent = state.agents.length;
    document.getElementById('home-project-count').textContent = state.projects.length;
  }

  function showAgents() {
    hideWorkspaceViews_(); document.getElementById('agents-view').classList.remove('hidden');
    setWorkspaceMode('agents'); renderAgents();
  }

  function renderAgents() {
    const agents = state.agents.filter(agent => !state.agentSearch || `${agent.name} ${agent.description} ${agent.owner}`.toLowerCase().includes(state.agentSearch));
    const grid = document.getElementById('agent-grid');
    grid.innerHTML = agents.map((agent, index) => `<article class="agent-card" style="--card-index:${index};${projectColorStyle(agent.color)}" data-agent-id="${escapeHtml(agent.agentId)}" tabindex="0">
      <div class="agent-card-top"><div class="agent-avatar">${escapeHtml(agent.icon || '✦')}</div><span class="status-pill ${escapeHtml(agent.status)}">${escapeHtml(agent.status || 'draft')}</span></div>
      <h3>${escapeHtml(agent.name)}</h3><p class="description">${escapeHtml(agent.description || 'No description')}</p>
      <div class="agent-card-stats"><span><b>${numberValue(agent.sourceCount)}</b> knowledge</span><span><b>${numberValue(agent.workflowCount)}</b> workflows</span><span><b>${numberValue(agent.templateCount)}</b> templates</span></div>
      <div class="agent-version-row"><span>${agent.hasDraftChanges ? 'Draft changes not published' : escapeHtml(shortEmail(agent.owner))}</span><span class="version-pill">${agent.publishedVersion ? 'v' + escapeHtml(agent.publishedVersion) : 'Draft only'}</span></div>
    </article>`).join('');
    document.getElementById('empty-agents').classList.toggle('hidden', agents.length > 0);
    grid.querySelectorAll('.agent-card').forEach(card => {
      card.addEventListener('click', () => openAgent(card.dataset.agentId));
      card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openAgent(card.dataset.agentId); } });
    });
  }

  async function refreshAgents() {
    const button = document.getElementById('refresh-agents'); setBusy(button, true);
    try { state.agents = await server('refreshAgents'); renderAgents(); updateHomeCounts_(); showToast('Agents folder scanned.'); }
    catch (error) { showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

  async function submitAgent(event) {
    event.preventDefault(); setBusy(event.target, true);
    try {
      const agent = await server('createAgent', {name:document.getElementById('new-agent-name').value,description:document.getElementById('new-agent-description').value});
      state.agents.unshift(agent); closeModals(); event.target.reset(); renderAgents(); updateHomeCounts_(); await openAgent(agent.agentId); showToast('Agent draft created.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  async function openAgent(agentId) {
    hideWorkspaceViews_(); document.getElementById('agent-editor-view').classList.remove('hidden'); setWorkspaceMode('agents');
    state.currentAgentId = agentId; state.currentAgentDetails = null;
    document.getElementById('agent-editor-name').textContent = 'Opening agent…';
    try { state.currentAgentDetails = await server('getAgentDetails', agentId); renderAgentEditor(); }
    catch (error) { showToast(error.message, true); showAgents(); }
  }

  function renderAgentEditor() {
    const details = state.currentAgentDetails; if (!details) return;
    const agent = details.agent; const assets = details.assets || {};
    document.getElementById('agent-editor-icon').textContent = agent.icon || '✦';
    document.getElementById('agent-editor-name').textContent = agent.name;
    document.getElementById('agent-editor-status').textContent = agent.status || 'draft';
    document.getElementById('agent-editor-status').className = `status-pill ${agent.status || 'draft'}`;
    document.getElementById('agent-editor-version').textContent = agent.publishedVersion ? `Published v${agent.publishedVersion}${agent.hasDraftChanges ? ' · draft changed' : ''}` : 'Not published';
    document.getElementById('open-agent-folder').href = details.folderUrl || agent.folderUrl || '#';
    document.getElementById('edit-agent-name').value = agent.name || '';
    document.getElementById('edit-agent-description').value = agent.description || '';
    document.getElementById('edit-agent-instructions').value = details.instructions || '';
    const validation = details.validation || {valid:true,errors:[],warnings:[]};
    const validationBadge = document.getElementById('agent-validation-badge');
    validationBadge.textContent = validation.valid ? validation.warnings.length ? `${validation.warnings.length} recommendation${validation.warnings.length===1?'':'s'}` : 'Ready to publish' : `${validation.errors.length} validation error${validation.errors.length===1?'':'s'}`;
    validationBadge.title = (validation.errors || []).concat(validation.warnings || []).join('\n');
    document.getElementById('save-agent').classList.toggle('hidden', !agent.canEdit);
    document.getElementById('publish-agent').classList.toggle('hidden', !agent.canEdit);
    document.querySelectorAll('[data-agent-add]').forEach(button => button.classList.toggle('hidden', !agent.canEdit));
    renderAgentResourceList_('agent-mandatory-list', assets.mandatoryKnowledge, 'DOC', agent.canEdit);
    renderAgentResourceList_('agent-optional-list', assets.optionalKnowledge, 'DOC', agent.canEdit);
    renderAgentResourceList_('agent-workflow-list', assets.workflows, 'MD', agent.canEdit);
    renderAgentResourceList_('agent-template-list', assets.templates, 'TPL', agent.canEdit);
    renderAgentResourceList_('agent-output-list', assets.outputFormats, 'OUT', agent.canEdit);
    renderAgentResourceList_('agent-policy-list', assets.policies, 'POL', agent.canEdit);
    renderAgentResourceList_('agent-asset-list', assets.assets, 'AST', agent.canEdit);
    renderAgentResourceList_('agent-example-list', assets.examples, 'EX', agent.canEdit);
    renderAgentResourceList_('agent-evaluation-list', assets.evaluations, 'TEST', agent.canEdit);
    const releases = details.versions || [];
    document.getElementById('agent-release-list').innerHTML = releases.length ? releases.map(release => `<article class="release-row"><span class="version-pill">v${escapeHtml(release.version)}</span><span><strong>${escapeHtml(agent.name)}</strong><small>Published ${formatDate(release.releasedAt)} by ${escapeHtml(shortEmail(release.releasedBy || agent.owner))}</small></span><span class="release-metric"><b>${numberValue(release.sourceCount)}</b>sources</span><span class="release-metric"><b>${numberValue(release.workflowCount)}</b>flows</span><span class="release-metric"><b>${numberValue(release.templateCount)}</b>templates</span></article>`).join('') : '<div class="resource-empty">No published versions yet.</div>';
    document.querySelectorAll('[data-remove-agent-asset]').forEach(button => button.addEventListener('click', () => removeAgentAsset(button.dataset.removeAgentAsset, button)));
  }

  function renderAgentResourceList_(id, items = [], icon, canEdit) {
    const container = document.getElementById(id);
    container.innerHTML = items.length ? items.map(item => `<article class="agent-resource-item"><span class="resource-icon">${icon}</span><span class="resource-copy"><strong title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</strong><small title="${escapeHtml(item.relativePath || '')}">${escapeHtml(item.relativePath || friendlyMime(item.mimeType))} · ${formatFileSize(item.size)}</small></span><span class="resource-actions">${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" title="Open in Drive">↗</a>` : ''}${canEdit ? `<button data-remove-agent-asset="${escapeHtml(item.driveId)}" title="Remove from draft">×</button>` : ''}</span></article>`).join('') : '<div class="resource-empty">No resources in this section.</div>';
  }

  async function saveAgentDraft() {
    if (!state.currentAgentId) return;
    const button = document.getElementById('save-agent'); setBusy(button, true);
    try {
      state.currentAgentDetails = await server('updateAgent', state.currentAgentId, {name:document.getElementById('edit-agent-name').value,description:document.getElementById('edit-agent-description').value,instructions:document.getElementById('edit-agent-instructions').value});
      upsertAgentSummary_(state.currentAgentDetails.agent); renderAgentEditor(); showToast('Agent draft saved.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

  function openAgentAssetModal(type, knowledgeMode) {
    if (!state.currentAgentDetails || !state.currentAgentDetails.agent.canEdit) return;
    state.currentAgentAssetType = type; state.currentAgentKnowledgeMode = knowledgeMode;
    document.getElementById('agent-asset-type').value = type; document.getElementById('agent-knowledge-mode').value = knowledgeMode;
    const names = {knowledge:knowledgeMode === 'optional' ? 'Add optional knowledge' : 'Add mandatory knowledge',workflow:'Add workflow',template:'Add output template',output:'Add output requirement',policy:'Add policy',example:'Add example',evaluation:'Add evaluation',asset:'Add visual asset'};
    document.getElementById('agent-asset-title').textContent = names[type] || 'Add agent resource';
    openModal('agent-asset-modal'); document.getElementById('agent-asset-drive-url').focus();
  }

  async function submitAgentAsset(event) {
    event.preventDefault(); setBusy(event.target, true);
    try {
      state.currentAgentDetails = await server('addAgentAssetFromDrive', state.currentAgentId, document.getElementById('agent-asset-type').value, document.getElementById('agent-asset-drive-url').value, document.getElementById('agent-knowledge-mode').value);
      closeModals(); event.target.reset(); renderAgentEditor(); upsertAgentSummary_(state.currentAgentDetails.agent); showToast('Resource copied into the agent draft.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  async function removeAgentAsset(driveId, button) {
    const confirmed = await askConfirmation({title:'Remove this draft resource?',message:'The file will be moved to Drive trash. Published agent versions remain unchanged.',action:'Remove resource'}); if (!confirmed) return;
    setBusy(button, true);
    try { state.currentAgentDetails = await server('removeAgentAsset', state.currentAgentId, driveId); renderAgentEditor(); showToast('Resource removed from the draft.'); }
    catch (error) { showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

  function openPublishAgentModal() {
    const current = state.currentAgentDetails && state.currentAgentDetails.agent.publishedVersion;
    const parts = String(current || '0.0.0').split('.').map(value => parseInt(value,10) || 0);
    document.getElementById('publish-agent-version').value = current ? `${parts[0]}.${parts[1]}.${parts[2] + 1}` : '1.0.0';
    openModal('publish-agent-modal'); document.getElementById('publish-agent-version').focus();
  }

  async function submitPublishAgent(event) {
    event.preventDefault(); setBusy(event.target, true);
    try {
      const result = await server('publishAgent', state.currentAgentId, document.getElementById('publish-agent-version').value);
      closeModals(); upsertAgentSummary_(result); state.currentAgentDetails = await server('getAgentDetails', state.currentAgentId); renderAgentEditor();
      showToast(result.warnings && result.warnings.length ? result.warnings.join(' ') : `Agent version ${result.publishedVersion} published.`);
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(event.target, false); }
  }

  async function cloneCurrentAgent() {
    if (!state.currentAgentId) return;
    const confirmed = await askConfirmation({title:'Clone this agent?',message:'A complete editable copy will be created with a new identity. Published releases will not be inherited.',action:'Clone agent',tone:'primary'}); if(!confirmed)return;
    const button=document.getElementById('clone-agent');setBusy(button,true);
    try{const clone=await server('cloneAgent',state.currentAgentId);state.agents.unshift(clone);updateHomeCounts_();await openAgent(clone.agentId);showToast('Agent cloned as a new draft.');}catch(error){showToast(error.message,true);}finally{setBusy(button,false);}
  }

  function scrollAgentSection(name) {
    document.querySelectorAll('[data-agent-section-link]').forEach(button => button.classList.toggle('active', button.dataset.agentSectionLink === name));
    const section = document.getElementById('agent-section-' + name); if (section) section.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function upsertAgentSummary_(agent) {
    const index = state.agents.findIndex(item => item.agentId === agent.agentId);
    if (index === -1) state.agents.unshift(agent); else state.agents[index] = Object.assign({}, state.agents[index], agent);
    updateHomeCounts_();
  }

  function updateHomeCounts_() {
    document.getElementById('home-agent-count').textContent = state.agents.length;
    document.getElementById('home-project-count').textContent = state.projects.length;
  }

  function publishedAgents_() { return state.agents.filter(agent => Boolean(agent.publishedVersion)); }

  function publishedAgentOptions_(agents = publishedAgents_()) {
    return agents.flatMap(agent => (agent.versions && agent.versions.length ? agent.versions : [{version:agent.publishedVersion}]).map(release => ({agentId:agent.agentId,version:release.version,name:agent.name,icon:agent.icon,isCurrent:release.version===agent.publishedVersion})));
  }

  function populateAgentSelect_(select, selectedId, selectedVersion) {
    const options = publishedAgentOptions_();
    select.innerHTML = options.map(option => `<option value="${escapeHtml(option.agentId + '@@' + option.version)}" ${option.agentId === selectedId && (!selectedVersion || option.version === selectedVersion) ? 'selected' : ''}>${escapeHtml(option.name)} · v${escapeHtml(option.version)}${option.isCurrent ? ' · current' : ''}</option>`).join('');
    select.disabled = !options.length;
  }

  function renderProjects() {
    const grid = document.getElementById('project-grid');
    const projects = state.projects.filter(project => {
      const matchesText = !state.search || `${project.title} ${project.description} ${project.owner}`.toLowerCase().includes(state.search);
      const matchesFilter = state.dashboardFilter === 'favorite' ? project.favorite : state.dashboardFilter === 'all' || project.status === state.dashboardFilter;
      return matchesText && matchesFilter;
    });

  async function openProject(projectId) {
    const loadToken = ++state.projectLoadToken;
    const cachedProject = state.projects.find(item => item.projectId === projectId) || {projectId, title:'Project', description:'', icon:'✨', color:'blue', role:'', scope:''};
    document.getElementById('project-side-panel').classList.remove('mobile-open');
    document.getElementById('dashboard-view').classList.add('hidden');
    const projectView = document.getElementById('project-view');
    projectView.classList.remove('hidden'); projectView.classList.add('view-entering');
    setWorkspaceMode('project');
    state.currentProjectId = projectId; state.currentConversationId = null; state.currentConversation = null;
    state.documentNodes = []; state.conversationSelections = new Map(); state.flowSelections = new Map();
    state.selectedSources = new Set(); state.selectedFlows = new Set(); state.selectedTemplateId = '';
    state.projectAgent = null; state.availableAgents = publishedAgents_();
    state.panelLoaded = {chats:false, documents:false, templates:false, flows:false, members:false};
    state.panelLoading = {chats:false, documents:false, templates:false, flows:false, members:false};
    state.projectDetails = {
      project: cachedProject,
      agent: null,
      permissions: optimisticPermissions_(cachedProject),
      conversations: [], sources: [], documents: [], templates: [], flows: [], members: []
    };
    renderProjectDetails();
    prepareProjectLoadingUi();
    showSideTab(state.projectDetails.permissions.history ? 'chats' : 'documents', false);
    try {
      const shell = await server('getProjectShell', projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.projectDetails.project = shell.project;
      state.projectDetails.permissions = shell.permissions;
      state.projectAgent = shell.agent || null;
      state.availableAgents = shell.availableAgents || publishedAgents_();
      syncProjectSummary(state.projectDetails); renderProjectDetails();
      const initialTab = shell.permissions.history ? 'chats' : 'documents';
      showSideTab(initialTab, false);
      const tasks = [];
      if (shell.permissions.history) tasks.push(loadProjectChats_(projectId, loadToken));
      else { setPanelLoading_('chats', false); setChatPanelLoading_(false); renderChatEmpty(true); }
      if (shell.permissions.sources || shell.permissions.documents) tasks.push(loadProjectDocuments_(projectId, loadToken));
      else setPanelLoading_('documents', false);
      Promise.allSettled(tasks).then(() => {
        if (loadToken === state.projectLoadToken) updateComposerAvailability_();
      });
    } catch (error) { showToast(error.message, true); showDashboard(); }
    finally { setTimeout(() => projectView.classList.remove('view-entering'), 360); }
  }

  function optimisticPermissions_(project) {
    const full = project.scope === 'full';
    return {
      project: full,
      sources: full || project.scope === 'sources_documents',
      documents: full || project.scope === 'sources_documents',
      history: full || project.scope === 'history',
      share: project.role === 'owner',
      edit: project.role && project.role !== 'viewer'
    };
  }

  function prepareProjectLoadingUi() {
    ['chats','documents','templates','flows'].forEach(name => setPanelLoading_(name, true));
    state.panelLoading.templates = false;
    state.panelLoading.flows = false;
    setChatPanelLoading_(true);
    document.getElementById('members-table').innerHTML = '';
    document.getElementById('chat-input').disabled = true;
  }

  function setPanelLoading_(name, busy) {
    state.panelLoading[name] = Boolean(busy);
    const loader = document.getElementById(name + '-panel-loader');
    if (loader) loader.classList.toggle('hidden', !busy);
    const contentIds = {chats:'conversation-list', documents:'document-levels', templates:'template-list', flows:'flow-list'};
    const content = document.getElementById(contentIds[name]);
    if (content) content.classList.toggle('hidden', Boolean(busy));
    const empty = document.getElementById('empty-' + name);
    if (empty && busy) empty.classList.add('hidden');
  }

  function setChatPanelLoading_(busy) {
    const loader = document.getElementById('chat-panel-loader');
    loader.classList.toggle('hidden', !busy);
    if (busy) {
      document.getElementById('chat-empty').classList.add('hidden');
      document.getElementById('chat-messages').classList.add('hidden');
    } else {
      document.getElementById('chat-messages').classList.remove('hidden');
    }
  }

  async function loadProjectChats_(projectId, loadToken) {
    setPanelLoading_('chats', true); setChatPanelLoading_(true);
    try {
      const data = await server('getProjectChatPanel', projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.projectDetails.conversations = data.conversations || [];
      state.currentConversation = data.firstConversation || null;
      state.currentConversationId = state.currentConversation ? state.currentConversation.conversationId : null;
      state.panelLoaded.chats = true;
      applyCurrentConversationSelections_();
      renderConversationList();
      if (state.currentConversation) renderMessages(); else renderChatEmpty(false);
    } catch (error) {
      if (loadToken === state.projectLoadToken) showToast('Chats could not be loaded: ' + error.message, true);
    } finally {
      if (loadToken === state.projectLoadToken) { setPanelLoading_('chats', false); setChatPanelLoading_(false); updateComposerAvailability_(); }
    }
  }

  async function loadProjectDocuments_(projectId, loadToken) {
    setPanelLoading_('documents', true);
    try {
      const data = await server('getProjectDocumentsPanel', projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.documentNodes = data.documentGraph || [];
      state.projectDetails.sources = state.documentNodes.filter(node => node.kind === 'source');
      state.projectDetails.documents = state.documentNodes.filter(node => node.kind !== 'source' && node.kind !== 'agent-source');
      state.panelLoaded.documents = true;
      applyCurrentConversationSelections_();
      syncProjectSummary(state.projectDetails); renderDocumentGraph();
      server('cleanupProjectFileSearchOrphans', projectId).then(result => {
        if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
        if (result && result.deleted) showToast(`${result.deleted} stale File Search record${result.deleted === 1 ? '' : 's'} removed.`);
      }).catch(() => {});
    } catch (error) {
      if (loadToken === state.projectLoadToken) showToast('Documents could not be loaded: ' + error.message, true);
    } finally {
      if (loadToken === state.projectLoadToken) { setPanelLoading_('documents', false); updateComposerAvailability_(); }
    }
  }

  async function ensurePanelLoaded_(name) {
    if (!state.currentProjectId || state.panelLoaded[name] || state.panelLoading[name]) return;
    const projectId = state.currentProjectId; const loadToken = state.projectLoadToken;
    const endpoints = {templates:'getProjectTemplatesPanel', flows:'getProjectFlowsPanel'};
    if (!endpoints[name]) return;
    setPanelLoading_(name, true);
    try {
      const data = await server(endpoints[name], projectId);
      if (loadToken !== state.projectLoadToken || state.currentProjectId !== projectId) return;
      state.projectDetails[name] = data[name] || [];
      state.panelLoaded[name] = true;
      if (name === 'templates') {
        state.selectedTemplateId = (state.projectDetails.templates.find(item => item.selected) || {}).templateId || '';
        renderTemplates();
      } else {
        applyCurrentConversationSelections_(); renderFlows();
      }
    } catch (error) {
      if (loadToken === state.projectLoadToken) showToast(`${name[0].toUpperCase() + name.slice(1)} could not be loaded: ${error.message}`, true);
    } finally {
      if (loadToken === state.projectLoadToken) setPanelLoading_(name, false);
    }
  }

  function applyCurrentConversationSelections_() {
    if (state.panelLoaded.documents) {
      if (state.currentConversation && Object.prototype.hasOwnProperty.call(state.currentConversation, 'sourceSelection')) {
        state.selectedSources = new Set(normalizeSelectedDocumentIds(state.currentConversation.sourceSelection));
      } else if (!state.currentConversation) selectDefaultDocuments();
    }
    if (state.currentConversation) state.selectedFlows = new Set(state.currentConversation.flowSelection || []);
    rememberCurrentSelection(); rememberCurrentFlowSelection();
    if (state.panelLoaded.documents) renderDocumentGraph();
    if (state.panelLoaded.flows) renderFlows();
  }

  function updateComposerAvailability_() {
    if (!state.projectDetails) return;
    const permissions = state.projectDetails.permissions;
    const documentsReady = !permissions.sources && !permissions.documents || state.panelLoaded.documents;
    const chatsReady = !permissions.history || state.panelLoaded.chats;
    const available = Boolean(permissions.edit && permissions.history && documentsReady && chatsReady && !state.busy);
    document.getElementById('chat-input').disabled = !available;
    document.getElementById('send-message').disabled = !available;
  }

  function syncProjectSummary(details) {
    const local = state.projects.find(item => item.projectId === details.project.projectId);
    if (!local) return;
    Object.assign(local, details.project);
    if (details.permissions.sources && state.panelLoaded.documents) local.sourceCount = state.documentNodes.filter(item => item.kind === 'source').length;
    if (details.permissions.history && state.panelLoaded.chats) local.conversationCount = (details.conversations || []).filter(item => item.status !== 'archived').length;
    if (details.permissions.documents && state.panelLoaded.documents) local.documentCount = state.documentNodes.filter(item => item.kind !== 'source' && item.kind !== 'agent-source').length;
  }

    const {project, permissions} = state.projectDetails;
    applyProjectColor(project.color);
    document.getElementById('project-title').textContent = project.title;
    document.getElementById('project-description').textContent = project.description || 'Project workspace';

    document.querySelector('.composer-wrap').classList.toggle('hidden', !permissions.edit || !permissions.history);
    document.getElementById('add-source-link').classList.toggle('hidden', !permissions.edit || !permissions.sources);
    document.querySelector('.file-button').classList.toggle('hidden', !permissions.edit || !permissions.sources);
    document.getElementById('sync-source-index').classList.toggle('hidden', !permissions.edit || !permissions.sources);
    document.getElementById('add-template-link').classList.toggle('hidden', !permissions.edit || !permissions.documents);

    const select = document.getElementById('change-project-agent');
    const agents = state.availableAgents.length ? state.availableAgents : publishedAgents_();
    const options = publishedAgentOptions_(agents);
    select.innerHTML = options.map(option => `<option value="${escapeHtml(option.agentId + '@@' + option.version)}" ${option.agentId === currentId && option.version === state.projectDetails.project.agentVersion ? 'selected' : ''}>${escapeHtml(option.name)} · v${escapeHtml(option.version)}${option.isCurrent ? ' · current' : ''}</option>`).join('');

  async function submitChangeProjectAgent(event) {
    event.preventDefault(); const select = document.getElementById('change-project-agent');
    const choice = select.value.split('@@');

      const local = state.projects.find(item => item.projectId === state.currentProjectId); if (local) Object.assign(local, result.project);
      state.currentConversation = result.conversation; state.currentConversationId = result.conversation.conversationId;
      state.projectDetails.conversations.unshift({conversationId:result.conversation.conversationId,title:result.conversation.title,createdAt:result.conversation.createdAt,updatedAt:result.conversation.updatedAt,messageCount:0,status:'active',agentId:result.conversation.agentId,agentVersion:result.conversation.agentVersion});
      state.documentNodes = []; state.selectedSources = new Set(); state.selectedFlows = new Set(); state.panelLoaded.documents = false; state.panelLoaded.templates = false; state.panelLoaded.flows = false;
      closeModals(); renderProjectDetails(); renderConversationList(); renderChatEmpty(false);
      await loadProjectDocuments_(state.currentProjectId, state.projectLoadToken);

  function showDashboard() {
    if (state.activeRequest) stopResponse();
    state.projectLoadToken++;
    state.currentProjectId = null; state.projectDetails = null; state.documentNodes = []; state.conversationSelections = new Map(); state.flowSelections = new Map(); state.selectedFlows = new Set(); state.selectedTemplateId = '';
    hideWorkspaceViews_();

    finally { if (!silent) setBusy(button, false); }

  async function openConversation(conversationId, button) {
    if (state.busy) return; if (button) setBusy(button, true);
    setChatPanelLoading_(true);
    try {
      state.currentConversationId = conversationId; renderConversationList();
      state.currentConversation = await server('loadConversation', state.currentProjectId, conversationId);
      if (state.conversationSelections.has(conversationId)) {
        state.selectedSources = new Set(state.conversationSelections.get(conversationId));
      } else if (Object.prototype.hasOwnProperty.call(state.currentConversation, 'sourceSelection')) {
        state.selectedSources = new Set(normalizeSelectedDocumentIds(state.currentConversation.sourceSelection));
      } else selectDefaultDocuments();
      if (state.flowSelections.has(conversationId)) {
        state.selectedFlows = new Set(state.flowSelections.get(conversationId));
      } else {

  async function deleteChat(conversationId, button) {

      title: 'Delete this chat?',

      state.conversationSelections.delete(conversationId);
      state.flowSelections.delete(conversationId);
      updateProjectCount('conversationCount', state.projectDetails.conversations.length);

  function renderMessages(options = {}) {

  function renderMessage(message) {

    const sources = (message.sourcesUsed || []).map(source => {
      const label = `[${escapeHtml(source.label)}] ${escapeHtml(source.name)}${source.pageNumber ? ` · p. ${numberValue(source.pageNumber)}` : ''}`;
      return source.citationUri ? `<a href="${escapeHtml(source.citationUri)}" target="_blank" rel="noopener">${label}</a>` : label;
    }).join(' · ');
    const flows = (message.flowsUsed || []).map(flow => `[${escapeHtml(flow.label)}] ${escapeHtml(flow.name)}`).join(' · ');
    if (!assistant) return `<article class="message user" data-message-id="${escapeHtml(message.messageId)}"><div class="message-body">${formatMarkdown(message.text)}</div></article>`;
    return `<article class="message assistant" data-message-id="${escapeHtml(message.messageId)}">
      <div class="message-header"><span class="message-avatar">${escapeHtml((state.projectAgent || {}).icon || '✦')}</span><span>${escapeHtml(message.agentName || (state.projectAgent || {}).name || 'Agent')}${message.agentVersion ? ` · v${escapeHtml(message.agentVersion)}` : ''}</span></div>

  }

  async function copyMessage(messageId, button) {
    const message = state.currentConversation && state.currentConversation.messages.find(item => item.messageId === messageId);
    if (!message) return;
    try { await navigator.clipboard.writeText(message.text); button.textContent = '✓'; setTimeout(() => button.textContent = '▣', 1200); }

  }

  async function sendMessage() {
    if (state.busy) return;
    const input = document.getElementById('chat-input'); const text = input.value.trim(); if (!text) return;
    state.busy = true;
    try {
      if (!state.currentConversationId) await newConversation(true);
      input.value = ''; autoSizeComposer();
      const request = {id: `chat-${Date.now()}-${Math.random().toString(36).slice(2)}`, cancelled: false, phase: 'waiting', displayedText: ''};
      state.activeRequest = request;
      const temporary = {messageId: `temp-${Date.now()}`, role: 'user', text, createdAt: new Date().toISOString()};
      state.currentConversation.messages.push(temporary); setAgentBusy(true); renderMessages({thinking: true});
      const selection = Array.from(state.selectedSources);
      const flowSelection = Array.from(state.selectedFlows);
      const result = await server('sendChatMessage', state.currentProjectId, state.currentConversationId, text, selection, flowSelection, request.id);
      if (request.cancelled) { await syncCurrentConversation(); showToast('Response stopped.'); return; }
      state.currentConversationId = result.conversationId;
      state.currentConversation.messages = state.currentConversation.messages.filter(item => item.messageId !== temporary.messageId);
      state.currentConversation.messages.push(result.userMessage);
      const assistantMessage = Object.assign({}, result.assistantMessage, {text: '', isTyping: true});
      state.currentConversation.messages.push(assistantMessage); state.currentConversation.title = result.title; state.currentConversation.sourceSelection = selection; state.currentConversation.flowSelection = flowSelection;
      state.conversationSelections.set(result.conversationId, selection);
      state.flowSelections.set(result.conversationId, flowSelection);
      const record = state.projectDetails.conversations.find(item => item.conversationId === result.conversationId);
      if (record) { record.title = result.title; record.updatedAt = result.assistantMessage.createdAt; record.messageCount = result.messageCount; }
      else state.projectDetails.conversations.unshift({conversationId: result.conversationId, title: result.title, updatedAt: result.assistantMessage.createdAt, messageCount: result.messageCount, agentId:result.assistantMessage.agentId, agentVersion:result.assistantMessage.agentVersion});
      renderConversationList(); renderMessages(); request.phase = 'typing';
      const completed = await typeAssistantResponse(assistantMessage, result.assistantMessage.text, request);
      assistantMessage.isTyping = false;
      if (!completed) {
        const stoppedText = request.displayedText.trim() || '[Response stopped]'; assistantMessage.text = stoppedText;
        try { await server('truncateAssistantMessage', state.currentProjectId, state.currentConversationId, assistantMessage.messageId, stoppedText); } catch (_) {}
        showToast('Response stopped.');
      }
      renderConversationList(); renderMessages();
    } catch (error) {
      await syncCurrentConversation();
      showToast(state.activeRequest && state.activeRequest.cancelled ? 'Response stopped.' : error.message, !(state.activeRequest && state.activeRequest.cancelled));
    } finally { state.busy = false; state.activeRequest = null; setAgentBusy(false); input.focus(); }
  }

  function stopResponse() {
    const request = state.activeRequest; if (!request || request.cancelled) return;
    request.cancelled = true; renderMessages({thinking: request.phase === 'waiting', stopping: request.phase === 'waiting'});
    if (request.phase === 'waiting') server('cancelChatRequest', request.id).catch(() => {});
  }

  async function typeAssistantResponse(message, fullText, request) {
    const chunks = Math.min(200, Math.max(35, Math.ceil(fullText.length / 18))); const step = Math.max(1, Math.ceil(fullText.length / chunks));
    for (let end = step; end < fullText.length + step; end += step) {
      if (request.cancelled) return false;
      request.displayedText = fullText.slice(0, Math.min(end, fullText.length)); message.text = request.displayedText;
      const body = document.getElementById('message-body-' + message.messageId); if (body) body.innerHTML = formatMarkdown(message.text);
      scrollChatToBottom(); await delay(12);
    }
    message.text = fullText; return true;
  }

  function documentRelationCounts(nodeId) {
    const node = state.documentNodes.find(item => item.nodeId === nodeId);
    return {parents: node ? (node.parentIds || []).length : 0, children: state.documentNodes.filter(item => (item.parentIds || []).includes(nodeId)).length};

  function relatedDocumentIds(nodeId) {
    const related = new Set([nodeId]);
    const visitParents = id => {
      const node = state.documentNodes.find(item => item.nodeId === id);
      (node && node.parentIds || []).forEach(parent => { if (!related.has(parent)) { related.add(parent); visitParents(parent); } });
    };
    const visitChildren = id => state.documentNodes.filter(item => (item.parentIds || []).includes(id)).forEach(child => { if (!related.has(child.nodeId)) { related.add(child.nodeId); visitChildren(child.nodeId); } });
    visitParents(nodeId); visitChildren(nodeId); return related;
  }

      card.classList.toggle('relation-focus', card.dataset.nodeId === nodeId);
      card.classList.toggle('relation-highlight', related.has(card.dataset.nodeId) && card.dataset.nodeId !== nodeId);

  async function uploadSourceFile(event) {
    const input = event.target; const file = input.files[0]; if (!file) return;
    if (file.size > 100 * 1024 * 1024) { input.value = ''; return showToast('Sources can be uploaded up to 100 MB. Split this file into separate volumes.', true); }
    const label = document.querySelector('.file-button'); setBusy(label, true);
    let upload = null;
    try {
      upload = await server('startSourceUpload', state.currentProjectId, {name: file.name, mimeType: file.type || 'application/octet-stream', size: file.size});
      let offset = Number(upload.nextOffset || 0); let completed = null;
      while (offset < file.size) {
        const end = Math.min(file.size, offset + Number(upload.chunkBytes || 2 * 1024 * 1024));
        const base64 = await fileAsBase64(file.slice(offset, end));
        completed = await server('uploadSourceChunk', state.currentProjectId, upload.uploadId, offset, base64);
        offset = Number(completed.nextOffset || end);
        showToast(`Uploading ${file.name}: ${Math.round(offset * 100 / file.size)}%`);
      }
      const source = completed && completed.source;
      if (!source) throw new Error('Drive did not confirm the completed upload.');
      state.projectDetails.sources.push(source);
      await refreshDocumentGraph(); showSideTab('documents');
      const indexed = await continueSingleSourceIndex(source.sourceId, false);
      await refreshDocumentGraph();
      showToast(indexed.indexStatus === 'ready' ? 'Document uploaded and index verified.' : indexed.indexStatus === 'failed' ? 'Document uploaded, but indexing failed. Open its status for details.' : 'Document uploaded; Gemini is processing its index.');
    } catch (error) {
      if (upload && upload.uploadId) { try { await server('cancelSourceUpload', state.currentProjectId, upload.uploadId); } catch (_) {} }
      try { await refreshDocumentGraph(); } catch (_) {}
      showToast(error.message, true);
    }
    finally { input.value = ''; setBusy(label, false); }
  }

  async function syncSourceIndex() {
    const button = document.getElementById('sync-source-index'); setBusy(button, true);
    try {
      let result = null;
      for (let pass = 0; pass < 16; pass++) {
        result = await server('syncProjectKnowledgeIndexes', state.currentProjectId);
        const sources = ((result.project || {}).sources || []).concat((result.agent || {}).sources || []);
        const uploading = sources.filter(item => item.indexStatus === 'uploading');
        if (!uploading.length) break;
        const average = Math.round(uploading.reduce((sum, item) => sum + Number(item.indexProgress || 0), 0) / uploading.length);
        showToast(`Transferring ${uploading.length} source index${uploading.length === 1 ? '' : 'es'}: ${average}%`);
      }
      await refreshDocumentGraph();
      const sources = ((result.project || {}).sources || []).concat((result.agent || {}).sources || []);
      const failed = sources.filter(item => item.indexStatus === 'failed').length;
      const unknown = sources.filter(item => item.indexStatus === 'unknown').length;
      const processed = Number((result.project || {}).processed || 0) + Number((result.agent || {}).processed || 0);
      showToast(failed ? `Index sync completed with ${failed} failed source(s). Project sources show diagnostics; agent knowledge can be repaired from Agents.` : unknown ? `${unknown} source status could not be verified; this does not prove indexing failed.` : result.remaining ? `${processed} source(s) processed; ${result.remaining} remain. Run Sync index again.` : 'Agent knowledge and project sources are indexed.');
    } catch (error) { showToast(error.message, true); }
    finally { setBusy(button, false); }
  }

      const result = await continueSingleSourceIndex(sourceId, restart);
      await refreshDocumentGraph();
      showToast(result.indexStatus === 'ready' ? 'Source index verified.' : result.indexStatus === 'failed' ? 'Indexing failed. Open the red status for the exact cause.' : 'The complete source was accepted and Gemini is processing its index.');
    }
    catch (error) { await refreshDocumentGraph(); showToast(error.message, true); }

    document.getElementById('index-diagnostic-time').textContent = diagnostic.indexedAt ? `Indexed ${formatDateTime(diagnostic.indexedAt)}` : diagnostic.attemptStartedAt ? `Started ${formatDateTime(diagnostic.attemptStartedAt)} · checked ${formatDateTime(diagnostic.updatedAt)}` : diagnostic.updatedAt ? `Checked ${formatDateTime(diagnostic.updatedAt)}` : 'Not checked yet';
    document.getElementById('index-diagnostic-message').textContent = diagnostic.message || '';

  function startPanelResize(event) {
    if (window.innerWidth <= 760) return;
    event.preventDefault(); const workspace = document.getElementById('project-workspace'); const startX = event.clientX;
    const startWidth = document.getElementById('project-side-panel').getBoundingClientRect().width;
    document.body.classList.add('is-resizing'); event.currentTarget.setPointerCapture(event.pointerId);
    const move = moveEvent => setPanelWidth(startWidth + moveEvent.clientX - startX);
    const stop = () => { document.body.classList.remove('is-resizing'); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', stop); try { localStorage.setItem('gpa.projectPanelWidth', workspace.style.getPropertyValue('--project-panel-width')); } catch (_) {} };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', stop);
  }

  function resizePanelWithKeyboard(event) {
    if (!['ArrowLeft','ArrowRight'].includes(event.key)) return; event.preventDefault();
    const width = document.getElementById('project-side-panel').getBoundingClientRect().width + (event.key === 'ArrowRight' ? 20 : -20); setPanelWidth(width);
  }

  function setPanelWidth(width) {
    const max = Math.min(720, window.innerWidth * .58); const value = Math.max(270, Math.min(max, width));
    document.getElementById('project-workspace').style.setProperty('--project-panel-width', `${Math.round(value)}px`);
  }

  function restorePanelWidth() { try { const value = parseInt(localStorage.getItem('gpa.projectPanelWidth'), 10); if (Number.isFinite(value)) setPanelWidth(value); } catch (_) {} }

  function askConfirmation({title, message, action, tone = 'danger'}) {
    if (state.confirmResolver) state.confirmResolver(false);
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-message').textContent = message;
    const confirmAction = document.getElementById('confirm-action');
    confirmAction.textContent = action || 'Continue';
    confirmAction.classList.toggle('danger-filled-btn', tone === 'danger');
    confirmAction.classList.toggle('primary-btn', tone !== 'danger');
    openModal('confirm-modal');
    return new Promise(resolve => { state.confirmResolver = resolve; });
  }

  function resolveConfirmation(value) {
    const resolver = state.confirmResolver; state.confirmResolver = null;
    document.getElementById('modal-backdrop').classList.add('hidden'); document.getElementById('confirm-modal').classList.add('hidden');
    if (resolver) resolver(value);
  }

  function openModal(id) {
    document.querySelectorAll('.modal').forEach(modal => modal.classList.add('hidden'));
    const modal = document.getElementById(id); modal.classList.remove('hidden'); document.getElementById('modal-backdrop').classList.remove('hidden');
    requestAnimationFrame(() => modal.classList.add('modal-visible'));
  }

  function closeModals() {
    if (state.confirmResolver) { const resolver = state.confirmResolver; state.confirmResolver = null; resolver(false); }
    document.getElementById('modal-backdrop').classList.add('hidden');
    document.querySelectorAll('.modal').forEach(modal => { modal.classList.add('hidden'); modal.classList.remove('modal-visible'); });
    state.editingDocumentId = null;
    state.diagnosingSourceId = null;
  }

  function syncDashboardFilters() { document.querySelectorAll('[data-dashboard-filter]').forEach(button => button.classList.toggle('active', button.dataset.dashboardFilter === state.dashboardFilter)); }
  function autoSizeComposer() { const el = document.getElementById('chat-input'); el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; }
  function scrollChatToBottom() { const region = document.getElementById('chat-scroll-region'); requestAnimationFrame(() => { region.scrollTop = region.scrollHeight; }); }
  function setBusy(element, busy) {
    if (!element) return;
    const targets = element.matches && element.matches('form') ? Array.from(element.querySelectorAll('button[type="submit"]')) : [element];
    targets.forEach(target => target.classList.toggle('is-loading', busy));
    Array.from(element.querySelectorAll ? element.querySelectorAll('button,input,textarea,select') : []).forEach(control => control.disabled = busy);
    if ('disabled' in element && !(element.matches && element.matches('form'))) element.disabled = busy;
  }
  function updateProjectCount(key, value) { const project = state.projects.find(item => item.projectId === state.currentProjectId); if (project) project[key] = value; }
  function fileAsBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file); }); }
  function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  function showToast(message, error = false) { const toast = document.getElementById('toast'); toast.textContent = String(message || (error ? 'The operation failed. Check Apps Script execution logs for details.' : 'Done.')); toast.classList.toggle('error', error); toast.classList.remove('hidden'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.add('hidden'), 5200); }
  function clientErrorMessage(error) {
    if (!error) return 'The server returned an empty error. Check Apps Script execution logs.';
    if (typeof error === 'string') return error || 'Unknown server error.';
    if (error.message) return String(error.message);
    if (error.details && error.details.message) return String(error.details.message);
    try { const text = JSON.stringify(error); return text && text !== '{}' ? text : String(error); }
    catch (_) { return String(error); }
  }
  function numberValue(value) { const number = Number(value); return Number.isFinite(number) && number >= 0 ? number : 0; }
  function statusLabel(status) { return ({active:'Ongoing',planning:'Planning',archived:'Archived'})[status] || status; }
  function projectColorStyle(colorKey) { const color = PROJECT_COLORS[colorKey] || PROJECT_COLORS.blue; return `--project-accent:${color.accent};--project-tint:${color.tint};--project-tint-strong:${color.tintStrong};`; }
  function initials(value) { return String(value || 'U').split(/[.\s_-]+/).filter(Boolean).slice(0,2).map(part => part[0].toUpperCase()).join('') || 'U'; }
  function shortEmail(email) { return String(email || '').split('@')[0]; }
  function formatDate(value) { if (!value) return ''; try { return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(value)); } catch (_) { return String(value); } }
  function formatDateTime(value) { if (!value) return ''; try { return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(value)); } catch (_) { return String(value); } }
  function indexStatusLabel(status) { return ({ready:'Indexed and verified',indexing:'Processing embeddings',uploading:'Uploading to File Search',queued:'Queued',failed:'Index failed',unknown:'Status could not be verified',not_indexed:'Not indexed'})[status] || status || 'Not indexed'; }
  function formatFileSize(bytes) { const value = Number(bytes || 0); if (!value) return '—'; const units = ['B','KB','MB','GB']; const index = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1); return `${(value / Math.pow(1024,index)).toFixed(index ? 1 : 0)} ${units[index]}`; }
  function friendlyMime(mime) { const map = {'application/vnd.google-apps.document':'Google Docs','application/vnd.google-apps.spreadsheet':'Google Sheets','application/vnd.google-apps.presentation':'Google Slides','application/pdf':'PDF','text/plain':'Text','text/csv':'CSV','text/markdown':'Markdown'}; return map[mime] || String(mime || 'File').split('/').pop(); }
  function fileTypeIcon(mime) { if (mime === 'application/pdf') return 'PDF'; if (/spreadsheet|csv/.test(mime || '')) return '▦'; if (/presentation/.test(mime || '')) return '▤'; if (/image/.test(mime || '')) return '◩'; if (/document|text|markdown/.test(mime || '')) return '▧'; return '◇'; }
  function fileTypeClass(mime) { if (mime === 'application/pdf') return 'type-pdf'; if (/spreadsheet|csv/.test(mime || '')) return 'type-sheet'; if (/presentation/.test(mime || '')) return 'type-slide'; return 'type-doc'; }
  function scopeLabel(scope) { return ({full:'Full project',sources_documents:'Sources and documents',history:'Chat history only',custom:'Custom'})[scope] || scope; }
  function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[char]); }
  function formatMarkdown(value) {
    let text = escapeHtml(value); const codeBlocks = [];
    text = text.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, code) => { codeBlocks.push(`<pre><code>${code}</code></pre>`); return `@@CODE${codeBlocks.length - 1}@@`; });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/^###\s+(.+)$/gm, '<h3>$1</h3>').replace(/^##\s+(.+)$/gm, '<h2>$1</h2>').replace(/^#\s+(.+)$/gm, '<h1>$1</h1>').replace(/^[-*]\s+(.+)$/gm, '• $1').replace(/\n/g, '<br>');
    codeBlocks.forEach((block, index) => { text = text.replace(`@@CODE${index}@@`, block); }); return text;
  }
</script>
