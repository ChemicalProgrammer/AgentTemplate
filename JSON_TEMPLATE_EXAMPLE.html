<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{project.name}}</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#243047;background:#f5f7fb}
    body{margin:0;padding:32px}.report{max-width:900px;margin:auto;padding:32px;border-radius:24px;background:#fff}
    .eyebrow{color:#52677f;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:8px 0 12px;font-size:34px}.summary{color:#4c5d73;font-size:17px;line-height:1.6}
    .decision{margin-top:24px;padding:20px;border-left:6px solid #3668d5;border-radius:14px;background:#eef4ff}
  </style>
</head>
<body>
  <main class="report">
    <div class="eyebrow">Project decision brief</div>
    <h1>{{project.name}}</h1>
    <p class="summary">{{summary}}</p>
    <section class="decision">
      <strong>Recommendation</strong>
      <p>{{recommendation}}</p>
    </section>
  </main>
</body>
</html>
