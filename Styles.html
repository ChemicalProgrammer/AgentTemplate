<style>
  :root {
    --google-blue: #0b57d0;
    --google-blue-hover: #0842a0;
    --google-blue-soft: #d3e3fd;
    --google-red: #b3261e;
    --google-yellow: #f9ab00;
    --google-green: #188038;
    --ink: #1f1f1f;
    --muted: #5f6368;
    --line: #dfe3e7;
    --line-strong: #c7ccd1;
    --page: #f6f8fc;
    --surface: #fbfcff;
    --surface-raised: #ffffff;
    --surface-container-low: #f1f4f9;
    --surface-container: #e9eef6;
    --surface-container-high: #e1e7ef;
    --danger-soft: #f9dedc;
    --shadow-sm: 0 1px 2px rgba(60,64,67,.11), 0 1px 3px rgba(60,64,67,.08);
    --shadow-md: 0 8px 28px rgba(60,64,67,.16);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --motion-standard: cubic-bezier(.2,0,0,1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); background: var(--page); font: 14px/1.45 Arial, Helvetica, sans-serif; overflow: hidden; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  a { color: var(--google-blue); text-decoration: none; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .eyebrow { margin: 0 0 5px; color: var(--google-blue); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .google-spark, .gemini-mark { color: #7b61ff; background: linear-gradient(135deg,#1a73e8,#9b72cb,#d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .google-spark { font-size: 22px; }
  .gemini-mark { font-size: 30px; }
  .gemini-mark.large { font-size: 48px; }
  .google-plus { color: var(--google-blue); font-size: 24px; }

  .boot-loader { height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; background: var(--page); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--google-blue-soft); border-top-color: var(--google-blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .setup-screen { height: 100%; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 0,#dbe8fd 0,transparent 35%),var(--page); overflow: auto; }
  .setup-card { width: min(560px,100%); padding: 42px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow-md); }
  .setup-card h1 { margin: 12px 0 6px; font-size: 28px; }

  .app-shell { height: 100%; display: grid; grid-template: 64px minmax(0,1fr) / minmax(0,1fr); background: var(--page); }
  .app-shell.project-mode { grid-template: minmax(0,1fr) / minmax(0,1fr); }
  .app-shell.project-mode .topbar, .app-shell.project-mode .dashboard-only { display: none !important; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 22px; background: rgba(248,250,253,.94); border-bottom: 1px solid #e8eaed; backdrop-filter: blur(12px); z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .domain-label { color: var(--muted); font-size: 11px; }
  .global-search { flex: 1; max-width: 720px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border: 1px solid transparent; border-radius: 24px; background: var(--surface-container); transition: background .2s,border-color .2s,box-shadow .2s; }
  .global-search:focus-within { border-color: #c7d7f0; background: var(--surface-raised); box-shadow: var(--shadow-sm); }
  .global-search input { width: 100%; height: 44px; border: 0; outline: 0; background: transparent; }
  .icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; flex: 0 0 auto; border: 0; border-radius: 50%; background: transparent; color: #444746; font-size: 19px; transition: background .18s var(--motion-standard),transform .18s var(--motion-standard); }
  .icon-btn:hover { background: var(--surface-container); }
  .icon-btn:active { transform: scale(.94); }
  .avatar { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: #fff; background: var(--google-green); font-weight: 700; }
  .mobile-only { display: none; }

  .sidebar { min-height: 0; display: flex; flex-direction: column; padding: 18px 12px; background: var(--surface-container-low); overflow: auto; }
  .new-btn { display: flex; align-items: center; gap: 10px; padding: 14px 20px; margin: 0 4px 22px; border: 1px solid transparent; border-radius: 16px; background: var(--surface-raised); box-shadow: var(--shadow-sm); font-weight: 600; transition: box-shadow .2s,transform .2s; }
  .new-btn:hover { box-shadow: 0 4px 10px rgba(60,64,67,.15); transform: translateY(-1px); }
  .sidebar nav { display: grid; gap: 3px; }
  .nav-item { display: flex; gap: 14px; align-items: center; padding: 11px 18px; border: 0; border-radius: 22px; background: transparent; text-align: left; color: #3c4043; transition: background .18s,color .18s; }
  .nav-item:hover { background: var(--surface-container); }
  .nav-item.active { background: var(--google-blue-soft); color: #041e49; font-weight: 700; }
  .nav-item[data-dashboard-filter="active"] span { color: var(--google-green); }
  .nav-item[data-dashboard-filter="favorite"] span { color: #d99b00; }
  .nav-item[data-dashboard-filter="archived"] span { color: var(--google-red); }
  .sidebar-footer { margin-top: auto; padding: 16px 12px 4px; color: var(--muted); }
  .key-status { margin-bottom: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.7); font-size: 12px; }
  .key-status.ready { color: #137333; background: #dff3e4; }
  .topbar-key-status { max-width: 300px; overflow: hidden; margin: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-container-low); color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .topbar-key-status.ready { border-color: #cde7d3; }

  .main-content { min-width: 0; min-height: 0; overflow: auto; background: var(--page); }
  .project-mode .main-content { grid-area: 1 / 1; overflow: hidden; }
  .view { min-height: 100%; padding: 32px clamp(22px,4vw,64px) 60px; }
  .view-entering { animation: viewEnter .34s var(--motion-standard) both; }
  @keyframes viewEnter { from { opacity: 0; transform: translateY(7px) scale(.997); } to { opacity: 1; transform: none; } }
  .dashboard-view { background: radial-gradient(circle at 10% -10%,rgba(211,227,253,.55),transparent 30%),linear-gradient(145deg,#f8fafe,#f2f5fa); }
  .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .page-heading h1, .dashboard-intro h1 { margin: 0; font-size: 30px; font-weight: 500; }
  .page-heading p, .dashboard-intro p { margin-top: 5px; }
  .heading-actions, .project-actions, .toolbar-actions, .modal-actions { display: flex; gap: 10px; align-items: center; }
  select, input, textarea { width: 100%; color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-raised); outline: none; }
  input, select { height: 42px; padding: 0 12px; }
  textarea { padding: 11px 12px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--google-blue); box-shadow: 0 0 0 2px rgba(26,115,232,.12); }
  label { display: grid; gap: 7px; margin: 18px 0; font-weight: 600; }
  .optional { color: var(--muted); font-weight: 400; }
  .form-note { margin: 4px 0 0; padding: 11px 13px; border-radius: var(--radius-sm); color: var(--muted); background: var(--surface-container-low); font-size: 12px; }
  .primary-btn, .secondary-btn, .danger-filled-btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 18px; border-radius: 20px; font-weight: 600; white-space: nowrap; transition: background .18s,box-shadow .18s,transform .18s; }
  .primary-btn { color: #fff; border: 1px solid var(--google-blue); background: var(--google-blue); }
  .primary-btn:hover { background: var(--google-blue-hover); box-shadow: var(--shadow-sm); }
  .secondary-btn { color: var(--google-blue); border: 1px solid var(--line-strong); background: rgba(255,255,255,.8); }
  .secondary-btn:hover { background: #eaf2ff; }
  .danger-filled-btn { color: #fff; border: 1px solid var(--google-red); background: var(--google-red); }
  .danger-filled-btn:hover { background: #8c1d18; }
  .compact-btn { min-height: 36px; padding: 0 14px; border-radius: 18px; }
  .text-btn { padding: 4px 7px; color: var(--google-blue); border: 0; background: transparent; }
  .wide { width: 100%; }

  .dashboard-header { position: sticky; top: -32px; z-index: 8; display: grid; grid-template-columns: minmax(210px,340px) minmax(520px,1fr); align-items: center; gap: 24px; padding: 16px 18px; border: 1px solid rgba(223,227,231,.9); border-radius: 22px; background: rgba(248,250,253,.92); box-shadow: 0 5px 18px rgba(60,64,67,.07); backdrop-filter: blur(14px); }
  .dashboard-intro { min-width: 0; }
  .dashboard-intro .eyebrow { margin-bottom: 2px; }
  .dashboard-intro .muted { max-width: 320px; margin-bottom: 0; font-size: 11px; }
  .dashboard-command-bar { min-width: 0; display: grid; gap: 10px; }
  .dashboard-primary-controls { min-width: 0; display: grid; grid-template-columns: minmax(220px,1fr) auto auto; align-items: center; gap: 8px; }
  .dashboard-search { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 15px; border: 1px solid transparent; border-radius: 24px; background: var(--surface-container); transition: background .2s,border-color .2s,box-shadow .2s; }
  .dashboard-search:focus-within { border-color: #a8c7fa; background: var(--surface-raised); box-shadow: var(--shadow-sm); }
  .dashboard-search > span { color: var(--muted); font-size: 21px; }
  .dashboard-search input { height: 44px; padding: 0; border: 0; background: transparent; box-shadow: none; }
  .command-icon-btn { border: 1px solid var(--line); background: rgba(255,255,255,.72); }
  .filter-chips { display: flex; justify-content: flex-end; gap: 7px; overflow-x: auto; padding: 1px 1px 0; scrollbar-width: none; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip { min-height: 34px; display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; padding: 0 13px; color: #444746; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.64); font-size: 12px; font-weight: 600; transition: color .18s,background .18s,border-color .18s,transform .18s; }
  .filter-chip:hover { background: var(--surface-raised); border-color: #b8c4d3; transform: translateY(-1px); }
  .filter-chip.active { color: #041e49; border-color: transparent; background: var(--google-blue-soft); }
  .filter-chip [class$="-dot"] { width: 7px; height: 7px; border-radius: 50%; }
  .ongoing-dot { background: var(--google-green); }
  .planning-dot { background: var(--google-yellow); }
  .archived-dot { background: #7a8087; }

  .project-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(290px,1fr)); gap: 18px; margin-top: 24px; }
  .project-card { position: relative; min-height: 238px; display: flex; flex-direction: column; overflow: visible; padding: 19px; border: 1px solid color-mix(in srgb,var(--project-accent) 18%,var(--line)); border-radius: 18px; background: linear-gradient(155deg,var(--project-tint),rgba(255,255,255,.9) 56%); box-shadow: 0 1px 2px rgba(60,64,67,.05); transition: box-shadow .22s var(--motion-standard),transform .22s var(--motion-standard),border-color .22s; cursor: pointer; animation: cardEnter .35s var(--motion-standard) both; animation-delay: calc(var(--card-index) * 28ms); }
  .project-card-accent { position: absolute; top: 0; left: 22px; right: 22px; height: 3px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg,var(--project-accent),color-mix(in srgb,var(--project-accent) 42%,white)); opacity: .72; }
  @keyframes cardEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .project-card:hover, .project-card:focus-visible { transform: translateY(-4px); border-color: color-mix(in srgb,var(--project-accent) 42%,var(--line)); box-shadow: 0 10px 26px rgba(60,64,67,.13); outline: none; }
  .project-card:has(.project-card-menu:not(.hidden)) { z-index: 40; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; }
  .project-emoji { width: 46px; height: 46px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 15px; background: var(--project-tint-strong,var(--surface-container)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); font-size: 25px; }
  .project-card-controls { display: flex; align-items: center; gap: 1px; }
  .favorite-btn { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: #8b9298; font-size: 18px; }
  .favorite-btn:hover { background: var(--surface-container); }
  .favorite-btn.on { color: #d99b00; }
  .project-card-menu-wrap { position: relative; }
  .project-card-menu-button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 20px; }
  .project-card-menu-button:hover { background: rgba(255,255,255,.72); }
  .project-card-menu { position: absolute; top: 37px; right: 0; z-index: 35; width: 190px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-raised); box-shadow: var(--shadow-md); animation: menuEnter .16s var(--motion-standard); }
  .project-card-menu > button { width: 100%; min-height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: var(--ink); border: 0; border-radius: 8px; background: transparent; text-align: left; }
  .project-card-menu > button:hover { background: var(--surface-container-low); }
  .project-card-menu .danger-menu-item { color: var(--google-red); }
  .project-card h3 { margin: 14px 0 4px; font-size: 17px; }
  .project-card .description { display: -webkit-box; overflow: hidden; margin: 0; color: var(--muted); -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .card-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 16px; color: var(--muted); font-size: 12px; }
  .card-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 11px; padding-top: 11px; border-top: 1px solid color-mix(in srgb,var(--project-accent) 13%,#e8eaed); color: var(--muted); font-size: 11px; }
  .card-stats span { display: grid; gap: 1px; }
  .card-stats b { color: var(--ink); font-size: 14px; }
  .card-owner { margin-top: 8px; color: var(--muted); font-size: 11px; }
  .status-pill { display: inline-flex; width: fit-content; padding: 3px 8px; color: #137333; border-radius: 10px; background: #dff3e4; font-size: 11px; text-transform: capitalize; }
  .status-pill.archived { color: #5f6368; background: #e9ecef; }
  .status-pill.planning { color: #9a6700; background: #fff1bf; }
  .empty-state { display: grid; place-items: center; padding: 100px 20px; text-align: center; }
  .empty-icon { font-size: 48px; color: #8ab4f8; }

  .project-view { --project-accent:#0b57d0;--project-tint:#e8f0fe;--project-tint-strong:#d3e3fd; height: 100%; min-height: 0; padding: 0; display: flex; flex-direction: column; background: var(--surface); }
  .project-header { min-height: 62px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 16px; background: linear-gradient(90deg,var(--project-tint),rgba(250,251,255,.97) 36%); border-bottom: 1px solid color-mix(in srgb,var(--project-accent) 18%,var(--line)); box-shadow: 0 1px 2px rgba(60,64,67,.04); z-index: 12; }
  .project-identity { min-width: 0; display: flex; align-items: center; gap: 9px; }
  .project-panel-toggle { display: none; }
  .project-emoji-button { width: 40px; height: 40px; border: 0; transition: transform .18s,background .18s; }
  .project-emoji-button:hover { transform: scale(1.06) rotate(-2deg); background: var(--project-tint-strong); }
  .project-title-wrap { min-width: 0; }
  .project-title-wrap h1 { max-width: min(46vw,680px); overflow: hidden; margin: 0; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-weight: 600; }
  .project-title-wrap p { max-width: min(46vw,680px); overflow: hidden; margin: 1px 0 0; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  .action-icon { border: 1px solid transparent; }

  .project-workspace { --project-panel-width: 326px; position: relative; min-height: 0; flex: 1; display: grid; grid-template-columns: var(--project-panel-width) 8px minmax(0,1fr); overflow: hidden; background: var(--surface); }
  .project-side-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface-container-low); border-right: 1px solid rgba(199,204,209,.5); overflow: hidden; }
  .side-tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
  .side-tab { position: relative; min-width: 0; min-height: 38px; padding: 0 4px; overflow: hidden; border: 0; border-radius: 10px 10px 0 0; background: transparent; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 10px; font-weight: 600; }
  .side-tab:hover { background: rgba(211,227,253,.48); }
  .side-tab::after { content: ''; position: absolute; left: 50%; right: 50%; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--google-blue); transition: left .24s var(--motion-standard),right .24s var(--motion-standard); }
  .side-tab.active { color: var(--google-blue); }
  .side-tab.active::after { left: 22%; right: 22%; }
  .side-panel-content { min-height: 0; flex: 1; padding: 12px 14px 22px; overflow-x: hidden; overflow-y: auto; scroll-padding: 16px; scrollbar-gutter: stable; opacity: 0; transform: translateX(-6px); }
  .side-panel-content.active { opacity: 1; transform: none; animation: panelEnter .26s var(--motion-standard); }
  @keyframes panelEnter { from { opacity: 0; transform: translateX(-7px); } to { opacity: 1; transform: none; } }
  .panel-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 3px 10px; }
  .panel-toolbar h2 { margin: 0; font-size: 17px; }
  .panel-toolbar p { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
  .tonal-icon-btn { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; margin: 0; padding: 0; color: #174ea6; border: 0; border-radius: 12px; background: var(--google-blue-soft); font-size: 20px; transition: transform .18s,background .18s; }
  .tonal-icon-btn:hover { background: #c2d7f8; transform: translateY(-1px); }
  .compact-actions { gap: 6px; }
  .file-button input, .flow-file-button input { display: none; }
  .panel-help { margin: -3px 3px 10px; color: var(--muted); font-size: 11px; }

  .conversation-list { display: grid; gap: 4px; }
  .conversation-item { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; border-radius: 12px; transition: background .16s,transform .16s; }
  .conversation-item:hover { background: var(--surface-container); }
  .conversation-item.active { background: var(--google-blue-soft); }
  .conversation-open { min-width: 0; padding: 10px 8px 10px 11px; border: 0; background: transparent; text-align: left; }
  .conversation-open strong, .conversation-open small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conversation-open strong { font-size: 13px; }
  .conversation-open small { margin-top: 3px; color: var(--muted); font-size: 10px; }
  .conversation-actions { display: flex; align-items: center; margin-right: 4px; }
  .conversation-delete, .conversation-export { width: 29px; height: 29px; border: 0; border-radius: 50%; background: transparent; opacity: 0; color: var(--muted); font-size: 12px; transition: opacity .16s,background .16s,color .16s; }
  .conversation-item:hover .conversation-delete, .conversation-item:focus-within .conversation-delete, .conversation-item:hover .conversation-export, .conversation-item:focus-within .conversation-export { opacity: 1; }
  .conversation-export:hover { color: var(--google-blue); background: var(--google-blue-soft); }
  .conversation-delete:hover { background: var(--danger-soft); }
  .panel-empty { display: grid; justify-items: center; padding: 56px 20px; color: var(--muted); text-align: center; }
  .panel-empty > span { margin-bottom: 8px; font-size: 28px; }
  .panel-empty strong { color: var(--ink); }
  .panel-empty p { max-width: 210px; margin: 4px 0; font-size: 11px; }

  .panel-grip { position: relative; width: 8px; height: 100%; padding: 0; border: 0; background: var(--surface-container-low); cursor: col-resize; touch-action: none; z-index: 5; }
  .panel-grip::before { content: ''; position: absolute; inset: 0 2px; border-radius: 4px; background: transparent; transition: background .2s; }
  .panel-grip:hover::before, .panel-grip:focus-visible::before, .is-resizing .panel-grip::before { background: #a8c7fa; }
  .panel-grip span { position: absolute; top: 50%; left: 2px; width: 4px; height: 28px; transform: translateY(-50%); border-radius: 4px; background: #c8cdd3; }
  .is-resizing { cursor: col-resize !important; user-select: none; }

  .document-levels { display: grid; gap: 13px; padding: 4px 3px 18px; }
  .document-level { position: relative; }
  .document-level + .document-level::before { content: ''; position: absolute; left: 25px; top: -14px; width: 1px; height: 14px; background: #b7c5d8; }
  .level-heading { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 4px; background: var(--surface-container-low); }
  .level-heading small { min-width: 22px; padding: 2px 6px; border-radius: 10px; color: var(--muted); background: var(--surface-container); text-align: center; }
  .level-select { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  .level-select input { width: 16px; height: 16px; margin: 0; accent-color: var(--google-blue); }
