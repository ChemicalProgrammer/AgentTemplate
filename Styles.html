<style>
  :root {
    --google-blue: #0b57d0;
    --google-blue-hover: #0842a0;
    --google-blue-soft: #d3e3fd;
    --google-red: #b3261e;
    --google-yellow: #f9ab00;
    --google-green: #188038;
    --ink: #1f1f1f;
    --muted: #5f6368;
    --line: #dfe3e7;
    --line-strong: #c7ccd1;
    --page: #f6f8fc;
    --surface: #fbfcff;
    --surface-raised: #ffffff;
    --surface-container-low: #f1f4f9;
    --surface-container: #e9eef6;
    --surface-container-high: #e1e7ef;
    --danger-soft: #f9dedc;
    --shadow-sm: 0 1px 2px rgba(60,64,67,.11), 0 1px 3px rgba(60,64,67,.08);
    --shadow-md: 0 8px 28px rgba(60,64,67,.16);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --motion-standard: cubic-bezier(.2,0,0,1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); background: var(--page); font:var(--type-body)/var(--line-height-body) var(--font-family-body); overflow: hidden; }
  button, input, textarea, select { font: inherit; }
  h1, h2, h3, h4, h5, h6,
  .brand {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-bold);
  }
  h1, h2, h3, h4, h5, h6 { line-height: var(--line-height-tight); }

  /* Distinctive display type for card names and workspace header titles. */
  .console-path-card .path-copy strong,
  .entity-card-copy h3,
  .agent-resource-item .resource-copy strong,
  .document-card-copy strong,
  .asset-card strong,
  .conversation-open strong,
  .artifact-event-heading strong,
  .release-row > strong,
  .project-title-wrap h1,
  .side-panel-heading strong,
  .chat-context-copy strong,
  .document-viewer-header strong,
  .agent-editor-identity h1,
  .catalog-title-block h1 {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-bold);
  }
  .chat-messages,
  .message-body,
  .composer textarea,
  .document-viewer-content,
  .modal input,
  .modal textarea,
  .modal select {
    font-family: var(--font-family-body);
  }
  button { cursor: pointer; }
  button { transition: transform .14s ease,box-shadow .14s ease,filter .14s ease,opacity .14s ease; }
  button:active:not(:disabled) { transform: scale(.975); }
  button:disabled { cursor: default; }
  a { color: var(--google-blue); text-decoration: none; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .eyebrow { margin: 0 0 5px; color: var(--google-blue); font-size: var(--font-size-11); font-weight: 700; letter-spacing: .12em; }
  .google-spark, .gemini-mark { color: #7b61ff; background: linear-gradient(135deg,#1a73e8,#9b72cb,#d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .google-spark { font-size: var(--font-size-22); }
  .gemini-mark { font-size: var(--font-size-30); }
  .gemini-mark.large { font-size: var(--font-size-48); }
  .google-plus { color: var(--google-blue); font-size: var(--font-size-24); }

  .boot-loader { position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;overflow:hidden;background:radial-gradient(circle at 18% 8%,rgba(66,133,244,.16),transparent 31%),radial-gradient(circle at 88% 86%,rgba(217,101,112,.12),transparent 29%),linear-gradient(145deg,#f8faff,#f2f5fb);opacity:1;visibility:visible;transition:opacity .22s ease,visibility 0s linear 0s; }
  .boot-loader.is-complete { opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s; }
  .boot-ambient { position:absolute;border-radius:50%;pointer-events:none;filter:blur(.2px);animation:bootFloat 7s ease-in-out infinite alternate; }
  .boot-ambient-one { top:-150px;right:10%;width:380px;height:380px;border:1px solid rgba(112,72,232,.1);background:rgba(112,72,232,.035); }
  .boot-ambient-two { bottom:-190px;left:7%;width:430px;height:430px;border:1px solid rgba(26,115,232,.08);background:rgba(26,115,232,.025);animation-delay:-2.8s; }
  .boot-card { position:relative;width:min(540px,100%);display:grid;justify-items:center;padding:58px 52px 46px;overflow:hidden;border:1px solid rgba(220,225,234,.9);border-radius:32px;background:radial-gradient(circle at 50% -20%,rgba(123,97,255,.11),transparent 44%),rgba(255,255,255,.88);box-shadow:0 24px 70px rgba(55,64,84,.13);text-align:center;backdrop-filter:blur(18px);transition:transform .22s var(--motion-standard),box-shadow .22s; }
  .boot-loader.is-complete .boot-card { transform:translateY(-5px) scale(.993); }
  .boot-progress { position:absolute;top:0;left:0;right:0;height:4px;overflow:hidden;background:#e5e9f1; }
  .boot-progress span { position:absolute;inset:0;width:42%;border-radius:0 4px 4px 0;background:linear-gradient(90deg,#1a73e8,#7048e8 55%,#d96570,#f9ab00);box-shadow:0 0 14px rgba(112,72,232,.35);animation:bootProgress 1.55s var(--motion-standard) infinite; }
  .boot-logo { position:relative;width:78px;height:78px;display:grid;place-items:center;margin-bottom:22px;border-radius:25px;color:#fff;background:linear-gradient(145deg,#1a73e8,#7048e8 54%,#d96570);box-shadow:0 15px 34px rgba(94,75,219,.25);font-size:var(--font-size-38); }
  .boot-logo span { position:relative;z-index:1;animation:bootSpark 2.2s ease-in-out infinite; }
  .boot-logo i { position:absolute;inset:-9px;border:1px solid rgba(112,72,232,.18);border-radius:30px;animation:bootHalo 2.2s ease-out infinite; }
  .boot-kicker { margin:0 0 7px;color:#514093;font-size:var(--font-size-10);font-weight:850;letter-spacing:.2em;text-transform:uppercase; }
  .boot-card h1 { margin:0;font-size:clamp(var(--font-size-27),4vw,var(--font-size-36));font-weight:680;letter-spacing:-.035em; }
  .boot-card>p#boot-status { margin:11px 0 0;color:#455468;font-size:var(--font-size-14); }
  .boot-stage-dots { display:flex;gap:7px;margin:23px 0 16px; }
  .boot-stage-dots i { width:7px;height:7px;border-radius:50%;background:#7b61ff;animation:bootDot 1.15s ease-in-out infinite; }
  .boot-stage-dots i:nth-child(2) { animation-delay:.14s;background:#d96570; }
  .boot-stage-dots i:nth-child(3) { animation-delay:.28s;background:#f9ab00; }
  .boot-detail { max-width:420px;margin:0;color:#7a8492;font-size:var(--font-size-10);line-height:1.55;overflow-wrap:anywhere; }
  .boot-error-actions { margin-top:24px; }
  .boot-retry { min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 20px;border:0;border-radius:22px;color:#fff;background:linear-gradient(135deg,#1967d2,#7048e8);box-shadow:0 8px 18px rgba(66,87,190,.23);font-weight:750; }
  .boot-retry:hover { filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 11px 23px rgba(66,87,190,.28); }
  .boot-loader.is-error .boot-progress span { width:100%;background:linear-gradient(90deg,#b3261e,#d96570);animation:none; }
  .boot-loader.is-error .boot-logo { background:linear-gradient(145deg,#a50e0e,#d96570);box-shadow:0 15px 34px rgba(179,38,30,.2); }
  .boot-loader.is-error .boot-logo i,.boot-loader.is-error .boot-stage-dots { display:none; }
  .boot-loader.is-error .boot-card>p#boot-status { color:#8f2d28; }
  .boot-loader.is-error .boot-detail { max-width:460px;color:#6f4542; }
  @keyframes bootProgress { from{transform:translateX(-115%)} to{transform:translateX(250%)} }
  @keyframes bootSpark { 0%,100%{transform:scale(.92);opacity:.84} 50%{transform:scale(1.08);opacity:1} }
  @keyframes bootHalo { 0%{transform:scale(.84);opacity:0} 45%{opacity:.7} 100%{transform:scale(1.2);opacity:0} }
  @keyframes bootDot { 0%,100%{transform:translateY(0);opacity:.38} 50%{transform:translateY(-4px);opacity:1} }
  @keyframes bootFloat { from{transform:translate3d(-8px,-7px,0)} to{transform:translate3d(10px,12px,0)} }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--google-blue-soft); border-top-color: var(--google-blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .setup-screen { height: 100%; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 0,#dbe8fd 0,transparent 35%),var(--page); overflow: auto; }
  .setup-card { width: min(560px,100%); padding: 42px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow-md); }
  .setup-card h1 { margin: 12px 0 6px; font-size: var(--font-size-28); }

  .app-shell { height: 100%; display: grid; grid-template: 64px minmax(0,1fr) / minmax(0,1fr); background: var(--page); }
  .app-shell.project-mode { grid-template: minmax(0,1fr) / minmax(0,1fr); }
  .app-shell.project-mode .topbar, .app-shell.project-mode .dashboard-only { display: none !important; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 22px; background: rgba(248,250,253,.94); border-bottom: 1px solid #e8eaed; backdrop-filter: blur(12px); z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: var(--font-size-17); white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .domain-label { color: var(--muted); font-size: var(--font-size-11); }
  .global-search { flex: 1; max-width: 720px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border: 1px solid transparent; border-radius: 24px; background: var(--surface-container); transition: background .2s,border-color .2s,box-shadow .2s; }
  .global-search:focus-within { border-color: #c7d7f0; background: var(--surface-raised); box-shadow: var(--shadow-sm); }
  .global-search input { width: 100%; height: 44px; border: 0; outline: 0; background: transparent; }
  .icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; flex: 0 0 auto; border: 0; border-radius: 50%; background: transparent; color: #444746; font-size: var(--font-size-19); transition: background .18s var(--motion-standard),transform .18s var(--motion-standard); }
  .icon-btn:hover { background: var(--surface-container); }
  .icon-btn:active { transform: scale(.94); }
  .avatar { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: #fff; background: var(--google-green); font-weight: 700; }
  .mobile-only { display: none; }

  .sidebar { min-height: 0; display: flex; flex-direction: column; padding: 18px 12px; background: var(--surface-container-low); overflow: auto; }
  .new-btn { display: flex; align-items: center; gap: 10px; padding: 14px 20px; margin: 0 4px 22px; border: 1px solid transparent; border-radius: 16px; background: var(--surface-raised); box-shadow: var(--shadow-sm); font-weight: 600; transition: box-shadow .2s,transform .2s; }
  .new-btn:hover { box-shadow: 0 4px 10px rgba(60,64,67,.15); transform: translateY(-1px); }
  .sidebar nav { display: grid; gap: 3px; }
  .nav-item { display: flex; gap: 14px; align-items: center; padding: 11px 18px; border: 0; border-radius: 22px; background: transparent; text-align: left; color: #3c4043; transition: background .18s,color .18s; }
  .nav-item:hover { background: var(--surface-container); }
  .nav-item.active { background: var(--google-blue-soft); color: #041e49; font-weight: 700; }
  .nav-item[data-dashboard-filter="active"] span { color: var(--google-green); }
  .nav-item[data-dashboard-filter="favorite"] span { color: #d99b00; }
  .nav-item[data-dashboard-filter="archived"] span { color: var(--google-red); }
  .sidebar-footer { margin-top: auto; padding: 16px 12px 4px; color: var(--muted); }
  .key-status { margin-bottom: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.7); font-size: var(--font-size-12); }
  .key-status.ready { color: #137333; background: #dff3e4; }
  .topbar-key-status { max-width: 300px; overflow: hidden; margin: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-container-low); color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: var(--font-size-10); }
  .topbar-key-status.ready { border-color: #cde7d3; }

  .main-content { min-width: 0; min-height: 0; overflow: auto; background: var(--page); }
  .project-mode .main-content { grid-area: 1 / 1; overflow: hidden; }
  .view { min-height: 100%; padding: 32px clamp(22px,4vw,64px) 60px; }
  .view-entering { animation: viewEnter .34s var(--motion-standard) both; }
  @keyframes viewEnter { from { opacity: 0; transform: translateY(7px) scale(.997); } to { opacity: 1; transform: none; } }
  .dashboard-view { background: radial-gradient(circle at 10% -10%,rgba(211,227,253,.55),transparent 30%),linear-gradient(145deg,#f8fafe,#f2f5fa); }
  .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .page-heading h1, .dashboard-intro h1 { margin: 0; font-size: var(--font-size-30); font-weight: 500; }
  .page-heading p, .dashboard-intro p { margin-top: 5px; }
  .heading-actions, .project-actions, .toolbar-actions, .modal-actions { display: flex; gap: 10px; align-items: center; }
  select, input, textarea { width: 100%; color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-raised); outline: none; }
  input, select { height: 42px; padding: 0 12px; }
  textarea { padding: 11px 12px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--google-blue); box-shadow: 0 0 0 2px rgba(26,115,232,.12); }
  label { display: grid; gap: 7px; margin: 18px 0; font-weight: 600; }
  .optional { color: var(--muted); font-weight: 400; }
  .form-note { margin: 4px 0 0; padding: 11px 13px; border-radius: var(--radius-sm); color: var(--muted); background: var(--surface-container-low); font-size: var(--font-size-12); }
  .primary-btn, .secondary-btn, .danger-filled-btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 18px; border-radius: 20px; font-weight: 600; white-space: nowrap; transition: background .18s,box-shadow .18s,transform .18s; }
  .primary-btn { position: relative; overflow: hidden; color: #fff; border: 0; background: linear-gradient(135deg,#1967d2,#4285f4); box-shadow: 0 4px 11px rgba(26,115,232,.15); }
  .primary-btn:hover { filter: brightness(1.04); box-shadow: 0 6px 14px rgba(26,115,232,.22); transform: translateY(-1px); }
  .secondary-btn { color: var(--google-blue); border: 1px solid var(--line-strong); background: rgba(255,255,255,.8); }
  .secondary-btn:hover { background: #eaf2ff; }
  .danger-filled-btn { color: #fff; border: 1px solid var(--google-red); background: var(--google-red); }
  .danger-filled-btn:hover { background: #8c1d18; }
  .btn-gemini { background: linear-gradient(120deg,#356ae6,#7048e8 55%,#a142f4); box-shadow: 0 5px 13px rgba(91,79,233,.2); }
  .btn-style { background: linear-gradient(135deg,#1967d2,#4f46e5); }
  .btn-expand { background: linear-gradient(135deg,#148565,#2aaa7e); box-shadow: 0 5px 13px rgba(20,133,101,.16); }
  .compact-btn { min-height: 36px; padding: 0 14px; border-radius: 18px; }
  .text-btn { padding: 4px 7px; color: var(--google-blue); border: 0; background: transparent; }
  .wide { width: 100%; }

  .dashboard-header { position: sticky; top: -32px; z-index: 8; display: grid; grid-template-columns: minmax(210px,340px) minmax(520px,1fr); align-items: center; gap: 24px; padding: 16px 18px; border: 1px solid rgba(223,227,231,.9); border-radius: 22px; background: rgba(248,250,253,.92); box-shadow: 0 5px 18px rgba(60,64,67,.07); backdrop-filter: blur(14px); }
  .dashboard-intro { min-width: 0; }
  .dashboard-intro .eyebrow { margin-bottom: 2px; }
  .dashboard-intro .muted { max-width: 320px; margin-bottom: 0; font-size: var(--font-size-11); }
  .dashboard-command-bar { min-width: 0; display: grid; gap: 10px; }
  .dashboard-primary-controls { min-width: 0; display: grid; grid-template-columns: minmax(220px,1fr) auto auto; align-items: center; gap: 8px; }
  .dashboard-search { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 15px; border: 1px solid transparent; border-radius: 24px; background: var(--surface-container); transition: background .2s,border-color .2s,box-shadow .2s; }
  .dashboard-search:focus-within { border-color: #a8c7fa; background: var(--surface-raised); box-shadow: var(--shadow-sm); }
  .dashboard-search > span { color: var(--muted); font-size: var(--font-size-21); }
  .dashboard-search input { height: 44px; padding: 0; border: 0; background: transparent; box-shadow: none; }
  .command-icon-btn { border: 1px solid var(--line); background: rgba(255,255,255,.72); }
  .filter-chips { display: flex; justify-content: flex-end; gap: 7px; overflow-x: auto; padding: 1px 1px 0; scrollbar-width: none; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip { min-height: 34px; display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; padding: 0 13px; color: #444746; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.64); font-size: var(--font-size-12); font-weight: 600; transition: color .18s,background .18s,border-color .18s,transform .18s; }
  .filter-chip:hover { background: var(--surface-raised); border-color: #b8c4d3; transform: translateY(-1px); }
  .filter-chip.active { color: #041e49; border-color: transparent; background: var(--google-blue-soft); }
  .filter-chip [class$="-dot"] { width: 7px; height: 7px; border-radius: 50%; }
  .ongoing-dot { background: var(--google-green); }
  .planning-dot { background: var(--google-yellow); }
  .archived-dot { background: #7a8087; }

  .project-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(290px,1fr)); gap: 18px; margin-top: 24px; }
  .project-card { position: relative; min-height: 238px; display: flex; flex-direction: column; overflow: visible; padding: 19px; border: 1px solid color-mix(in srgb,var(--project-accent) 18%,var(--line)); border-radius: 18px; background: linear-gradient(155deg,var(--project-tint),rgba(255,255,255,.9) 56%); box-shadow: 0 1px 2px rgba(60,64,67,.05); transition: box-shadow .22s var(--motion-standard),transform .22s var(--motion-standard),border-color .22s; cursor: pointer; animation: cardEnter .35s var(--motion-standard) both; animation-delay: calc(var(--card-index) * 28ms); }
  .project-card-accent { position: absolute; top: 0; left: 22px; right: 22px; height: 3px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg,var(--project-accent),color-mix(in srgb,var(--project-accent) 42%,white)); opacity: .72; }
  @keyframes cardEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .project-card:hover, .project-card:focus-visible { transform: translateY(-4px); border-color: color-mix(in srgb,var(--project-accent) 42%,var(--line)); box-shadow: 0 10px 26px rgba(60,64,67,.13); outline: none; }
  .project-card:has(.project-card-menu:not(.hidden)) { z-index: 40; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; }
  .project-emoji { width: 46px; height: 46px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 15px; background: var(--project-tint-strong,var(--surface-container)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); font-size: var(--font-size-25); }
  .project-card-controls { display: flex; align-items: center; gap: 1px; }
  .favorite-btn { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: #8b9298; font-size: var(--font-size-18); }
  .favorite-btn:hover { background: var(--surface-container); }
  .favorite-btn.on { color: #d99b00; }
  .project-card-menu-wrap { position: relative; }
  .project-card-menu-button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: var(--font-size-20); }
  .project-card-menu-button:hover { background: rgba(255,255,255,.72); }
  .project-card-menu { position: absolute; top: 37px; right: 0; z-index: 35; width: 190px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-raised); box-shadow: var(--shadow-md); animation: menuEnter .16s var(--motion-standard); }
  .project-card-menu > button { width: 100%; min-height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: var(--ink); border: 0; border-radius: 8px; background: transparent; text-align: left; }
  .project-card-menu > button:hover { background: var(--surface-container-low); }
  .project-card-menu .danger-menu-item { color: var(--google-red); }
  .project-card h3 { margin: 14px 0 4px; font-size: var(--font-size-17); }
  .project-card .description { display: -webkit-box; overflow: hidden; margin: 0; color: var(--muted); -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .project-agent-tag { width:fit-content;max-width:100%;display:flex;align-items:center;gap:6px;margin-top:10px;padding:4px 8px;overflow:hidden;color:var(--project-accent);border-radius:11px;background:rgba(255,255,255,.68);text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-9);font-weight:700; }
  .card-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 16px; color: var(--muted); font-size: var(--font-size-12); }
  .card-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 11px; padding-top: 11px; border-top: 1px solid color-mix(in srgb,var(--project-accent) 13%,#e8eaed); color: var(--muted); font-size: var(--font-size-11); }
  .card-stats span { display: grid; gap: 1px; }
  .card-stats b { color: var(--ink); font-size: var(--font-size-14); }
  .card-owner { margin-top: 8px; color: var(--muted); font-size: var(--font-size-11); }
  .status-pill { display: inline-flex; width: fit-content; padding: 3px 8px; color: #137333; border-radius: 10px; background: #dff3e4; font-size: var(--font-size-11); text-transform: capitalize; }
  .status-pill.archived { color: #5f6368; background: #e9ecef; }
  .status-pill.planning { color: #9a6700; background: #fff1bf; }
  .status-pill.draft { color:#8a5300;background:#fef4df; }
