<style>
  :root {
    --blue: #0b57d0;
    --blue-soft: #d3e3fd;
    --ink: #1f1f1f;
    --muted: #5f6368;
    --line: #dadce0;
    --surface: #fff;
    --surface-soft: #f8fafd;
    --sidebar: #f6f8fc;
    --danger: #b3261e;
    --shadow: 0 8px 28px rgba(60,64,67,.16);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); background: var(--surface); font: 14px/1.45 Arial, Helvetica, sans-serif; overflow: hidden; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  a { color: var(--blue); text-decoration: none; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .eyebrow { margin: 0 0 5px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .gemini-mark { color: #7b61ff; font-size: 30px; background: linear-gradient(135deg,#0b57d0,#9b72cb,#d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .gemini-mark.large { font-size: 48px; }
  .boot-loader { height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; background: #fff; }
  .spinner { width: 28px; height: 28px; border: 3px solid #d3e3fd; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .setup-screen { height: 100%; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 0,#e8f0fe 0,transparent 35%),#f8fafd; overflow: auto; }
  .setup-card { width: min(560px,100%); padding: 42px; background: #fff; border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
  .setup-card h1 { margin: 12px 0 6px; font-size: 28px; }

  .app-shell { height: 100%; display: grid; grid-template: 64px 1fr / 248px 1fr; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #eef0f2; z-index: 10; }
  .brand { width: 218px; display: flex; align-items: center; gap: 10px; font-size: 18px; white-space: nowrap; }
  .drive-cube { color: var(--blue); }
  .global-search { flex: 1; max-width: 720px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 24px; background: #edf2fc; }
  .global-search input { width: 100%; height: 46px; border: 0; outline: 0; background: transparent; }
  .icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #444746; font-size: 20px; }
  .icon-btn:hover { background: #f1f3f4; }
  .avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: #5f6368; font-weight: 700; }
  .mobile-only { display: none; }

  .sidebar { display: flex; flex-direction: column; padding: 18px 12px; background: var(--sidebar); overflow: auto; }
  .new-btn { display: flex; align-items: center; gap: 10px; padding: 15px 20px; margin: 0 4px 22px; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 1px 3px rgba(60,64,67,.3); font-weight: 600; }
  .new-btn span { font-size: 24px; }
  .sidebar nav { display: grid; gap: 3px; }
  .nav-item { display: flex; gap: 14px; align-items: center; padding: 11px 18px; border: 0; border-radius: 22px; background: transparent; text-align: left; color: #3c4043; }
  .nav-item.active { background: var(--blue-soft); color: #041e49; font-weight: 700; }
  .sidebar-footer { margin-top: auto; padding: 16px 12px 4px; color: var(--muted); }
  .key-status { margin-bottom: 8px; padding: 8px 10px; border-radius: 10px; background: #fff; font-size: 12px; }
  .key-status.ready { color: #137333; background: #e6f4ea; }

  .main-content { overflow: auto; background: #fff; }
  .view { min-height: 100%; padding: 34px 40px 60px; }
  .page-heading, .project-header, .content-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .page-heading h1, .project-header h1 { margin: 0; font-size: 30px; font-weight: 500; }
  .page-heading p, .project-header p { margin-top: 5px; }
  .heading-actions, .project-actions, .toolbar-actions, .modal-actions { display: flex; gap: 10px; align-items: center; }
  select, input, textarea { width: 100%; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none; }
  input, select { height: 42px; padding: 0 12px; }
  textarea { padding: 11px 12px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(11,87,208,.12); }
  label { display: grid; gap: 7px; margin: 18px 0; font-weight: 600; }
  .optional { color: var(--muted); font-weight: 400; }
  .primary-btn, .secondary-btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .primary-btn { color: #fff; border: 1px solid var(--blue); background: var(--blue); }
  .primary-btn:hover { background: #0842a0; }
  .secondary-btn { color: var(--blue); border: 1px solid var(--line); background: #fff; }
  .secondary-btn:hover { background: #f8fafd; }
  .text-btn { padding: 4px 7px; color: var(--blue); border: 0; background: transparent; }
  .wide { width: 100%; }

  .project-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 18px; margin-top: 28px; }
  .project-card { min-height: 220px; display: flex; flex-direction: column; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; transition: box-shadow .15s,transform .15s; cursor: pointer; }
  .project-card:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(60,64,67,.15); }
  .card-top { display: flex; justify-content: space-between; gap: 10px; }
  .project-icon { width: 42px; height: 42px; display: grid; place-items: center; color: #185abc; border-radius: 12px; background: #e8f0fe; font-size: 20px; }
  .favorite-btn { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: #9aa0a6; font-size: 19px; }
  .favorite-btn.on { color: #f9ab00; }
  .project-card h3 { margin: 16px 0 4px; font-size: 18px; }
  .project-card .description { display: -webkit-box; overflow: hidden; margin: 0; color: var(--muted); -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .card-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 18px; color: var(--muted); font-size: 12px; }
  .card-stats { display: flex; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; color: var(--muted); font-size: 12px; }
  .status-pill { display: inline-flex; padding: 3px 8px; color: #137333; border-radius: 10px; background: #e6f4ea; font-size: 11px; text-transform: capitalize; }
  .status-pill.archived { color: #5f6368; background: #f1f3f4; }
  .status-pill.planning { color: #b06000; background: #fef7e0; }
  .empty-state { display: grid; place-items: center; padding: 100px 20px; text-align: center; }
  .empty-icon { font-size: 48px; color: #a8c7fa; }

  #project-view { padding: 0; }
  .project-header { min-height: 112px; padding: 22px 30px; border-bottom: 1px solid var(--line); }
  .project-title-wrap { flex: 1; min-width: 0; }
  .project-title-wrap h1, .project-title-wrap p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-tabs { display: flex; gap: 6px; padding: 8px 30px 0; border-bottom: 1px solid var(--line); }
  .project-tab { padding: 12px 16px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); }
  .project-tab.active { color: var(--blue); border-color: var(--blue); font-weight: 700; }
  .project-tab-panel:not(.chat-layout) { padding: 28px 34px 60px; }
  .chat-layout { height: calc(100vh - 64px - 112px - 52px); display: grid; grid-template-columns: 238px minmax(360px,1fr) 250px; }
  .conversation-sidebar, .source-selector { padding: 18px 14px; background: var(--surface-soft); overflow: auto; }
  .conversation-sidebar { border-right: 1px solid var(--line); }
  .source-selector { border-left: 1px solid var(--line); }
  .section-label { margin: 22px 8px 8px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
  .conversation-list { display: grid; gap: 4px; }
  .conversation-item { padding: 10px 11px; border: 0; border-radius: 12px; background: transparent; text-align: left; }
  .conversation-item:hover, .conversation-item.active { background: #e8f0fe; }
  .conversation-item strong, .conversation-item small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conversation-item small { margin-top: 3px; color: var(--muted); }
  .chat-panel { min-width: 0; display: flex; flex-direction: column; background: #fff; }
  .chat-empty { margin: auto; padding: 30px; text-align: center; }
  .chat-empty h2 { font-size: 28px; font-weight: 500; }
  .chat-messages { flex: 1; overflow: auto; padding: 28px max(24px,8%); }
  .message { max-width: 820px; margin: 0 auto 26px; }
  .message-header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; font-weight: 700; }
  .message-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #edf2fc; }
  .message.user .message-body { width: fit-content; max-width: 82%; margin-left: auto; padding: 12px 16px; border-radius: 20px 20px 4px 20px; background: #e8f0fe; }
  .message.user .message-header { justify-content: flex-end; }
  .message-body { line-height: 1.65; overflow-wrap: anywhere; }
  .message-body pre { padding: 14px; overflow: auto; border-radius: 10px; background: #f1f3f4; }
  .message-sources { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .message-tools { display: flex; gap: 8px; margin-top: 10px; }
  .composer-wrap { padding: 10px max(24px,8%) 18px; background: linear-gradient(transparent,#fff 20%); }
  .composer { display: flex; align-items: flex-end; gap: 10px; padding: 9px 10px 9px 16px; border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 2px 10px rgba(60,64,67,.12); }
  .composer textarea { max-height: 160px; min-height: 32px; padding: 6px 0; border: 0; box-shadow: none; resize: none; }
  .send-btn { width: 38px; height: 38px; flex: 0 0 auto; color: #fff; border: 0; border-radius: 50%; background: var(--blue); }
  .composer-wrap > small { display: block; margin-top: 7px; color: var(--muted); text-align: center; font-size: 10px; }
  .source-chips { display: flex; gap: 6px; padding: 0 6px 7px; overflow: auto; }
  .source-chip { flex: 0 0 auto; padding: 4px 9px; border-radius: 12px; background: #e8f0fe; color: #174ea6; font-size: 11px; }
  .panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 700; }
  .source-check { display: flex; grid-template-columns: 18px 1fr; align-items: start; gap: 9px; margin: 0; padding: 9px 6px; border-radius: 10px; font-weight: 400; }
  .source-check:hover { background: #eef2f7; }
  .source-check input { width: 16px; height: 16px; margin: 2px 0 0; }
  .source-check span { min-width: 0; overflow-wrap: anywhere; }

  .content-toolbar { margin-bottom: 22px; }
  .content-toolbar h2 { margin: 0; font-size: 24px; }
  .content-toolbar p { margin: 4px 0 0; }
  .file-button input { display: none; }
  .data-list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .data-row { display: grid; grid-template-columns: minmax(220px,1fr) 160px 150px auto; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #eee; }
  .data-row:last-child { border-bottom: 0; }
  .data-row.header { color: var(--muted); background: #f8fafd; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .row-actions { display: flex; justify-content: flex-end; gap: 6px; }
  .danger-btn { color: var(--danger); border: 0; background: transparent; }
  .checkbox-group { display: flex; gap: 18px; padding: 12px; border-radius: 10px; background: #f8fafd; }
  .checkbox-group label { display: flex; align-items: center; gap: 7px; margin: 0; font-weight: 400; }
  .checkbox-group input { width: 16px; height: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(32,33,36,.42); }
  .modal { position: relative; width: min(520px,100%); max-height: 90vh; overflow: auto; padding: 30px; border-radius: 24px; background: #fff; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 6px; font-size: 25px; }
  .modal-close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; font-size: 24px; }
  .modal-actions { justify-content: flex-end; margin-top: 22px; }
  .toast { position: fixed; left: 50%; bottom: 26px; z-index: 200; transform: translateX(-50%); max-width: min(520px,90vw); padding: 12px 18px; color: #fff; border-radius: 8px; background: #323232; box-shadow: var(--shadow); }
  .toast.error { background: #b3261e; }
  .busy { pointer-events: none; opacity: .6; }

  @media (max-width: 1050px) {
    .chat-layout { grid-template-columns: 210px 1fr; }
    .source-selector { display: none; }
  }
  @media (max-width: 760px) {
    body { overflow: auto; }
    .app-shell { height: auto; min-height: 100%; grid-template: 64px 1fr / 1fr; }
    .topbar { position: sticky; top: 0; }
    .brand { width: auto; font-size: 15px; }
    .global-search { display: none; }
    .mobile-only { display: inline-grid; }
    .sidebar { position: fixed; z-index: 30; top: 64px; bottom: 0; left: 0; width: 248px; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
    .sidebar.open { transform: translateX(0); }
    .main-content { overflow: visible; }
    .view { padding: 24px 18px 50px; }
    .page-heading, .project-header, .content-toolbar { align-items: flex-start; flex-direction: column; }
    .heading-actions, .project-actions, .toolbar-actions { flex-wrap: wrap; }
    #project-view { padding: 0; }
    .project-header { padding: 18px; display: grid; grid-template-columns: auto 1fr; }
    .project-actions { grid-column: 2; }
    .project-tabs { padding-left: 12px; overflow: auto; }
    .chat-layout { height: calc(100vh - 64px - 190px); grid-template-columns: 1fr; }
    .conversation-sidebar { display: none; }
    .chat-messages { padding: 20px 14px; }
    .composer-wrap { padding: 10px 12px; }
    .data-row { grid-template-columns: 1fr auto; }
    .data-row > :nth-child(2), .data-row > :nth-child(3) { display: none; }
    .form-grid { grid-template-columns: 1fr; gap: 0; }
  }
</style>
