<style>
  /*
   * Agent Console design dictionary.
   * Change shared colors and typography here without hunting through views.
   */
  :root {
    /* Professional blue-gray navigation palette. */
    --color-blue-gray-950: #263442;
    --color-blue-gray-800: #3f5062;
    --color-blue-gray-700: #52657a;
    --color-blue-gray-600: #6f8195;
    --color-blue-gray-300: #c8d2dc;
    --color-blue-gray-200: #dce3ea;
    --color-blue-gray-100: #edf1f5;
    --color-blue-gray-50: #f6f8fa;

    /* Project-panel tabs: deliberately independent from the project theme. */
    --side-tab-accent: var(--color-blue-gray-700);
    --side-tab-accent-light: var(--color-blue-gray-600);
    --side-tab-surface: var(--color-blue-gray-100);
    --side-tab-border: var(--color-blue-gray-300);

    /* Friendly blue conversation surfaces: deliberately theme-independent. */
    --chat-user-surface: linear-gradient(145deg,#deedff 0%,#edf5ff 58%,#f7faff 100%);
    --chat-assistant-surface: linear-gradient(145deg,#f9fcff 0%,#edf5ff 100%);
    --chat-message-border: #c7d9ed;
    --chat-message-text: #1f1f1f;
    --chat-source-surface: #f3f8fe;
    --chat-message-shadow: 0 6px 18px rgba(55,94,138,.10);

    /* Generated artifact responses use a stable teal identity. */
    --artifact-accent: #0f766e;
    --artifact-accent-light: #2a9d8f;
    --artifact-surface: #edf8f6;
    --artifact-border: #bcded9;
    --artifact-label: #0b665f;

    /* Form controls and scrollbars. */
    --control-border: #c9d5e2;
    --control-border-hover: #8ca9c7;
    --control-focus: #568bc2;
    --control-surface: #ffffff;
    --control-surface-soft: #f7faff;
    --selected-source-scrollbar: #779fc8;
    --selected-source-scrollbar-track: #e7eff7;
    --panel-scrollbar-size: 12px;

    /*
     * Current typography scale. These values preserve the existing layout.
