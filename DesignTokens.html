<style>
  /*
   * Agent Console design dictionary.
   * Change shared colors and typography here without hunting through views.
   */
  :root {
    /*
     * Typography system.
     * Comfortaa gives the console its identity; Nunito Sans remains highly
     * legible in chat, forms, cards, documents, and other dense interfaces.
     */
    --font-family-display: "Comfortaa Local", "Comfortaa", "Trebuchet MS", sans-serif;
    --font-family-body: "Nunito Sans", Arial, Helvetica, sans-serif;
    --font-family: var(--font-family-body);
    --font-weight-regular: 400;
    --font-weight-medium: 600;
    --font-weight-bold: 700;
    --line-height-tight: 1.2;
    --line-height-body: 1.55;

    /* Professional blue-gray navigation palette. */
    --color-blue-gray-950: #263442;
    --color-blue-gray-800: #3f5062;
    --color-blue-gray-700: #52657a;
    --color-blue-gray-600: #6f8195;
    --color-blue-gray-300: #c8d2dc;
    --color-blue-gray-200: #dce3ea;
    --color-blue-gray-100: #edf1f5;
    --color-blue-gray-50: #f6f8fa;

    /* Project-panel tabs: deliberately independent from the project theme. */
    --side-tab-accent: var(--color-blue-gray-700);
    --side-tab-accent-light: var(--color-blue-gray-600);
    --side-tab-surface: var(--color-blue-gray-100);
    --side-tab-border: var(--color-blue-gray-300);

    /* Friendly blue conversation surfaces: deliberately theme-independent. */
    --chat-user-surface: linear-gradient(145deg,#deedff 0%,#edf5ff 58%,#f7faff 100%);
    --chat-assistant-surface: linear-gradient(145deg,#f9fcff 0%,#edf5ff 100%);
    --chat-message-border: #c7d9ed;
    --chat-message-text: #1f1f1f;
    --chat-source-surface: #f3f8fe;
    --chat-message-shadow: 0 6px 18px rgba(55,94,138,.10);

    /* Generated artifact responses use a stable teal identity. */
    --artifact-accent: #0f766e;
    --artifact-accent-light: #2a9d8f;
    --artifact-surface: #edf8f6;
    --artifact-border: #bcded9;
    --artifact-label: #0b665f;

    /* Form controls and scrollbars. */
    --control-border: #c9d5e2;
    --control-border-hover: #8ca9c7;
    --control-focus: #568bc2;
    --control-surface: #ffffff;
    --control-surface-soft: #f7faff;
    --selected-source-scrollbar: #779fc8;
    --selected-source-scrollbar-track: #e7eff7;
    --panel-scrollbar-size: 12px;

    /* Seven readable sizes control the entire application. */
    --type-meta: 12px;
    --type-label: 14px;
    --type-body: 16px;
    --type-subtitle: 18px;
    --type-title: 24px;
    --type-heading: 32px;
    --type-display: 48px;

    /* Home identity: tune these two values without touching component CSS. */
    --type-app-title: clamp(54px, 7.4vw, 88px);
    --type-app-tagline: clamp(38px, 5.4vw, 64px);

    /* Compatibility map: existing components now resolve to the seven sizes. */
    --font-size-7: var(--type-meta);
    --font-size-8: var(--type-meta);
    --font-size-9: var(--type-meta);
    --font-size-10: var(--type-meta);
    --font-size-11: var(--type-label);
    --font-size-12: var(--type-label);
    --font-size-13: var(--type-label);
    --font-size-14: var(--type-body);
    --font-size-15: var(--type-body);
    --font-size-16: var(--type-body);
    --font-size-17: var(--type-subtitle);
    --font-size-18: var(--type-subtitle);
    --font-size-19: var(--type-subtitle);
    --font-size-20: var(--type-subtitle);
    --font-size-21: var(--type-title);
    --font-size-22: var(--type-title);
    --font-size-23: var(--type-title);
    --font-size-24: var(--type-title);
    --font-size-25: var(--type-title);
    --font-size-26: var(--type-title);
    --font-size-27: var(--type-title);
    --font-size-28: var(--type-title);
    --font-size-30: var(--type-heading);
    --font-size-31: var(--type-heading);
    --font-size-32: var(--type-heading);
    --font-size-34: var(--type-heading);
    --font-size-36: var(--type-heading);
    --font-size-38: var(--type-heading);
    --font-size-48: var(--type-display);
    --font-size-58: var(--type-display);

    /* Semantic aliases retained for components that need finer naming. */
    --type-caption: var(--type-meta);
    --type-body-small: var(--type-label);

    /* Material glyph sizes are separate from text sizes. */
    --icon-size-standard: 23px;
    --icon-size-compact: 21px;
  }
</style>
