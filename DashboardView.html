<section id="dashboard-view" class="view dashboard-view">
  <div class="page-heading">
    <div>
      <p class="eyebrow">PROJECT LIBRARY</p>
      <h1>Projects</h1>
      <p class="muted">Your agents, sources, conversations, and generated files in one place.</p>
    </div>
    <div class="heading-actions">
      <select id="status-filter" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option value="active">Ongoing</option>
        <option value="planning">Planning</option>
        <option value="archived">Archived</option>
      </select>
      <button id="create-project-heading" class="primary-btn">＋ Create project</button>
    </div>
  </div>
  <div id="project-grid" class="project-grid"></div>
  <div id="empty-projects" class="empty-state hidden">
    <div class="empty-icon">✦</div>
    <h2>No projects in this view</h2>
    <p>Create a project or refresh to discover copied folders in Drive.</p>
  </div>
</section>
