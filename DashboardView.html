<section id="dashboard-view" class="view dashboard-view">
  <div class="catalog-header project-catalog-header">
    <div class="catalog-heading-row">
      <button id="projects-back-home" class="icon-btn" aria-label="Back to home" title="Back to home">←</button>
      <span class="catalog-route-mark project-route-mark" aria-hidden="true">▦</span>
      <div class="catalog-title-block"><p class="eyebrow">PROJECT LIBRARY</p><h1>Projects</h1><p class="muted">Use published agents with isolated knowledge and project-specific sources.</p></div>
    </div>
    <div class="catalog-actions project-catalog-actions" aria-label="Project search and actions">
      <div class="dashboard-search project-search"><span aria-hidden="true">⌕</span><input id="global-search" placeholder="Search projects" aria-label="Search projects"></div>
      <button id="refresh-projects" class="secondary-btn compact-btn" title="Refresh projects"><span aria-hidden="true">↻</span><span class="refresh-label">Refresh</span></button>
      <button id="create-project-heading" class="primary-btn project-new-btn"><span aria-hidden="true">＋</span><span class="button-label">New project</span></button>
    </div>
  </div>
  <div class="project-filter-bar">
    <div class="filter-bar-copy"><strong>Project views</strong><span>Focus the library by status or favorites.</span></div>
    <div class="filter-chips" role="group" aria-label="Filter projects">
      <button class="filter-chip active" data-dashboard-filter="all"><span>▦</span> All</button>
      <button class="filter-chip" data-dashboard-filter="active"><span class="filter-dot ongoing-dot"></span> Ongoing</button>
      <button class="filter-chip" data-dashboard-filter="favorite"><span>★</span> Favorites</button>
      <button class="filter-chip" data-dashboard-filter="planning"><span class="filter-dot planning-dot"></span> Planning</button>
      <button class="filter-chip" data-dashboard-filter="archived"><span class="filter-dot archived-dot"></span> Archived</button>
    </div>
  </div>
  <div id="project-grid" class="project-grid"></div>
  <div id="empty-projects" class="empty-state hidden">
    <div class="empty-icon">✦</div>
    <h2>No projects in this view</h2>
    <p>Create a project or refresh to discover copied folders in Drive.</p>
  </div>
</section>
