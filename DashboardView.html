<section id="dashboard-view" class="view dashboard-view">
  <div class="dashboard-header">
    <div class="dashboard-intro">
      <div class="route-heading"><button id="projects-back-home" class="icon-btn" aria-label="Back to home">←</button><div><p class="eyebrow">PROJECT LIBRARY</p><h1>Projects</h1></div></div>
      <p class="muted">Use a published agent with isolated agent knowledge and project-specific sources.</p>
    </div>
    <div class="dashboard-command-bar" aria-label="Project search and filters">
      <div class="dashboard-primary-controls">
        <div class="dashboard-search"><span aria-hidden="true">⌕</span><input id="global-search" placeholder="Search projects" aria-label="Search projects"></div>
        <button id="refresh-projects" class="icon-btn command-icon-btn" title="Refresh projects" aria-label="Refresh projects">↻</button>
        <button id="create-project-heading" class="primary-btn"><span aria-hidden="true">＋</span><span class="button-label">New project</span></button>
      </div>
      <div class="filter-chips" role="group" aria-label="Filter projects">
        <button class="filter-chip active" data-dashboard-filter="all"><span>▦</span> All</button>
        <button class="filter-chip" data-dashboard-filter="active"><span class="filter-dot ongoing-dot"></span> Ongoing</button>
        <button class="filter-chip" data-dashboard-filter="favorite"><span>★</span> Favorites</button>
        <button class="filter-chip" data-dashboard-filter="planning"><span class="filter-dot planning-dot"></span> Planning</button>
        <button class="filter-chip" data-dashboard-filter="archived"><span class="filter-dot archived-dot"></span> Archived</button>
      </div>
    </div>
  </div>
  <div id="project-grid" class="project-grid"></div>
  <div id="empty-projects" class="empty-state hidden">
    <div class="empty-icon">✦</div>
    <h2>No projects in this view</h2>
    <p>Create a project or refresh to discover copied folders in Drive.</p>
  </div>
</section>
